# Builds the web app (the explorer, the documentation and the references page) from the current
# model and publishes it to GitHub Pages. Line lists and the explorer's exported data are cached
# between runs, keyed on everything the export reads (the package, its parameter files, the atlas and
# observation files, the locked dependencies): a push that changes none of them, such as a change to
# the documentation or the app's JavaScript, reuses the data and only rebuilds the site (a few minutes).
#
# It runs after the test suite passes on a push to main, never on its own push, so a change that fails
# the tests is not published.
name: Web app

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# a deploy in progress is left to finish; a newer run waits, and replaces any that was already waiting
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # the commit the tests passed on (a manual run builds the branch it was started from)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore line lists
        uses: actions/cache@v4
        with:
          path: ~/.cache/i2spec
          key: i2spec-${{ hashFiles('src/i2spec/**/*.py', 'src/i2spec/data/**') }}
          restore-keys: i2spec-
      - name: Restore the explorer's data
        # an exact key only: `i2spec web build` re-exports when web/data/ is absent, and a stale copy
        # restored from an older key would be published as it is
        uses: actions/cache@v4
        with:
          path: web/data
          key: web-data-${{ hashFiles('src/i2spec/**', 'data/atlas_lines/**', 'data/observations/**', 'pyproject.toml', 'uv.lock') }}
      - run: uv sync --locked
      - name: Export the model (only if it changed) and build the site
        run: uv run i2spec web build site
      - name: Check the browser physics against the Python model
        run: |
          uv run python web/make_reference.py > web/reference.json
          node web/test_physics.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
