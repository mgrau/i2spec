# The test suite on every push and pull request. Line lists are cached as in pages.yml, keyed on the
# model code and parameter files, so only a model change pays for rebuilding them. A change that touches
# only the documentation, the explorer's static files or other workflows runs just the site tests
# (tests/test_webapp.py, seconds) instead of the whole suite (~17 min).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      model: ${{ steps.diff.outputs.model }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Does the change reach the model?
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # a manual run, a new branch or a force-push without a usable base: test everything
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "model=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$files"
          other=$(echo "$files" | grep -vE '^(documentation/|docs/|web/|notebooks/|mkdocs\.yml$|[^/]+\.md$|CITATION\.cff$|LICENSE$|\.github/workflows/(pages|release)\.yml$)' || true)
          if [ -n "$other" ]; then echo "model=true" >> "$GITHUB_OUTPUT"; else echo "model=false" >> "$GITHUB_OUTPUT"; fi

  pytest:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # the oldest Python pyproject.toml allows, and the newest
        python: ["3.11", "3.14"]
    name: pytest (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Restore line lists
        if: needs.changes.outputs.model == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/i2spec
          key: i2spec-${{ hashFiles('src/i2spec/**/*.py', 'src/i2spec/data/**') }}
          restore-keys: i2spec-
      - run: uv sync --locked
      - name: The whole suite
        if: needs.changes.outputs.model == 'true'
        run: uv run python -m pytest -q
      - name: The site tests only (documentation and explorer files changed)
        if: needs.changes.outputs.model != 'true'
        run: uv run python -m pytest -q tests/test_webapp.py

  wheel:
    # the installed package, away from the checkout: it must carry everything it needs
    needs: changes
    if: needs.changes.outputs.model == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Install the wheel into a clean environment and use it
        run: |
          uv venv /tmp/clean
          VIRTUAL_ENV=/tmp/clean uv pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python -c "from i2spec.model import RovibronicModel; m = RovibronicModel(); print(m.transition(32, 0, 56, 'R')); print(len(m.hyperfine_components(32, 0, 56, 'R')[1]))"
