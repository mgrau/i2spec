# Publish to PyPI when a GitHub release is published. Uses PyPI trusted publishing (no token):
# the project's publisher on pypi.org names this repository, this workflow and the "pypi" environment.
# Zenodo archives the same release and mints its DOI through the GitHub integration.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    # the whole suite on the released commit: nothing reaches PyPI that fails it
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Restore line lists
        uses: actions/cache@v4
        with:
          path: ~/.cache/i2spec
          key: i2spec-${{ hashFiles('src/i2spec/**/*.py', 'src/i2spec/data/**') }}
          restore-keys: i2spec-
      - run: uv sync --locked
      - run: uv run python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/i2spec
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
