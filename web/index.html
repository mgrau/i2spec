<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iodine Line Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="site.css">
<style>
* { box-sizing: border-box; }
/* the hidden attribute must win over the display rules below (the cell fields are hidden this way) */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 400 15px/1.5 var(--body); display: flex; flex-direction: column; overflow: hidden;
}
a { color: var(--accent); }

header {
  display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap;
  padding: 5px 14px; background: var(--surface); border-bottom: 1px solid var(--rule);
}
h1 { font: 600 17px/1.1 var(--display); margin: 0; letter-spacing: .01em; }
#prov { margin-left: auto; font: 400 10.5px/1.3 var(--mono); color: var(--ink-3); text-align: right; }
#theme {
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2);
  border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer;
}

.controls {
  display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: flex-end;
  padding: 7px 14px; background: var(--surface-2); border-bottom: 1px solid var(--rule);
}
.field { display: grid; gap: 4px; }
.field > label, .grouplabel {
  font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);
}
input, select, button { font: 400 14px var(--body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; }
input { font-family: var(--mono); font-size: 13px; }
#lo, #hi { width: 9.5em; }
#find { width: 11em; }
#laser { width: 7.5em; }
.laser, .exports { display: inline-flex; gap: 4px; }
.laser select { padding: 6px 4px; }
.exports button { padding: 5px 9px; font-size: 12.5px; color: var(--ink-2); }
button:disabled { opacity: .45; cursor: default; border-color: var(--rule); }
#gamma, #mod { width: calc(5ch + 44px); }
#temp, #cold, #path { width: calc(7ch + 44px); }   /* 7 digits plus padding and the number spinner */
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#go { background: var(--accent); border-color: var(--accent); color: var(--ground); font-weight: 500; padding: 6px 14px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; border-radius: 0; background: transparent; padding: 6px 11px; font-size: 13px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
#presets { display: flex; gap: 5px; flex-wrap: wrap; }
#presets button { padding: 5px 9px; font-size: 12.5px; color: var(--ink-2); }

main {
  flex: 1; min-height: 0; display: grid; gap: 1px; background: var(--rule);
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: minmax(190px, 42%) minmax(0, 1fr);
}
section { background: var(--surface); min-width: 0; min-height: 0; display: flex; flex-direction: column; }
#plotwrap { position: relative; grid-area: 1 / 1; }
.tablewrap { grid-area: 2 / 1; }
#detail { grid-area: 1 / 2 / 3 / 3; }
#plot { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#plot.grabbing { cursor: grabbing; }
/* the trace layer, over the axes: clipped to the plot area and moved by a CSS transform while zooming */
#traceclip { position: absolute; top: 0; overflow: hidden; pointer-events: none; }
#trace { position: absolute; top: 0; pointer-events: none; will-change: transform; }
#crosshair { position: absolute; width: 1px; background: var(--ink-3); opacity: .5; pointer-events: none; }
#selection { position: absolute; background: color-mix(in srgb, var(--accent) 18%, transparent);
  border-left: 1px solid var(--accent); border-right: 1px solid var(--accent); pointer-events: none; }
#selection::after { content: attr(data-span); position: absolute; top: 2px; left: 50%;
  transform: translateX(-50%); font: 11px var(--mono); color: var(--accent); white-space: nowrap; }
#readout {
  position: absolute; top: 10px; right: 16px; font: 12px/1.4 var(--mono); color: var(--ink-2);
  background: color-mix(in srgb, var(--surface) 82%, transparent); padding: 3px 7px; border-radius: 5px;
  pointer-events: none; white-space: pre;
}
#hint { font: 11px var(--body); color: var(--ink-3); }
#readout:empty { display: none; }
/* phones: a tap selects a line, and the table shows its position */
@media (max-width: 880px), (hover: none) { #readout, #crosshair { display: none !important; } }

#detail { overflow-y: auto; padding: 14px 16px 22px; display: block; }
#detail h2 { font: 600 17px/1.2 var(--display); margin: 0 0 6px; }
#detail h3 { font: 600 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3); margin: 18px 0 8px; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { font: 500 10.5px/1.6 var(--mono); padding: 1px 7px; border-radius: 999px; }
.chip.good { color: var(--good); background: var(--good-bg); }
.chip.warn { color: var(--warn); background: var(--warn-bg); }
.chip.bad { color: var(--bad); background: var(--bad-bg); }
.chip.none { color: var(--none); background: var(--none-bg); }
dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 0; }
dt { font: 500 11.5px/1.65 var(--mono); letter-spacing: .02em; color: var(--ink-3); }
dd { margin: 0; font: 13px var(--mono); font-variant-numeric: tabular-nums; }
.note { font-size: 12.5px; line-height: 1.5; color: var(--ink-2); margin: 10px 0 0; }
.note code { font: 12px var(--mono); background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }
#hfs { width: 100%; display: block; }

.tablewrap { overflow: auto; }
table { border-collapse: collapse; width: 100%; font: 13px var(--mono); font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; z-index: 1; background: var(--surface); text-align: right;
  font: 500 11px var(--mono); letter-spacing: .04em; color: var(--ink-3);
  padding: 8px 10px; border-bottom: 1px solid var(--rule); cursor: pointer; white-space: nowrap; }
th.sorted { color: var(--accent); }
th:first-child, td:first-child { text-align: left; }
td { padding: 4px 10px; text-align: right; border-bottom: 1px solid var(--rule-2); white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr[aria-selected="true"] { background: var(--accent-soft); }
tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
table.sub { margin-top: 4px; }
table.sub th { font-size: 9.5px; padding: 5px 6px; cursor: default; }
table.sub td { padding: 3px 6px; font-size: 12px; }
.measwrap { overflow-x: auto; }
table.meas tr.srcrow td { text-align: left; font: 12.5px var(--body); padding-top: 8px; white-space: normal; border-bottom: 0; }
table.meas .n { color: var(--ink-3); }
th.src { text-align: left; }
td.src { text-align: left; font: 12px var(--body); }
td.src a, table.meas a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
/* how each line is known: precision, atlas, or the model alone */
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.sw.k-precision, #rows tr.k-precision td:first-child { --k: var(--cls-precision); }
.sw.k-atlas, #rows tr.k-atlas td:first-child { --k: var(--cls-atlas); }
.sw.k-model { --k: var(--cls-model); }
#show button[aria-pressed="false"] { color: var(--ink-3); background: transparent; font-weight: 400; }
#show button[aria-pressed="false"] .sw { background: transparent; box-shadow: inset 0 0 0 1.5px var(--k); }
#rows tr.k-model td:first-child { --k: var(--cls-model); }
.sw { background: var(--k); }
#rows tr td:first-child { box-shadow: inset 4px 0 0 var(--k, transparent); padding-left: 14px; }
#rows tr.k-model td:first-child { box-shadow: inset 2px 0 0 color-mix(in srgb, var(--k) 55%, transparent); }
#rows tr.more td { text-align: center; font: 12px var(--body); color: var(--ink-3); padding: 9px; box-shadow: none; cursor: pointer; }
#rows tr.more:hover td { color: var(--accent); }
.chip.kind { background: color-mix(in srgb, var(--k) 16%, transparent); color: var(--ink); }
.chip.kind.k-precision { --k: var(--cls-precision); }
.chip.kind.k-atlas { --k: var(--cls-atlas); }
.chip.kind.k-model { --k: var(--cls-model); }

#statusbar { display: flex; gap: 6px 18px; justify-content: space-between; flex-wrap: wrap; padding: 6px 18px;
  font: 11.5px var(--mono); color: var(--ink-3); background: var(--surface); border-top: 1px solid var(--rule); }

/* the options button, the view summary and the zoom buttons exist for small screens only */
#optbtn, #summary, .phone-only { display: none; }
.pagelinks { display: flex; gap: 16px; font-size: 14px; padding: 4px 0; }

/* Phones and narrow windows: the spectrum takes half the screen and the list sits under it. Every
   option is in a panel that slides down from the header on demand. */
@media (max-width: 880px) {
  /* the page itself never scrolls: header, spectrum and list fill the screen, and the list scrolls */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { height: 100dvh; }
  header { padding: 8px 12px; gap: 4px 10px; align-items: center; }
  h1 { font-size: 18px; }
  #prov { display: none; }
  .site-nav a { font-size: 12px; padding: 4px 6px; }
  /* first row: title, theme, options; second: pages; third: what is on screen */
  /* one row: title, References, options, theme; the documentation link is in the options panel */
  h1 { order: 0; font-size: 16px; } .site-nav { order: 1; } #optbtn { order: 2; margin-left: auto; } #theme { order: 3; }
  .site-nav a[href="docs/index.html"] { display: none; }
  .controls .phone-only { display: grid; grid-column: 1 / -1; }
  #summary { display: block; flex-basis: 100%; order: 5; font: 12px var(--mono); color: var(--ink-2); }
  #optbtn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; font-size: 13px; }
  #optbtn[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; padding: 0 12px;
    max-height: 0; overflow: hidden; border-bottom-width: 0; transition: max-height .25s ease, padding .25s ease; }
  .controls.open { max-height: 70dvh; overflow-y: auto; padding: 12px; border-bottom-width: 1px; }
  .controls .field { min-width: 0; }
  .controls .field:has(#presets), .controls .field:has(#show), .controls .field:has(#mode), .controls .field:has(#go), .controls .field:has(#laser), .controls .field:has(#csv) { grid-column: 1 / -1; }
  #laser { flex: 1; min-width: 0; }
  #lo, #hi, #find, #temp, #cold, #path, #unit, #iso { width: 100%; }
  #go { width: 100%; }
  main { flex: 1; min-height: 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: 48% minmax(0, 1fr);
    padding-bottom: 50px; }
  #plotwrap { grid-area: 1 / 1; } .tablewrap { grid-area: 2 / 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
  /* the selected line: a sheet at the bottom showing its name, which a tap opens to the full detail */
  #detail { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; max-height: 50px; overflow: hidden;
    padding: 0 14px 16px; border-top: 1px solid var(--rule); box-shadow: 0 -6px 18px rgb(0 0 0 / .12);
    transition: max-height .25s ease; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  #detail.expanded { max-height: 72dvh; overflow-y: auto; overscroll-behavior: contain; }
  #detail h2 { position: sticky; top: 0; background: var(--surface); margin: 0 -14px 6px; padding: 14px 14px 10px;
    cursor: pointer; display: flex; align-items: baseline; gap: 8px; }
  #detail h2::after { content: "▴ details"; margin-left: auto; font: 12px var(--body); color: var(--ink-3); }
  #detail.expanded h2::after { content: "▾ close"; }
  #statusbar { display: none; }
  /* the wavenumber and frequency columns repeat the wavelength; the detail pane has them */
  #head th:nth-child(3), #head th:nth-child(4), #rows td:nth-child(3), #rows td:nth-child(4) { display: none; }
  #hint { display: none; }
}
/* the narrowest phones: the header still fits on one row */
@media (max-width: 400px) {
  header { gap: 4px 6px; padding: 5px 10px; }
  h1 { font-size: 15px; }
  .site-nav a { padding: 4px 3px; }
  #optbtn { padding: 5px 8px; }
  #theme { padding: 4px 7px; }
}
@media (max-width: 340px) {
  h1 { font-size: 13.5px; }
  .site-nav a, #optbtn { font-size: 12px; }
  #optbtn { padding: 4px 6px; }
}
@media (prefers-reduced-motion: reduce) { .controls { transition: none; } }
</style>

<header>
  <h1>Iodine Line Explorer</h1>
  <nav class="site-nav" aria-label="pages"><a href="docs/index.html">Docs</a><a href="docs/references.html">References</a></nav>
  <span id="prov">loading…</span>
  <button id="optbtn" aria-expanded="false" aria-controls="controls">Options ▾</button>
  <button id="theme" title="Switch between light and dark" aria-label="Switch between light and dark">◐</button>
  <span id="summary"></span>
</header>

<div class="controls" id="controls">
  <div class="field"><label for="lo">from</label><input id="lo"></div>
  <div class="field"><label for="hi">to</label><input id="hi"></div>
  <div class="field"><label for="unit">unit</label><select id="unit">
    <option value="nm">nm vacuum</option><option value="nm-air">nm air</option>
    <option value="cm-1">cm⁻¹</option><option value="THz">THz</option><option value="MHz">MHz</option>
  </select></div>
  <div class="field"><label for="go">&nbsp;</label><button id="go">Show</button></div>
  <div class="field"><label for="find">find a line ( / )</label><input id="find" placeholder="R(56) 32-0"></div>
  <div class="field"><label for="laser">laser fundamental ( L )</label><span class="laser">
    <input id="laser" placeholder="1064.49" title="a fundamental laser wavelength or frequency; Enter jumps to its harmonic">
    <select id="lunit" aria-label="unit of the fundamental">
      <option value="nm">nm vac</option><option value="nm-air">nm air</option>
      <option value="cm-1">cm⁻¹</option><option value="THz">THz</option><option value="MHz">MHz</option></select>
    <select id="harm" aria-label="harmonic order" title="harmonic order: the frequency iodine sees is n times the fundamental's">
      <option value="1">×1</option><option value="2" selected>×2</option><option value="3">×3</option><option value="4">×4</option></select>
    <button id="lasergo" title="show ±0.1 nm around the harmonic (±0.04 nm in sub-Doppler mode)">Go</button></span></div>
  <div class="field"><label for="iso">isotopologue</label><select id="iso"></select></div>
  <div class="field"><label for="temp">cell T (K)</label><input id="temp" type="number" value="293.15" step="5" min="200" max="600"></div>
  <div class="field"><label for="mode">y axis</label><span class="seg" id="mode">
    <button data-mode="sigma" aria-pressed="false">cross section</button>
    <button data-mode="trans" aria-pressed="false">transmission</button>
    <button data-mode="sub" aria-pressed="true" title="saturated absorption: Lamb dips of the hyperfine components; shown for spans up to 5 cm⁻¹">sub-Doppler</button></span></div>
  <div class="field cellonly" hidden><label for="cold">cold finger (°C)</label><input id="cold" type="number" value="20" step="5" min="-40" max="120"></div>
  <div class="field cellonly" hidden><label for="path">path (cm)</label><input id="path" type="number" value="10" step="1" min="0.1"></div>
  <div class="field subonly"><label for="gamma">Γ hom. (MHz)</label><input id="gamma" type="number" value="2" step="0.5" min="0.01"
    title="homogeneous FWHM of each resonance: natural, transit-time, pressure and power broadening together"></div>
  <div class="field subonly"><label for="det">detection</label><select id="det">
    <option value="0">signal</option><option value="1">1f</option><option value="3">3f</option></select></div>
  <div class="field subonly modonly" hidden><label for="mod">mod. p-p (MHz)</label><input id="mod" type="number" value="1" step="0.5" min="0.01"
    title="peak-to-peak frequency modulation for the harmonic (1f, 3f) signals"></div>
  <div class="field"><span class="grouplabel">show</span><span class="seg" id="show">
    <button data-kind="model" aria-pressed="true"><i class="sw k-model"></i>model</button>
    <button data-kind="atlas" aria-pressed="true"><i class="sw k-atlas"></i>atlas</button>
    <button data-kind="precision" aria-pressed="true"><i class="sw k-precision"></i>precision</button></span></div>
  <div class="field"><span class="grouplabel">jump to</span><span id="presets"></span></div>
  <div class="field"><span class="grouplabel">export CSV</span><span class="exports">
    <button id="csv" title="every line in view that the show toggles keep, in the table's order">lines in view</button>
    <button id="csvhfs" title="the hyperfine components of the selected line" disabled>hyperfine of selected</button></span></div>
  <div class="field phone-only"><span class="grouplabel">pages</span>
    <span class="pagelinks"><a href="docs/index.html">Documentation</a><a href="docs/references.html">References</a></span></div>
</div>

<main>
  <section id="plotwrap">
    <canvas id="plot"></canvas><div id="traceclip"><canvas id="trace"></canvas></div><div id="crosshair" hidden></div><div id="selection" hidden></div>
    <div id="readout"></div>


  </section>
  <section id="detail"></section>
  <section class="tablewrap"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></section>
</main>
<footer id="statusbar"><span id="status">loading…</span>
  <span id="hint">drag to pan · shift-drag to zoom to a range · scroll to zoom · ← → to pan · ↑↓ through the list</span></footer>

<script type="module" src="app.js"></script>
</html>
