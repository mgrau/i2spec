[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "i2spec"
version = "0.0.1"
description = "Open, physics-based model of the molecular iodine (I2) B-X spectrum"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.15",
    "textual>=0.80",
]

[project.scripts]
i2spec = "i2spec.cli:main"

[dependency-groups]
dev = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "pytest>=8",
    "sympy>=1.12",
]
# the research scripts in prototypes/: figures, and the APO atlas's HDF5 file
research = ["matplotlib>=3.8", "h5py>=3.16.0"]
notebook = ["jupyterlab>=4", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/i2spec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
