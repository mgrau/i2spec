id = "eng2004a"
citation = "J. A. Eng, J. L. Hardwick, J. A. Raasch and E. N. Wolf, \"Diode laser wavelength modulated spectroscopy of I2 at 675 nm\", Spectrochim. Acta A 60, 3413-3419 (2004), Tables 2 and 3"
source = "https://doi.org/10.1016/j.saa.2003.11.044 (publisher PDF)"
doi = "10.1016/j.saa.2003.11.044"
retrieved = "2026-10-28"
unit = "kHz/Pa (broadening and shift)"
exclude = "pending: held out of every fit, benchmark and the explorer until it is scored in a blind test"

transcription = """
Table 2 (p. 3417, "Pressure broadening coefficients for two strong unblended lines of I2 near 675 nm") and Table 3 (p. 3418,
"Pressure shift coefficients"), both read from 200 dpi images of the printed pages and matched to the text layer. Units
as printed: cm-1 Torr-1. Uncertainties are the statistical values in parentheses, in the last printed digit.
Conversion: cm-1/Torr x 2.99792458e7 kHz/cm-1 / 133.322 Torr-to-Pa = kHz/Pa. Coefficients have no pressure_Pa.

Entered (12 sets of values, 2 lines x 3 gases x broadening and shift):
- (5,7) P(69): broadening Ar 0.000258(3), H2O 0.000387(7), air 0.000302(2); shift Ar -3.93(8)e-5, H2O -3.73(20)e-5,
  air -3.89(5)e-5.
- (4,6) P(122): broadening Ar 0.000257(3), H2O 0.000401(7), air 0.000290(4); shift Ar -4.35(8)e-5, H2O -3.21(22)e-5,
  air -4.19(9)e-5.
Line labels: the paper gives the vibrational assignments as (v',v'') = (5,7) and (4,6) of the B-X band, so the
catalog-style labels 127I2 P(69) 5-7 and 127I2 P(122) 4-6 are used (the paper's own notation, not checked against
the held atlases). The paper's line centers are not entered (see notes). Component empty (whole line, no hyperfine
resolution: hyperfine_resolved false in the catalog).
Pressure broadening is the FWHM coefficient, as stated in the discussion ("the FWHM pressure broadening coefficient").
The shift is the printed sign (negative: to the red with added gas, consistent with Fig. 6).

Not entered: the Delta eQq values and the line centers of Table 1 (12 lines, Doppler-limited, with a calibration
systematic of about 240 MHz per the catalog and the authors' own statement that absolute positions are
compromised); the qualitative intensities of Table 1; Figs. 3-6 (spectra and the linear plots of Figs. 5 and 6 are
figure-only; the slopes are the printed Tables 2 and 3).

Consistency check (model-free, within the paper): the air broadening of P(69) (0.000302 cm-1/Torr = 9.05 GHz/Torr)
is about 10 % below the value the paper quotes from Fletcher & McDaniel (1995), corrected to 291 K: 3.35e-4 cm-1/Torr
(p. 3418). The paper calls the difference "slightly different". The P(69) and P(122) air shifts agree to 8 %.
"""
uncertainty = """
As printed: statistical 1 sigma, in the last printed digit (broadening (3), (7), (2), (3), (7), (4); shift (8), (20),
(5), (8), (22), (9)). The paper does not give a systematic term for the coefficients; its statement "Broadening 1-3 %,
shifts 2-7 % (statistical)" is in the catalog's notes and is not added here.
"""
notes = """
Two unblended lines of the B-X band near 675 nm (14818.5 cm-1 region), measured with a free-running diode laser at
18 C. The catalog's eQq and line-center content is not in this set. The coefficients overlap no held set in data/widths
(this is the first set in that folder), and they can be compared with wolf2009a (the full broadening study, catalog)
when that set is transcribed.
"""

[conditions]
method = "diode-laser wavelength-modulation spectroscopy (1f), free-running diode laser; 1 m cells at 18 C"
temperature_C = 18
temperature_K = 291.15
pressure_range_Torr = "0-47 (added Ar, H2O and air; Figs. 5 and 6 show the Ar case)"
cell_length_cm = 100
perturber_gas = "Ar, H2O, air"
