transcription = """
Table 1 (p. 163), typed from the text layer and checked against the page: three femtosecond-comb (KRISS,
H-maser/UTC reference) measurements of the Vietnam Metrology Institute He-Ne/I2 laser on f (a16) of
R(127) 11-5, as operated, at output powers of 80, 70 and 135 uW. One laser, one group.
Not entered: the uncertainty budget's sensitivity coefficients (power -0.106 kHz/uW, modulation
-8.39 kHz/MHz, cold-finger temperature -11.747 kHz/C); the beat measurement against the reference laser
(f - f = 6 kHz) and the wavelength-meter comparisons of Sect. II.2.
"""

uncertainty = "Table 2: 1.1 kHz combined (k = 1) at the 80 uW operating point; applied to all three rows."

notes = "Residuals against i2spec2026o (obs - model, after the shift correction): -116.1, -117.2 and -122.0 kHz, against -116.8 kHz for the CIPM value and -118.8/-120.2 kHz for hamid2006a. Checked with the shipped model only."

[conditions]
