basis = "Operated at the CIPM conditions (cold finger 15 C, 5.9-6.0 MHz), so bipm2003a's coefficients take the values to zero pressure, power and modulation as for the MeP value: 15 C = 17.28 Pa, -9.6(1.9) kHz/Pa; 5.9 MHz p-p at -10(2) kHz/MHz (the 135 uW row was at 6.0 MHz, 1 kHz more); power 0 +- 1 kHz/mW at 10 mW."
