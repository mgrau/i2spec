citation = "D. J. Ruben, S. G. Kukolich, L. A. Hackel, D. G. Youmans and S. Ezekiel, \"Laser-molecular beam measurement of hyperfine structure in the I2 spectrum\", Chem. Phys. Lett. 22, 326-330 (1973)"
source = "https://doi.org/10.1016/0009-2614(73)80104-6 (PDF supplied by Matt; library copy papers/Ruben1973_CPL_22_326.pdf)"
