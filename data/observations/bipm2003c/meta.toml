transcription = """
Page 1: adopted f(a1, P(62) 17-1) = 520 206 808.4 (2) MHz, the CIPM recommended value. Typed by hand.

Page 2: Table 1 127I2 P(62) 17-1: a2-a10 and a15, relative to a1. Parsed from the PDF text layer (pdftotext)
by script, not retyped. The text layer agrees with the page image. Each row's note keeps BIPM's letter for
the feature (the x column), copied as printed: lower case for a1-a6 (o ... j), upper case for a7-a10 and
a15 (I, H, G, F, A).

Not entered: the source data of section 2 (the NBS value and the ratio to the 633 nm standard). They are
the inputs of the adopted value.
"""
