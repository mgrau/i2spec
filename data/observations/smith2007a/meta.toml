id = "smith2007a"
citation = "R. P. Smith, P. A. Roos, J. K. Wahlstrand, J. A. Pipis, M. Belmonte Rivas and S. T. Cundiff, \"Optical frequency metrology of an iodine-stabilized He-Ne laser using the frequency comb of a quantum-interference-stabilized mode-locked laser\", J. Res. Natl. Inst. Stand. Technol. 112, 289-296 (2007)"
source = "https://doi.org/10.6028/jres.112.022 (open access; Matt's library copy papers/Smith2007_JResNIST112_289.pdf)"
