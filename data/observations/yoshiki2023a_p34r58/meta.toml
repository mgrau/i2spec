transcription = """
Table 7 (p. 7), "Hyperfine splittings of the P(34)44-0 line", and Table 8 (p. 8), "Hyperfine splittings of the
R(58)45-0 line": the "Obs" columns, f(a_n) - f(a1) of P(34) 44-0 and f(b_n) - f(b1) of R(58) 45-0, in kHz. Parsed
by script from the PDF text layer (thousands separators removed), converted kHz -> MHz exactly, and every row and
every asterisk checked against 200 dpi renderings of pp. 7-8. Check: each Obs value reproduces the printed
"Obs-Pred1", "Obs-Pred2" and "Obs-Cal" columns of Table 7 and the "Obs-Pred" and "Obs-Cal" columns of Table 8 to
0.1 kHz in all 30 rows, which confirms the Obs digits. The Obs-Cal of the paper's own four-term fit is kept in
the note column.

Entered: P(34) 44-0 a2, a6-a15 (11 rows) and R(58) 45-0 b2-b6, b8-b15 (13 rows), 24 rows. Both lines have even
J'' (34, 58) and 15 main components; a and b are the paper's series letters, and the numbers rank the components
by frequency, as in the rest of the collection. The assignment of the components to the two overlapped lines is
the authors' (Sect. 4, from the structures predicted by their v' = 44 formulas and by the Bodermann-Knoeckel-
Tiemann 2002 interpolation formulas).

Not entered, as in yoshiki2023a (which leaves out the starred values of Tables 2-3): the starred values the
authors excluded from their fits. P(34) 44-0 a3 281 390.0 and a4 284 642.5 kHz, "close" components; and P(34) 44-0
a5 319 427.4 kHz and R(58) 45-0 b7 395 097.5 kHz, which are one unresolved peak (the a5 of P(34) blended with the b7
of R(58), p. 8; the paper's fits leave them +174.9 and -177.5 kHz from their calculated positions). Also not
entered: the "Pred1", "Pred2", "Pred" and "Cal" columns, which are calculations (from the paper's Table 5 v' = 44
formulas, from the 2002 interpolation formulas, and from the paper's fits); the four-term constants of these
fits (Table 6, "HFS fitting") are in data/hyperfine_parameters/yoshiki2023a.

Relation to yoshiki2023a: the same paper and measurement campaign. yoshiki2023a holds Table 1, including the
absolute frequencies of the two reference components (P(34) 44-0 a1 and R(58) 45-0 b1), and the splittings of the
other five lines (Tables 2-3), but no splittings of these two lines; the rows here complete the paper's line data
and duplicate no held row. Together the two sets hold 103 rows, the "103 hyperfine transitions" of the abstract
(111 measured components less the 8 starred).

Consistency note (model-free): the blended peak reached through the two lines' references, Table 1 plus these
tables, is P(34) a1 + a5 = 583 161 790 043.2 kHz and R(58) b1 + b7 = 583 161 790 037.1 kHz, 6.1 kHz apart, against
about 0.7 kHz expected from the stated 0.3 kHz repeatability of the four values. The paper does not say whether
the a5 and b7 locks were one measurement; the difference is reported, not resolved.
"""

