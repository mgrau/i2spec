id = "lea2003a"
citation = "S. N. Lea, W. R. C. Rowley, H. S. Margolis, G. P. Barwood, G. Huang, P. Gill, J.-M. Chartier and R. S. Windeler, \"Absolute frequency measurements of 633 nm iodine-stabilized helium-neon lasers\", Metrologia 40, 84-88 (2003)"
source = "https://doi.org/10.1088/0026-1394/40/2/313 (PDF supplied by Matt; library copy papers/Lea2003_Metrologia_40_84.pdf)"
doi = "10.1088/0026-1394/40/2/313"
retrieved = "2026-10-20"
unit = "MHz"
exclude = "pending: transcribed 2026-10-21 and held out of every fit, benchmark and the explorer until Matt decides whether new sets join the training data or form a blind validation set; delete this line to admit it"

transcription = """
Typed from the text layer and checked against the pages: femtosecond-comb (Ti:sapphire, microstructure fibre,
H-maser) absolute frequencies of two NPL He-Ne/I2 lasers on R(127) 11-5 f (= a16):
- NPL-R18: 473 612 353 612.9 (0.6) kHz, the mean of five days (Table 1 gives each day as 600 + 13.46, 13.50,
  12.85, 12.20, 12.56 kHz), each corrected to the nominal cold-finger temperature (15 C) and 10 mW one-way
  intracavity power; modulation 6 MHz p-p.
- NPL-S: 473 612 353 613.3 (0.7) kHz, extracted from an August 2001 comb measurement of d, e, f and g.
One group per laser (each realization carries its own offset).
Not entered: BIPM-4's f, 473 612 353 608.1 (0.7) kHz, inferred from NPL-R18 and the beat matrix at BIPM (a laser
comparison, the abstract's headline value, not a separate measurement of iodine); the beat matrices; the 1995
NPL-S/BIPM-4 comparison.
"""

uncertainty = "As printed: 0.6 kHz (the standard deviation of the five daily values, each with 0.5 kHz for the modulation depth, 0.1 kHz temperature and 0.1 kHz power) and 0.7 kHz."

notes = "Measured after the CIPM 2001 value (bipm2003a), so not one of its sources. [shift_correction] repeats bipm2003a's (CIPM conditions). Residuals against i2spec2026o (obs - model): -333.8 and -333.4 kHz as measured, -107.9 and -107.5 kHz after the shift correction, where bipm2003a's a16 reads -116.8 kHz: these lasers sit 9 kHz above the CIPM 2001 value, as the paper says. Checked with the shipped model only."

[conditions]
cold_finger_C = 15.0
modulation_MHz_pp = 6.0
intracavity_power_mW = 10.0
method = "He-Ne/I2 lasers with internal cells, third-harmonic locking; Ti:sapphire femtosecond comb referenced to a hydrogen maser"

[shift_correction]
pressure_Pa = 17.28
pressure_kHz_per_Pa = -9.6
pressure_kHz_per_Pa_unc = 1.9
power_mW = 10.0
power_kHz_per_mW = 0.0
power_kHz_per_mW_unc = 1.0
modulation_MHz = 6.0
modulation_kHz_per_MHz = -10.0
modulation_kHz_per_MHz_unc = 2.0
basis = "The values are at (or corrected to) the CIPM standard operating conditions, so bipm2003a's coefficients take them to zero pressure, power and modulation exactly as for the MeP value: 15 C = 17.28 Pa, -9.6(1.9) kHz/Pa; 6 MHz p-p, -10(2) kHz/MHz; power 0 +- 1 kHz/mW at 10 mW."
