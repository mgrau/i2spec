id = "nishiyama2024a"
citation = "A. Nishiyama, S. Okubo, T. Kobayashi, A. Kawasaki, H. Inaba, Measurement of transition frequencies and hyperfine constants of molecular iodine at 520.2 nm, J. Opt. Soc. Am. B 41, 2290 (2024)"
source = "https://arxiv.org/abs/2409.16522"
doi = "10.1364/josab.531115"
retrieved = "2026-09-15"
catalog = "data/catalog/precision.yaml#nishiyama2024a"
unit = "MHz"
transcription = """
From the arXiv version (2409.16522). Table 1: absolute frequencies of the a1 component of P(34)39-0,
R(36)39-0, P(33)39-0 and R(35)39-0, kHz, with the power and pressure shifts corrected by the authors.
Table 3: hyperfine splittings f(a_n) - f(a1) of the four lines (15, 15, 21, 21 components), kHz, from
the "Obs." columns. Parsed by script from the PDF text layer (spaces used as thousands separators
removed), converted kHz -> MHz exactly. The Table 3 caption names the third line "R(33)39-0"; its body,
Table 1 and the text say P(33)39-0, which is used. 72 rows: 4 frequencies, 68 splittings, none left out.
"""
uncertainty = """
Absolute frequencies: 5.1-5.5 kHz per line, the authors' combined 1 sigma from their uncertainty budget
(Table 2), dominated by the 5 kHz cell-impurity allowance. Splittings: the paper gives no separate
figure; 0.6 kHz is used, sqrt(2) x the 0.38 kHz day-to-day repeatability it reports for the a1 lock,
the same construction the group's other papers state explicitly. The fit residuals in Table 3 scatter by
1.1-3.9 kHz, so 0.6 kHz may be optimistic for the 21-component lines.
"""
notes = "Modulation transfer spectroscopy of a frequency-tripled 1560 nm source, three-pass 20 cm cell, comb-referenced."

[conditions]
cold_finger_C = -10.0
pressure_Pa = 1.44
pump_mW = 3.0
probe_mW = 0.3
detection = "modulation transfer"
