id = "hong2001a"
citation = "F.-L. Hong, J. Ishikawa, A. Onae, H. Matsumoto, \"Rotation dependence of the excited-state electric quadrupole hyperfine interaction by high-resolution laser spectroscopy of 127I2\", J. Opt. Soc. Am. B 18, 1416-1422 (2001)"
source = "https://doi.org/10.1364/josab.18.001416 (publisher PDF)"
doi = "10.1364/josab.18.001416"
retrieved = "2026-09-29"
unit = "MHz"
catalog = "precision.yaml:hong2001a"

transcription = """
Tables 2, 3 and 4 (all p. 1419), "Obs." column only: hyperfine intervals f(a_n) - f(a1) of
  Table 2  127I2 R(58) 32-0 (line 1098), a2, a5-a15
  Table 3  127I2 P(55) 32-0 (line 1099), a2-a4, a7-a21
  Table 4  127I2 P(104) 34-0, a2-a15
kHz converted to MHz exactly. Parsed by script from the pdftotext -layout text (column-split, since Table 4
shares text lines with Table 2), and checked digit by digit against a 200 dpi rendering of p. 1419. The
"Calc." and "Obs. - Calc." columns, weights and F, I labels are not entered; as a check, Obs. - Calc.
reproduces the printed column for every row (P(55) a2 differs by 0.1 kHz, rounding of the unrounded
Calc.).

Not entered (not measured): R(58) 32-0 a3, a4 (overlapped, printed "-"); P(55) 32-0 a5, a6 (very close,
printed "-"). Components the authors measured but gave weight 0 in their fit are entered, with the reason
in `note`: R(58) a11, a12 (too close to each other), P(55) a15 (obs-calc -2.9 kHz, a weak line of another
transition nearby), P(104) a15 (measurement uncertainty about twice the others, obs-calc -21.8 kHz).
The a1 component of P(104) 34-0 lies between a14 and a15 of P(55) 32-0 (Fig. 3); the two lines overlap.

Printing note: Table 2 gives the calculated a3 and a4 of R(58) 32-0 as 258 860.3 and 258 877.3 kHz, below
a2 (259 193.8). The model puts them at 285 860.0 and 285 877.6 kHz, between a2 and a5, so the printed
values are a digit transposition (2858.. -> 2588..); the a_n rank order of the paper is by frequency.
Labels: the paper's a_n are ranked by frequency, a1 lowest, 15 components for even J'' (R(58), P(104)) and
21 for odd J'' (P(55)), as in i2spec. No crossovers are measured.

Also not entered: Table 5 fitted constants (Delta eQq, Delta C, Delta d, Delta delta for the three lines;
eQq'' from the Hong 2001 JOSA B 18, 379 formula, C'', d'', delta'' fixed to Wallerand 1999 / Borde private
communication values) and Tables 6-7, which mix these with constants adopted from Ye 1999 and Hong 2001b.
They are differences B - X, not B-state values, and are derived from these intervals.

Overlap with bipm2012a (NOT independent): the BIPM 532 nm hyperfine tables of R(58) 32-0 (Table 2),
P(55) 32-0 (Table 3) and P(104) 34-0 (Table 4) are this paper's observed values, identical to 0.1 kHz for
all 44 rows (BIPM also omits R(58) a3, a4 and P(55) a5, a6). The a1 positions of these lines relative to
R(56) a10 are in zhang2001a (and bipm2012a); this paper measures none.
"""

uncertainty = """
The paper gives no per-component uncertainty. Entered, as a judgement: 1 kHz for R(58) 32-0 and
P(55) 32-0 (fit standard deviations 530 and 680 Hz, which include the four-term model's error; statistical
~13 Hz per 100 s point; relock repeatability ~100 Hz per laser; hyperfine splittings differ between laser
systems at ~1 kHz, Zhang 2001), and 2 kHz for P(104) 34-0 (fit sd 1.37 kHz; S/N and stability about half,
relock ~200 Hz per laser; several components disturbed by weak lines). P(104) a15, which the authors say
was measured with twice the uncertainty of the others, is entered at 4 kHz. The BIPM tables give 2 kHz
for all three lines. Taken as 1 sigma.
"""

notes = """
Residuals against the default Predictor (i2spec2026k, 2026-09-29), obs - model: R(58) 32-0 -1.9 to +1.8 kHz
(rms 1.1); P(55) 32-0 -1.4 to +2.6 kHz (rms 1.1); P(104) 34-0 -3.6 to +8.2 kHz (rms 4.5 with a15), with a15 at -12.1 kHz (the
component the authors left out, their own calc misses it by 21.8 kHz) and a11 +8.2, a14 +5.5 kHz. No row
was dropped.
"""

[conditions]
method = "modulation transfer spectroscopy, heterodyne beat of two I2-stabilized frequency-doubled Nd:YAG lasers (one on a1, the other stepped through the components), counted at 1064 nm, converted to 532 nm"
laser = "diode-pumped monolithic Nd:YAG, frequency doubled"
cell_length_cm = 30
cold_finger_C = -10.0
pressure_Pa = 1.4
pump_mW = 2.0
probe_mW = 0.3
beam_diameter_mm = 2
modulation_kHz = 660
aom_shift_MHz = 87
averaging = "100 beat measurements of 1 s gate each per component"
