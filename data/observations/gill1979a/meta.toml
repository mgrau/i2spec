Table 2 (p. 121), column "Measured wavenumber" marked [NPL]: centres of gravity of the hyperfine sets saturated
inside an argon/krypton ion laser at 515, 521, 531 and 568 nm, "derived from wavelength measurements at particular
hyperfine components" with the NPL digital wavemeter (1 in 1e7), typed from the text layer and checked against
the page. Entered as hyperfine-free line centres (component empty). The component wavelengths of Table 3 are in
the notes; their component labels (d, 20, 1, o) are figure labels that cannot all be ranked reliably.
Assignments are the paper's (from sidelight fluorescence): 58-1 R(98), 49-1 P(108) ("probable"), 43-2 R(98),
27-3 P(133).
Not entered: the 641 nm 11-7 R(98) value (approximate, laser not stabilized); the values cited from other works
[19, 20] for 43-0 and 40-0; Table 1 (calculated wavenumbers and group spacings); the hyperfine structure (figures
only).
"""

