citation = "J. Ye, T. H. Yoon, J. L. Hall, A. A. Madej, J. E. Bernard, K. J. Siemsen, L. Marmet, J.-M. Chartier and A. Chartier, \"Accuracy comparison of absolute optical frequency measurement between harmonic-generation synthesis and a frequency-division femtosecond comb\", Phys. Rev. Lett. 85, 3797-3800 (2000)"
source = "https://doi.org/10.1103/PhysRevLett.85.3797 (CU Scholar copy; Matt's library copy papers/Ye2000_PRL85_3797.pdf)"
