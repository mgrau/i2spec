id = "bodermann1998c"
citation = "B. Bodermann, Untersuchung zur Realisierung eines durchstimmbaren, hochpräzisen Frequenzstandards im NIR und zur Erweiterung des Spektralbereiches mit Hilfe des 127I2-Moleküls, Dissertation, Universität Hannover (1998); Referent E. Tiemann"
source = "Doctoral thesis, Universität Hannover (1998); TIB Hannover, PPN 25410990X (294 pages)"
retrieved = "2026-09-24"
catalog = "data/catalog/precision.yaml#bodermann1998c"
unit = "MHz"
transcription = """
Two tables, read from the PDF text layer and checked digit by digit against 200 dpi renders of PDF
pages 124 (Table 6.12, thesis p. 118) and 129-130 (Table 7.1, thesis pp. 123-124). All values are
printed in kHz and entered in MHz (division by 1000, exact). Generated by
prototypes/bodermann1998c_make.py, which also checks every row against the model.

Table 6.12, absolute frequencies by interferometric wavelength comparison. The three primary lines -
R(96) 0-15 a10, P(166) 0-14 a01, R(96) 0-14 a10 - are entered as frequencies; they are the lines of
Bodermann et al., Metrologia 35, 105 (1998) (catalog bodermann1998a, not otherwise entered). The other
two rows of the table, P(228) 1-14 b10 and R(19) 0-15 b02, were calibrated by a beat against the
primary line beside them (thesis p. 117); they are entered as intervals to that line, with uncertainty
sqrt(u^2 - u_ref^2), so the primary calibration is not counted twice. The printed frequencies carry
the +42 kHz cell correction (thesis p. 118); the printed wavelengths agree with c/f to 0.4-2.5 kHz, so
it is in both columns.

Table 7.1, beat frequencies between lines, "corrected for the cell shifts" (thesis p. 123). The table
prints magnitudes; each is entered as an interval with line the higher-frequency component, the order
taken from the model (the smallest difference is 115 MHz, far beyond any model error). Component labels
are as printed (a01 -> a1); a, b, c distinguish lines in a scan and do not affect the rank.

Not entered from Table 7.1:
- Three rows that bodermann2000a already carries with the same digits: R(138) 1-14 a10 - R(16) 0-14 a10
  (20 045 192.3), R(240) 0-12 a10 - R(138) 1-14 a10 (24 845 369.6), P(164) 0-13 a10 - R(240) 0-12 a10
  (16 324 846.5).
- R(46) 0-16 a15 - R(180) 0-15 a15, printed "15 483.7" kHz. The two lines are 15 482 MHz apart in the
  model; the printed digits are the value in MHz with the last three kHz digits missing.
- R(240) 0-12 a15 - R(138) 1-14 a15, printed 24 854 569.2. Its a10-a10 neighbour is 24 845 369.6 and the
  model puts a15-a15 within 0.34 MHz of a10-a10; the row is 8.9 MHz off where every other row of the
  pair is within 0.2. Probably "845" printed as "854", but correcting digits would be inventing them.
- P(129) 1-14 b02 - P(164) 0-13 a01, printed 488 591.8. Its siblings b03 and b18 agree with the model to
  0.10 and 0.22 MHz, this row to 2.66; the printed b03-b02 spacing, 15.56 MHz, is not any spacing of
  the line (a2-a1 18.30, a3-a2 18.32), so no relabelling fixes it. Possibly a blend in the scan.

Relabelled:
- P(54) 0-15 a01 - R(63) 0-15 printed "a01", entered as a2. As printed the row is 18.9 MHz from the model
  while its two siblings in the same pair sit +0.660 and +0.663 MHz off; with R(63) a2 it is +0.666.
  R(63) 0-15 is an odd-J line whose a1 and a2 are 18.3 MHz apart.
"""
uncertainty = """
Table 6.12: the printed standard uncertainties, 48-49 kHz for the primary lines (relative 1.3e-10,
Table 6.11), 62-80 kHz for the two beat-connected lines. Table 7.1: the printed "St.abw.", the single
standard deviation of the beat measurement, 4.5-45 kHz; it does not include the laser-lock
reproducibility. The thesis's own fit of these data (section 9.1, 45 values, 14 parameters) reached
41 kHz overall with every residual inside three and 91 % inside two stated errors, so the figures are
about right as a set.
"""
partial = """
Only the NIR line positions not otherwise published. Tables 6.3, 6.7 and 6.10 (Rb-referenced absolute
frequencies) are in bodermann2000a, which supersedes them (they agree; R(113) 0-15 a12 differs by
2 kHz). The thesis's hyperfine tables (chapter 8), its appendix A4 compilation of ~300 literature
frequencies, and the four-wave-mixing results of section 7.2 are not entered.
"""
notes = """
These are the difference frequencies Knöckel et al. 2004 cite as the unpublished part of the data
behind the Hannover local NIR model (catalog bodermann2000a notes), and the data that model's section
9.1 fit rests on: 45 values of bands 0-12 to 0-17, 30 absolute and 15 differences, sd 41 kHz. Many
rows here involve v' = 1 lines or were not in that 45-value set.
"""

[conditions]
cells = "J2 for the wavelength comparisons (+42 kHz applied, thesis Table 4.1); beat measurements alternated which laser and cell sat on which line, and so corrected the cell shift in each measurement (p. 123)"
detection = "collinear Doppler-free saturation spectroscopy, 3f lock, as bodermann2000a"

[shift_correction]
pressure_Pa = 27.0
pressure_kHz_per_Pa = -5.1
pressure_kHz_per_Pa_unc = 1.0
basis = "Thesis Sect. 4: absolute measurements at side arm 20 C (27.0 Pa, as bodermann2000a); pressure shift -5.1(1.0) kHz/Pa (budget table; Table 4.1 cell J5 at 600 C -5.1/-5.0 kHz/Pa, linear in P). Applies to the three Table 6.12 frequencies only."
