transcription = """
From the arXiv preprint (2309.05932v1), Table 2 (p. 8), "Measured" column: absolute frequencies of one
hyperfine component of each of nine 127I2 lines, in kHz, converted to MHz exactly. These are frequencies of
the 554 nm light (540.84-540.89 THz; the 369 nm light is 1.5x this). Read from the PDF text layer
(pdftotext -layout) and checked digit by digit against a 200 dpi rendering of p. 8. The paper prints no
calculated (IodineSpec) column. No hyperfine intervals are given: the other lines named in the abstract
(P(46) 22-0, R(147) 28-1, R(49) 22-0, P(45) 22-0) appear only as wavemeter-scanned spectra in Fig. 2
(p. 5), with detuning axes from a 1 MHz-resolution wavemeter; those are not measurements and are not
digitized. No crossover resonances are reported.

Component labels: the paper uses a/b/c only to tell apart the lines shown in one Fig. 2 panel; the number
is the rank by frequency (15 components for even J'', 21 for odd J''). Fig. 2 shows a1 at the low-detuning
end and a15 / b15 / b21 at the high end, which agrees with the i2spec convention, so the labels are
entered as printed (b1, b18 for the odd-J'' lines P(121) 24-0 and P(69) 25-1).

Corrections already in the printed values (Sect. 3.2, Table 1, p. 6-7): the authors measured pressure and
power shifts only on P(69) 25-1 b18, at 7.2 mW pump, 8.0 mW probe, 2.8 Pa (cold finger 10 C): pressure
shift -78.2 +/- 8.8 kHz/Pa (2.6-3.9 Pa), power shift +17.9 +/- 0.9 kHz/mW (5.0-7.2 mW pump). Table 1 lists
the corrections as +219.0 (29.4) kHz (pressure) and -128.9 (5.8) kHz (power), net +90 kHz, and the text says
this 90 kHz was added to all the measured frequencies as a "rough correction" (the same coefficients are
assumed for every line). No further correction is applied here. The -78 kHz/Pa coefficient is about ten
times the usual I2 self-shift (-1 to -8 kHz/Pa; see data/catalog/broadband.yaml#chen2024 and
docs/research/02a-broadband-data.md); if it is wrong the correction could be off by ~0.2 MHz, which is
negligible next to the discrepancies below.

WARNING - THE PRINTED FREQUENCIES DO NOT AGREE WITH THE MODEL OR THE ATLAS. Observed - i2spec (default
parameters) is +151, -101, +32, +44, -840, -466, -362, -362, +282 MHz for the rows in table order, i.e.
10^3-10^4 sigma. The i2spec model is good to 0.02-7 MHz for neighbouring precision data (zhang2009a
P(144) 23-0 +0.02 MHz, hsiao2013a P(28) 24-0 -0.2 MHz, yang2011a R(130) 24-1 +7 MHz, bipm2003b R(106) 28-0
0.0 MHz), and the independent APO/NIST 2009 FTS atlas (data/atlas_lines/apo_nist_2009.csv) puts every one
of these nine line centres 10-24 MHz below i2spec, i.e. the atlas and the model agree with each other and
both disagree with the paper by 30-820 MHz (obs - (atlas centre + model hyperfine offset) = +163, -85, +55,
+54, -819, -447, -339, -338, +301 MHz). Checks made:
  - the digits are as printed (text layer and rendering agree);
  - no other component of the same line fits consistently (nearest components are still 13-450 MHz off,
    with no common relabelling);
  - no other 127I2 B-X line (v'' = 0-3, J'' <= 220) has a component within 40 MHz of six of the nine values;
    of the other three, P(160) 26-0 a1 (not a15) would fit at +23 MHz vs model / +44 vs atlas, and
    R(72) 25-1 a15 (not a10) at -6 / +13 MHz, but these single coincidences are weak evidence given the
    ~50 MHz component spacing;
  - the residuals are not multiples of the 250 MHz comb repetition rate, so a mode-number error alone does
    not explain them; see the comb-ambiguity analysis below.

COMB-AMBIGUITY PATTERN (analysis 2026-09-29). Sect. 3.2 (p. 6) gives flaser = N fr +/- fo +/- fb with
fr ~ 250 MHz, fo = 35 MHz, N found by changing fr in a two-step process (no wavemeter); the comb is a
PCF supercontinuum covering 500-1050 nm (Sect. 2), so the 554 nm light beats directly against comb modes
of offset fo (not 2fo), and the beat passes a band-pass filter (so fb is similar from line to line). The
paper prints neither N, fb nor the signs chosen. Taken modulo 250 MHz, the residuals form two tight
clusters:
                        obs - i2spec   mod 250   obs - APO/NIST   mod 250
  R(50) 22-0 a1            +150.9       150.9        +163.3        163.3
  P(121) 24-0 b1           -100.9       149.1         -85.4        164.6
  P(69) 25-1 b18            +32.5        32.5         +55.0         55.0
  R(146) 25-0 a15           +44.5        44.5         +53.9         53.9
  P(160) 26-0 a15          -839.8       160.2        -818.6        181.4
  P(102) 26-1 a1           -466.1        33.9        -447.1         52.9
  R(96) 23-0 a10           -362.0       138.0        -338.5        161.5
  P(92) 23-0 a15           -362.4       137.6        -338.4        161.6
  R(72) 25-1 a10           +282.1        32.1        +301.4         51.4
(APO/NIST column: atlas line centre + i2spec hyperfine offset; atlas 1-sigma 8-10 MHz.) Against the
atlas, 8 of the 9 lines sit within +/-2 MHz of +53 or +163 MHz (= -87) modulo 250; P(160) 26-0 (the
weakest atlas line, depth 0.58) is the exception at +181. Against i2spec (which puts the atlas 10-24 MHz
low in this band) the clusters are +32...+45 and +138...+160. The two clusters are 140 MHz (= 4 fo, or
2 x a ~70 MHz beat) apart and are centred on about -35 MHz (vs i2spec) / -17 MHz (vs atlas). So the
data are consistent with printed - true = (+35 or -105 MHz) + k x 250 MHz, k = -3...+1, i.e. a mode-number
error plus a sign error in the +/-fo +/-fb terms that differs from line to line. Removing the nearest such
term leaves residuals vs i2spec of +5.9, +4.1, -2.5, +9.5, +15.2, -1.1, -7.0, -7.4, -2.9 MHz (table order),
so the lines ARE the assigned ones (the labels also match the component spacing in the EFTF Fig. 4
spectrum of R(146) 25-0: a1 -> a15 spans ~865 MHz, i2spec 863 MHz). But the correction (the choice of k and
of the cluster) can only be made with the model or atlas, the corrected values would carry the model's
and atlas's 5-15 MHz errors in place of the paper's claimed ~40 kHz, and the paper gives no way to verify
it. This is why the set stays excluded; it is not "fixed" here.

EFTF 2024 COMPANION (Y. T. Chen, Y. Zheng, J. W. Zhang, S. N. Miao, W. X. Shi, L. J. Wang, "Hyperfine
Structure and Absolute Frequency Measurements of 127I2 Transitions at 554 nm and Its Application for Yb+
Ions Cooling", 2024 EFTF, pp. 254-256, doi:10.1109/eftf61992.2024.10722760; read in full, p. 256 rendered at
200 dpi). It contains one frequency only: R(146) 25-0 a15 = 540 859 322 747 (48)(31) kHz, type A with k = 2
and type B, citing the Chin. J. Phys. paper as ref. [18]. The value is identical to Table 2 here; only the
type-B term is printed as 31 kHz instead of 30 kHz (sqrt(29.4^2 + 5.8^2) = 30.0). No other line, component
or frequency is given; there is no comb description (no fr, fo, N, fb or sign convention), no pressure or
power shift coefficients and no statement of corrections. Fig. 4 is an MTS scan of R(146) 25-0 (labels a1,
a10, a15; "relative frequency" axis 0-1000 MHz, a1 at ~60 MHz, a15 at ~925 MHz), Fig. 5 the Allan deviation
of the lock to R(146) 25-0 a15 (5e-12 at 1000 s). Setup differences from the preprint: beam diameter
1.5 mm (preprint 2 mm). So the EFTF paper neither corrects nor explains the discrepancy.

The underlying cause is therefore still not established from the authors' own information. All nine rows are kept exactly as printed (nothing is dropped), but THIS SET SHOULD
NOT BE USED IN THE FIT unless the authors publish N, fb and the signs, or corrected values (the journal
version, doi:10.1016/j.cjph.2023.12.007, has not been seen; the EFTF 2024 companion does not help). All rows share one group, since one comb, maser,
cell and one common shift correction were used.
"""

uncertainty = """
Table 2 prints two uncertainties per value: type A with coverage factor k = 2 (first parentheses, 26-72 kHz)
and type B (second, 30 kHz for every line). The type-B value comes from Table 1 (pressure-shift 29.4 kHz and
power-shift 5.8 kHz in quadrature), evaluated on P(69) 25-1 b18 only; since it is built from 1-sigma fit
errors of the shift coefficients it is taken as 1 sigma. The standard uncertainty entered is
sqrt((A/2)^2 + B^2), 33-47 kHz. Note that Table 1 combines the k = 2 type-A value (33 kHz) with the type-B
30 kHz directly to a "total" of 44 kHz, so the paper's own coverage factors are inconsistent; using A
instead of A/2 would give 40-78 kHz. The type-B term does not include line-to-line differences of the
shift coefficients, which the authors assumed equal to those of P(69) 25-1 b18. Either way the stated
uncertainties are four orders of magnitude smaller than the disagreement described in `transcription`.
"""

notes = "Modulation transfer spectroscopy (EOM 3.27 MHz, plus 2 kHz chopper and lock-in) of the 554 nm second harmonic of a 1108 nm DFB fibre laser, comb-referenced to an H-maser. No line overlaps with any other data set held. Status: transcribed, but the values disagree with the model and the APO/NIST atlas by 30-840 MHz, in a pattern consistent with comb mode-number and offset/beat sign errors (+35 or -105 MHz mod 250 MHz); the EFTF 2024 companion repeats the R(146) 25-0 a15 value unchanged. Not fit-ready."

