id = "chen2023a"
citation = "Y. T. Chen, N. C. Xin, H. R. Qin, S. N. Miao, Y. Zheng, J. W. Zhang, L. J. Wang, \"Absolute frequency measurement of molecular iodine hyperfine transitions at 554 nm and its application to stabilize a 369 nm laser for Yb+ ions cooling\", Chin. J. Phys. 88, 485-492 (2024)"
source = "https://arxiv.org/abs/2309.05932 (arXiv v1, 12 Sep 2023). The journal version (doi:10.1016/j.cjph.2023.12.007) is paywalled and was not seen; its numbers could differ from the preprint."
