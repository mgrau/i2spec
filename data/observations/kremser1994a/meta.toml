citation = "S. Kremser, B. Bodermann, H. Knöckel and E. Tiemann, \"Frequency stabilization of diode lasers to hyperfine transitions of the iodine molecule\", Opt. Commun. 110, 708-716 (1994)"
source = "https://doi.org/10.1016/0030-4018(94)90273-9 (PDF supplied by Matt; library copy papers/Kremser1994_Opt_Commun_110_708.pdf)"
doi = "10.1016/0030-4018(94)90273-9"
