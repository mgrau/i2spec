id = "grieser1994a"
citation = "R. Grieser, G. Bönsch, S. Dickopf, G. Huber, R. Klein, P. Merz, A. Nicolaus and H. Schnatz, \"Precision measurement of two iodine lines at 585 nm and 549 nm\", Z. Phys. A 348, 147-150 (1994)"
source = "Z. Phys. A 348, 147-150 (1994), received 8 November 1993, revised 3 February 1994; https://doi.org/10.1007/BF01289603 (file papers/Grieser1994_ZPhysA348_147.pdf, scanned). Checked against the earlier CERN preprint CERN-PPE/93-215 (12 November 1993), from which the set was first typed."
doi = "10.1007/bf01289603"
retrieved = "2026-09-29"
unit = "MHz"
catalog = "precision.yaml:grieser1994a"

transcription = """
Read from 250 dpi renderings of the four pages of the published paper (pp. 147-150); the OCR text layer
is poor and was used only to locate passages. The results are in Sect. 3 "Results and discussion":
the three wavelength ratios at the foot of p. 149 (right column) and the top of p. 150 (left column),
nu_633 and the two frequencies on p. 150 (left column). The paper has no table of results (its
Table 1, p. 148, is the laser's uncertainty budget).

Printed (pp. 149-150):
  lambda_549/lambda_633 = 0.86668681714 +/- 13e-11
  lambda_585/lambda_633 = 0.92381924206 +/- 13e-11
  lambda_514/lambda_633 = 0.81308129593 +/- 7e-11
  nu_633 = (473612214705 +/- 14) kHz [11 = CIPM 1992, Recommendation 3]
  nu_549 = (546462926790 +/- 71) kHz
  nu_585 = (512667622777 +/- 67) kHz
Arithmetic check: nu_633 / ratio gives 546462926790.4 kHz (549) and 512667622779.7 kHz (585); the
latter differs from the printed ...777 by 2.7 kHz, which is within the rounding of the printed
11-digit ratio (0.5e-11 relative = 2.6 kHz), so both printed frequencies are taken as they stand.

Differences from the CERN preprint (CERN-PPE/93-215, p. 11 there): none in the numbers. The three
ratios, nu_633, nu_549, nu_585, all uncertainties, the Table 1 budget (43, 30, 7.5, 1, 5, 5, 1; total
54 kHz), the component letters of Figs. 3-4 and the line labels (including the misassigned "R(85)26-0")
are identical; the published text only uses a decimal point instead of the preprint's decimal comma.

Rows:
1. R(99) 15-1 "i" component = a13. The letter convention is read from Figs. 3 and 4 (p. 150):
   letters run from a at the HIGHEST frequency down to w at the lowest, skipping s and t, i.e.
   (low -> high) w v u | r q p o | n m l k | j i h | g f e d | c b a = 21 components (odd J'').
   So i is rank 13 and w is rank 1. Check: in Fig. 3 (detuning relative to i) w sits at about
   -606 MHz, matching Reinhardt 2006's R(99) 15-1 a13 - a1 = 606.076 MHz; and the unresolved "q,p"
   pair of the caption is a5/a6, which Reinhardt 2006 also did not list.
2. R(85) "w" component = a1 (lowest; Fig. 4 has w at detuning 0 and all others above it).
   The paper (also the published version) assigns this line to R(85) 26-0. Knöckel et al. 2004 (their ref. [33]) state the band
   is wrong and should be 25-0. The model confirms it: R(85) 25-0 a1 is -0.69 MHz from the measured
   value, R(85) 26-0 is 2.3 THz (78 cm-1) away. Entered as 127I2 R(85) 25-0.
3. P(13) 43-0 a3 (the Ar+ 515 nm reference laser, BIPM a3). The paper prints only the measured
   wavelength ratio lambda_514/lambda_633 ("the wavelength ratio ... has been redetermined"); the
   frequency was computed here as nu_633(1992) / ratio = 582490603431.3 kHz, uncertainty 7e-11 of
   that = 41 kHz. This is an independent (1993) measurement of a line the CIPM value
   (bipm2005a, 582490603442 +/- 5 kHz) pins far better; it is kept as a check of the
   interferometric chain (it agrees to -11 kHz) and carries negligible weight.

Reference and recalibration: all three are wavelength ratios to a 127I2-stabilized He-Ne laser locked
to the "i" component (= a13) of R(127) 11-5, evaluated with the CIPM 1992 value 473 612 214 705 kHz.
The ratios also used the Ar+ P(13) 43-0 a3 and He-Ne 612 nm lasers to fix the interference orders.
The current CIPM value (bipm2003a: a16 = 473 612 353 604 kHz, a13 - a16 = -138.892 MHz) gives
a13 = 473 612 214 712 kHz, 7 kHz (1.5e-11) higher. Rescaling would raise the three rows by
+7.6 kHz (585), +8.1 kHz (549) and +8.6 kHz (514), i.e. about 0.1-0.2 sigma. This correction is NOT
applied; the values are as printed (and, for row 3, derived) on the 1992 basis.

No conditions correction (pressure, power) is applied: the paper gives none. The dye laser's cell
was at a 6 C cold point with 2.5 MHz modulation, first-harmonic detection.

Not entered: the hyperfine splittings were measured only coarsely (Fabry-Perot, FSR
606.8(1.9) MHz, uncertainty < 2.6 MHz) and are shown only as the spectra of Figs. 3-4, with no
numbers printed; the triangles in the figures are calculated positions. Nothing else in the paper is
a measured line frequency. No crossover resonances are involved.
"""

uncertainty = """
The paper states all uncertainties are one relative standard uncertainty (1 sigma), p. 150.
Rows 1-2: the printed +/- 67 and +/- 71 kHz, equal to 13e-11 times the frequency, i.e. the ratio
uncertainty; this total includes the laser budget (Table 1, 54 kHz: residual Doppler background 43,
input-filter detuning 30, electronic offsets 7.5, power 5, cell impurities 5, pressure 1, recoil
/2nd-order Doppler 1), the interferometric part (5e-11) and the He-Ne reference (3e-11; the printed
14 kHz on nu_633 is apparently not added again). Row 3: 7e-11 of the frequency (41 kHz), the printed
ratio uncertainty, treated the same way.
All three rows share the He-Ne reference and the interferometer and are in one group.
"""

notes = """
Reference lines for the Mainz/Heidelberg TSR Ives-Stilwell experiment with 7Li+ (548.5 nm). The
585 nm R(99) 15-1 line's hyperfine intervals were later measured at 20 kHz by Reinhardt et al. 2006
(reinhardt2006a, same Mainz group), but that paper's absolute frequency is of P(10) 14-1 a15, not of
R(99) 15-1, so there is no direct overlap with an absolute value.

Residuals against the default model (2026-09-29): R(99) 15-1 a13 -2.47 MHz, R(85) 25-0 a1 -0.69 MHz,
P(13) 43-0 a3 -0.016 MHz. The 585 nm residual is a model error, not a misreading: independent 15-1
data show the same smooth J trend (sansonetti1997a R(67) -1.4, P(94) -2.7, P(116) -3.7 MHz;
velchev1998a P(117) -4.1 MHz), and reinhardt2006a's R(99) 15-1 intervals fit the model's hyperfine
structure to 12 kHz, so the offset is in the line centre.
"""

[conditions]
method = "Doppler-free saturation spectroscopy (difference signal, first-harmonic lock-in detection) of a dye laser; Michelson wavelength comparison at PTB"
laser = "Coherent 599/21 linear dye laser: Rhodamine 6G at 585 nm, Rhodamine 110 at 549 nm"
cold_point_C = 6.0
modulation = "2.5 MHz amplitude; 44 kHz (585 nm), 36 kHz (549 nm)"
pump = "1 mW/mm2, 0.8 mm (1/e) diameter"
probe = "88 uW/mm2, 0.8 mm (1/e) diameter"
crossing_angle_mrad = 8
reference = "He-Ne 633 nm on R(127) 11-5 i (a13), 15 C cold point, 6 MHz p-p, 3f; CIPM 1992 value 473612214705 kHz"

[shift_correction]
pressure_Pa = 7.45
allowance_kHz = 37.0
basis = "Paper: dye-laser cell cold point 6.0(0.3) C, no Pa and no coefficient (Table 1 lists only 1 kHz for pressure changes); 7.45 Pa from the Gillespie & Fraser vapour pressure. Allowance = |-5 kHz/Pa (typical, 500-600 nm) x 7.45 Pa|. The derived P(13) 43-0 row (Ar+ at -5 C) gets the same allowance."
