source = "Appl. Phys. B 127:104 (2021), published 29 June 2021; https://doi.org/10.1007/s00340-021-07650-5 (publisher PDF, Matt's library copy papers/Powel2021_APB_10.1007_s00340-021-07650-5.pdf)"
