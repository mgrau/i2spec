basis = "Paper Table 1 footnote c and p. 138: cold finger 20 C (26.94 Pa, Gillespie & Fraser at 293.15 K), modulation width 6 MHz, standing-wave power 13.4 mW. Coefficients as bipm2003a (MEP 633 nm): -9.6(1.9) kHz/Pa, -10(2) kHz/MHz, power 0(1) kHz/mW. Shift +319 kHz, uncertainty 54 kHz."

