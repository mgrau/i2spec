citation = "P. Cérez, A. Brillet and F. Hartmann, \"Metrological properties of the R(127) line of iodine studied by laser saturated absorption\", IEEE Trans. Instrum. Meas. IM-23, 526-528 (1974)"
source = "https://doi.org/10.1109/TIM.1974.4314347 (IEEE Xplore via ODU; Matt's library copy papers/Cerez1974_IEEE_TIM_23_526.pdf)"
