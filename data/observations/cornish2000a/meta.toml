id = "cornish2000a"
citation = "S. L. Cornish, Y.-W. Liu, I. C. Lane, P. E. G. Baird, G. P. Barwood, P. Taylor and W. R. C. Rowley, \"Interferometric measurements of ¹²⁷I₂ reference frequencies for 1S-2S spectroscopy in muonium, hydrogen, and deuterium\", J. Opt. Soc. Am. B 17, 6-13 (2000)"
source = "https://opg.optica.org/josab/abstract.cfm?uri=josab-17-1-6 (PDF obtained 2026-09-16)"
doi = "10.1364/josab.17.000006"
retrieved = "2026-09-16"
unit = "MHz"
catalog = "precision.yaml:cornish2000a"

transcription = """
Table 2, "Iodine Transition Frequencies", read from the text layer of the publisher PDF on
2026-09-16. Three rows are printed; two are transcribed.

Component labels are as printed (a15). For even J'' a line has 15 main components, so a15 is rank 15
by frequency; this is the same labelling as Sansonetti (1997), which the paper follows.

Excluded: R(137) 5-12, printed as component "a19-21". Its three components are blended in the
measurement and it cannot be attached to a single rank, so it is left out rather than guessed at.
"""

uncertainty = """
As printed, per row, in parentheses: 0.14 MHz for R(26) 5-13 and 1.2 MHz for P(258) 7-11. Taken as
standard (1 sigma) uncertainties.
"""

[conditions]
cell = "wall and cold-finger temperatures printed per row; see notes"
method = "interferometric measurement against a stabilised reference"

notes = "Wall/cold-finger temperatures as printed: R(26) 5-13 at 650 C wall, 39(3) C cold finger; P(258) 7-11 at 680 C wall, 43(3) C cold finger. These are hot-cell measurements; any pressure or temperature shift is as the authors left it."
