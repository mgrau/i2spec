id = "manzoor2024a"
citation = "S. Manzoor, M. Chiarotti, S. A. Meek, G. Santambrogio and N. Poli, \"Precision spectroscopy and frequency determination of the hyperfine components of the P(63) 4-4 transition of molecular iodine near 652 nm\", Opt. Express 32, 44683 (2024)"
source = "Opt. Express 32(25), 44683-44693 (2024), published 22 Nov 2024; https://doi.org/10.1364/OE.539192 (checked against the earlier arXiv:2410.03305v1 preprint, from which the set was first typed)"
doi = "10.1364/oe.539192"
retrieved = "2026-09-29"
unit = "MHz"
catalog = "precision.yaml:manzoor2024a"

transcription = """
Table 1 (published p. 44690, PDF p. 8), column "Absolute Frequency (This Work)" only: nine comb-measured absolute
frequencies of hyperfine components of 127I2 P(63) 4-4 (a1, a2, a3, a4, a7, a12, a13, a14, a18), in MHz.
Read from the pdftotext -layout text layer and checked digit by digit against a 200 dpi rendering of p. 44690.
Not entered: the "PGOPHER Fit" column (their model), the "Residuals" column, the "Literature values"
column (calculated from Gerstenkorn & Luc 1985 constants + Bodermann 2002 hyperfine formulae) and Delta.
As checks, Measured - Fit reproduces all nine printed residuals, and Literature - Fit the Delta column.

Differences from the arXiv v1 preprint: none. Every value and uncertainty of Tables 1 and 2, the (F', I)
labels, the conditions (22 C, 29.5 Pa, 10/3 mW) and the fixed constants are identical in the published
version (checked by a digit diff of the two text layers and on the rendered table).

Also not entered (derived, not measured): Table 2 (p. 44691) f(C.G.) = 459 524 036.90(12) MHz, the hyperfine-free
centre from their PGOPHER fit to these nine rows, with Delta eQq and Delta C fitted and Delta d, Delta
delta, eQq'', C'' held at the Bodermann 2002 formula values; and the v'=4 "origin" 486 021 343.15(12) MHz.
The C.G. restates the nine rows through their model; entering it would double count. Delta eQq =
1957.67(71) MHz and Delta C = 20.37(60) kHz belong in data/hyperfine_parameters/ if wanted.

Component labels: P(63) has odd J'', so 21 main components; the paper labels them a1-a21 by frequency
(Fig. 2/4). The printed (F', I) of every row matches the i2spec strongest-first Delta F = Delta J
assignment at the same rank: a1 (57,5), a2 (62,1), a3 (67,5), a4 (58,5), a7 (66,5), a12 (59,3), a13
(62,3), a14 (65,5), a18 (64,5). So the labels are entered as printed.

The values are as measured in a room-temperature cell (about 22 C, 29.5 Pa estimated I2 pressure),
10 mW pump, 3 mW probe. The authors varied power, cell temperature and lock offset and state that all
shifts lie within the statistical errors; they apply no correction and none is applied here.

Overlap: no other set in data/observations holds P(63) 4-4 or any v''=4 hot-band line of 4-4. The paper's
"~20 MHz" error is relative to the Gerstenkorn & Luc (1985) atlas constants (their ref. [1]): Delta =
fit - literature = 18.9-19.6 MHz, and C.G. 459 524 036.90(12) vs 459 524 056(30) MHz from ref. [1]. It is
not a comparison with IodineSpec or with i2spec. For comparison, the i2spec model centre is
459 524 040.77 MHz, 3.9 MHz above their C.G. (see notes).
"""

uncertainty = """
As printed in parentheses (last digits), 0.19-1.3 MHz. The paper calls them "statistical uncertainties
from independent measurements of each hyperfine component" (4 to 10 measurements over one month); no
separate systematic budget is given, the power/pressure/electronics shifts being "within the range of
the estimated statistical errors". Taken as 1 sigma. Their PGOPHER fit gives reduced chi2 = 0.54 with
these errors, so they are, if anything, conservative. All nine rows share one group (same comb, cell,
lock electronics): a common offset of possibly a few hundred kHz (e.g. a lock or pressure shift) is
not excluded by the paper.
"""

notes = """
Residuals vs the i2spec Predictor (default parameters, dJ=2), 2026-09-29: obs - model = -3.44 to -4.40
MHz, mean -3.88 MHz, SD 0.37 MHz. The common offset agrees with their C.G. - model centre = -3.87 MHz,
i.e. the i2spec line centre of P(63) 4-4 is about 3.9 MHz high (still 5x better than the 1985 atlas
constants the paper compares with). With the mean removed the hyperfine pattern residuals are -0.51 to
+0.45 MHz; the largest in units of the printed error is a4 (+0.45 MHz, 2.0 sigma), the rest are below
1.3 sigma. So the model hyperfine structure is consistent with the data at the 0.5 MHz level; no row is
an outlier.
First published data at v''=4 with hyperfine resolution. Laser: 1304.8 nm master, Raman fibre amplifier
doubled to 652.4 nm, FM saturated absorption (10.4 MHz EOM), pump chopped at 1 kHz; observed linewidth
about 7 MHz. Motivation: overlap of the second harmonic with the Cd 1S0-3P1 line at 326.2 nm.
"""

[conditions]
method = "frequency-modulation saturated absorption spectroscopy, comb-referenced (IR comb, 100 MHz rep. rate, GPS-disciplined quartz)"
cell_length_cm = 10
cell_temperature_C = 22
pressure_Pa_estimated = 29.5
pump_mW = 10
probe_mW = 3
beam_diameter_mm = [0.74, 0.77]
modulation = "EOM 10.4 MHz phase modulation of probe; pump chopped at 1 kHz"
linewidth_MHz = 7

[shift_correction]
pressure_Pa = 29.5
allowance_kHz = 236.0
basis = "Paper: 22 C room-temperature cell, 29.5 Pa (authors' estimate); shifts stated to be within the statistical errors, no coefficient. Allowance = |-8 kHz/Pa (typical, 600-700 nm) x 29.5 Pa|."
