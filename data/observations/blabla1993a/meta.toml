id = "blabla1993a"
citation = "J. Blabla, S. Picard-Fredin and A. Razet, \"On the fifth-derivative spectrum of the hyperfine structure of 127I2 at the 633-nm wavelength of the helium-neon laser\", J. Mol. Spectrosc. 159, 282-285 (1993)"
source = "https://doi.org/10.1006/jmsp.1993.1126 (library copy papers/Blabla1993_J_Mol_Spectrosc_159_282.pdf, a scan without a text layer)"
doi = "10.1006/jmsp.1993.1126"
retrieved = "2026-10-20"
unit = "MHz"
exclude = "pending: transcribed 2026-10-21 and held out of every fit, benchmark and the explorer until Matt decides whether new sets join the training data or form a blind validation set; delete this line to admit it"

transcription = """
Tables I and II (pp. 283-284), typed from 150 dpi page images. CMI (Czech Institute of Metrology) measurements of
the 633 nm R(127) 11-5 hyperfine intervals a8-a21 from a13 (i): two He-Ne/I2 lasers (cold finger 15 C, 1.1 kHz,
6 MHz modulation) locked to different components, 5 series with third-harmonic (THT) and 10 with fifth-harmonic
(FHT) locking, each interval counted over 960 s; CMI's data, first published here (the experimental details
"will be published elsewhere", refs. 3-4, private communications).
Entered: Table II, the intervals corrected for the frequency shifts induced by allowed neighbouring overlapping
lines (corrections of ref. 3, from 0.0 to 18 kHz for THT and below 2 kHz for FHT), one group per technique, with
the uncertainty of the same row in Table I. The uncorrected values of Table I are in the notes.
Labels: a_n with the MEP letters n ... a (a8 ... a21), as printed.
Not entered: the calculated columns; the CCDM'82 column (the 1982 recommended intervals, in bipm2003a's lineage);
Table III (fitted constants).
"""

uncertainty = "Table I's parentheses, \"equivalent to the experimental standard deviations including all series of measurements\": 0.3-1.4 kHz (in the fourth decimal of MHz). The overlap corrections add an unstated uncertainty, largest for THT a10, a11, a19 (14-18 kHz corrections)."

notes = "Not one of the MEP 633 nm sources (bipm2003a's Table 1 cites earlier CMI work, ref. [26]). Residuals against i2spec2026o (obs - model): rms 8 kHz over both techniques (mean -7 kHz). Checked with the shipped model only."

[conditions]
cold_finger_C = 15.0
modulation_MHz_pp = 6.0
method = "two CMI He-Ne lasers with internal iodine cells, third- and fifth-harmonic locking, beat counting"
