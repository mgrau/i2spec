id = "hauden2024a"
citation = "M. Hauden, J. Millo, M. Matusko, F. Ponciano Ojeda, Y. Kersale, M. Delehaye, \"Offset sideband locking to iodine for laser cooling on the 1S0 -> 3P1 transition of 171Yb\", Opt. Express 33, 12519 (2025)"
source = "https://arxiv.org/abs/2503.12895 (arXiv preprint, not the published Optics Express version; the published numbers could differ)"
doi = "10.1364/oe.547123"
retrieved = "2026-09-29"
unit = "MHz"
catalog = "precision.yaml:hauden2024a"

transcription = """
Table 2 (p. 9 of the arXiv version): absolute frequencies of all 21 hyperfine components a1-a21 of
127I2 P(49) 24-1 near 556 nm, taken from the column "f_measured - f_c - f_EOM (kHz)", which the caption
calls the absolute iodine frequency. kHz converted to MHz exactly. Parsed by script from the
pdftotext -layout text and checked digit by digit against a 200 dpi rendering of p. 9.

Not entered: f_measured (the frequency of the laser carrier, 4.6757 GHz above the -1 sideband that
is locked to iodine), f_c (the correction) and "Delta f with [17]" (difference from Tanabe et al.,
Opt. Express 30, 46487 (2022)), which are derived or belong to another data set. As a check, for all
21 rows f_measured - f_c - 4 675 700 kHz reproduces the printed iodine frequency exactly, and the
values increase monotonically from a1 to a21.

f_c (-69 to -94 kHz) combines the Table 1 corrections: pressure shift (-7.58 kHz/Pa, measured on
a12 over 1.3-20 Pa; cell at 10.1 C), asymmetry shift (-224 kHz x a, a fitted per lock cycle),
residual light shift, alignment, H-maser offset (610 Hz), magnetic and gravitational shifts. The
entered values are therefore the authors' estimates of the unperturbed transition frequencies; no
further correction is applied here.

P(49) has odd J'' and 21 main components; the paper labels them a1-a21 from low to high frequency
(Fig. 2), which is the rank convention used here. No crossovers are reported. No other data set in
data/observations holds P(49) 24-1; the paper's own comparison with Tanabe 2022 (catalog
tanabe2022a, not yet transcribed) gives a mean difference of -8 kHz, range -24 to +1 kHz, each
at 9 kHz.

Also not entered: Table 3, the paper's fitted hyperfine constants (Delta eQq = 1 921 374(11) kHz,
Delta C = 53.195(9) kHz, Delta d = -25.12(64) kHz, Delta delta = -7.29(53) kHz; fit sd 7 kHz). These
are differences of B- and X-state constants and would belong in data/hyperfine_parameters/.
"""

uncertainty = """
Per row as printed in parentheses in Table 2 (5 or 6 kHz), called the "associated standard deviation"
and stated in the text (Sect. 3.3) to be at the 1 sigma level. They match the 5.9 kHz total of the
Table 1 budget, which is dominated by the 5 kHz cell-impurity term (a BIPM-recommended allowance,
common to all 21 components) plus 2 kHz asymmetry and 2.1 kHz statistics. The common part is
represented by the shared group label; intervals between components are therefore much better known
than 5-6 kHz, but the paper gives no separate splitting uncertainty.
"""
notes = """
Residuals against the default Predictor (2026-09-29): all 21 components between -0.677 and -0.603
MHz, mean -0.634 MHz (a line-centre offset of the size seen for other v'' = 1 lines, e.g.
kobayashi2016a -0.11 to -1.17 MHz). After removing the mean, the rms is 20 kHz and the extremes are
-43 kHz (a4) and +31 kHz (a7, a11), so the rank labels a1-a21 match the model's hyperfine pattern;
the scatter is at the level of the model's hyperfine prediction, not of the 5-6 kHz data.
"""

[conditions]
method = "sub-Doppler pump-probe saturated absorption with offset sideband locking (EOM at 4.675700 GHz, -1 sideband on iodine), third-harmonic lock-in detection, comb referenced to cavity laser and H maser (UTC(OP))"
laser = "frequency-doubled 1112 nm ECDL with tapered amplifier"
cell_length_cm = 10
cold_finger_C = 10.1
pump_intensity = "I_sat (2600 +- 800 mW/cm2)"
probe_intensity = "I_sat/30"
beam_diameter_mm = 1.2
pump_probe_angle_deg = 0.07
linewidth_MHz = 7
