transcription = """
Table 2 (p. 45), "Hyperfine separations for 6-3, P(33) using a modulation depth of 6 MHz": the NPL column,
f(bn - b21) of 127I2 P(33) 6-3 for b1-b20, and the absolute frequency of b21 at the default conditions of
Section 4 (6 MHz modulation depth), 473 611 821 128 (15) kHz (Section 5, p. 44, and the Table 2 caption). 21 rows.
Parsed by script from the PDF text layer and checked against a 200 dpi rendering of p. 45: every digit, minus sign
and uncertainty agrees. Check: the printed Offset columns (NPL - CIPM, NPL - DFM) are reproduced exactly from the
NPL, CIPM and DFM columns in all 20 rows. Values are printed in kHz and converted to MHz exactly. b21 is the
reference of the table and is not entered as an interval. Components b1-b21 are the 21 main components of P(33)
(odd J''), labelled by rank in frequency as in the paper.

Not entered: the CIPM column (Quinn, Metrologia 30, 523 (1993/94), the recommended values) and the DFM column
(Simonsen, IEEE Trans. Instrum. Meas. 46, 141 (1997)), which are other sources; the Offset columns, which are
derived.

Relation to edwards1999a: the same laser, cell and line, measured a second time at 6 MHz instead of 2 MHz
modulation depth (Section 6: "two sets of hyperfine interval measurements made using modulation depths of 2 MHz and
6 MHz, respectively, with the other parameters set to the default values"). edwards1999a holds Table 1 and the
2 MHz f(b21); this set holds the 6 MHz measurement, so together the two sets hold the paper's line data and no row
is duplicated. The two share the He-Ne reference (12 kHz) and the cell shift (5 kHz), so their absolute values
are correlated; the intervals are separate measurements.

Model-free checks. Table 2 - Table 1, component by component: -57 kHz (b9) to +58 kHz (b10), rms 22 kHz; without
the poorly resolved pair b9/b10 (singled out by the paper, p. 45), -20 to +21 kHz. Table 2 - bipm2003a (Table 2 of
the MEP 633 nm, weighted means): -13 to +14 kHz except b9 (-51 kHz) and b10 (+50 kHz). f(b21): 6 MHz minus 2 MHz
= -42 kHz, which the paper's -10.4 kHz/MHz slope for b21 predicts over 4 MHz (-41.6 kHz).
"""

uncertainty = """
Standard (1 sigma) uncertainties, as printed in parentheses; the Table 2 caption says so. Intervals: 3-8 kHz.
f(b21): 15 kHz, the quadrature sum of the 12 kHz He-Ne reference (NPL-D on a13 of R(127) 11-5, CIPM value), the
7 kHz reproducibility of the diode laser and a 5 kHz Type B uncertainty for the cell shift (Section 5).
"""

notes = """
The MEP 633 nm Table 2 (bipm2003a) names this paper as one of its sources (its ref. [34]); its recommended values
apply at 6 MHz modulation, so this table is the likely input. While this set is pending it has no say in bipm2003a.
The DFM column (not entered) is Simonsen 1997, now held as simonsen1997a, digit for digit; no overlap to declare.
"""

