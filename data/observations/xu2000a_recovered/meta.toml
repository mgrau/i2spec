citation = "S. C. Xu, R. van Dierendonck, W. Hogervorst and W. Ubachs, \"A Dense Grid of Reference Iodine Lines for Optical Frequency Calibration in the Range 595-655 nm\", J. Mol. Spectrosc. 201, 256-266 (2000), Tables 1-15"
