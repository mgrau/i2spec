# (Foth & Spieweck 1979), Table 4 [8] (Baird 1979: the same digits), Table 5 [9-11] (Cerez & Bennett 1979, Dschao
# 1980, Bertinetto 1983), Tables 6-7 [10, 12, 13], Table 8 [14-22, 34] (Rowley & Wallard 1973, Hanes 1973 held in
# landsberg1976a, Cerez 1974, ..., Morinaga & Tanaka 1978), Table 9 [22, 23] (b1-b11 Hanes 1971 and b12-b20
# Morinaga & Tanaka 1978, the same digits), Tables 10-14 Gerlach 1975, Knox & Pao 1971, Magyar & Brown 1980,
# Schweitzer 1973 for f(e2) - f(i). The 576 nm value combines the NBS 1982 value (pollock1983a) with a preliminary
