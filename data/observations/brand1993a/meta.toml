basis = "Paper p. 367: pressure shift -3 kHz/Pa (Fig. 9, linear above 1.4 Pa), laser at 1.44 Pa; the MEP 2001 (source data 2.4-1) gives the wavelength measurement's cold finger as -10 C (1.4 Pa). Slope uncertainty 50 % (assumed; the paper notes nonlinearity below 1.4 Pa). Shift +4.3(2.2) kHz. The 515 nm row (Ar+ laser, conditions not given) is not corrected."
