transcription = """
Abstract and Sect. 3 (p. 107), typed from the text layer and checked against the page: two femtosecond-comb
measurements of the UME He-Ne/I2 laser UME-L3 on f (a16) of R(127) 11-5, as operated (not corrected):
473 612 353 602.0 (1.1) kHz with the BIPM comb (March 2003; cold finger 14.99 C, modulation 6.02 MHz, output
84.0 uW) and 473 612 353 600.6 (1.1) kHz with the UME comb (June 2005; 6.05 MHz, 79.4 uW). One laser, one group.
Not entered: the sensitivity coefficients of d, e, f, g (pressure -8.0 to -8.2 kHz/Pa, modulation -7.3 to
-11.0 kHz/MHz, output power -0.11 to -0.15 kHz/uW); the laser-to-laser differences (matrix method).
"""

uncertainty = "As printed, 1.1 kHz each (weighted average and its uncertainty)."

notes = "Operated at the mise en pratique conditions (cold finger 15 C, 6 MHz), so bipm2003a's coefficients are applied as for the MeP value. Residuals against i2spec2026o (obs - model, after the shift correction): -118.8 and -120.2 kHz, against -116.8 kHz for the CIPM value. Checked with the shipped model only."

[conditions]
