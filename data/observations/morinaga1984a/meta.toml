id = "morinaga1984a"
citation = "A. Morinaga, \"Hyperfine structure and hyperfine coupling constant of molecular iodine\", Jpn. J. Appl. Phys. 23, 774-775 (1984), Table II"
source = "https://doi.org/10.1143/JJAP.23.774 (publisher PDF, image scan)"
doi = "10.1143/jjap.23.774"
retrieved = "2026-10-22"
unit = "MHz"
exclude = "pending: held out of every fit, benchmark and the explorer until it is scored in a blind test"

transcription = """
Table II (p. 775), "Calculated frequency intervals between hyperfine components of P(33) line in the 6-3 band
of 127I2, together with the experimental values summarized by CCDM" (CCDM 1982, 7th session, Appendix M5,
p. M140): the "Exp." column, 21 components in MHz from the first (F = J+1, the highest in frequency). Typed
from a 200 dpi rendering of the image-only scan. The 20 nonzero values are entered relative to b21.

Sources of the column (p. 774): "CCDM adopted the frequency intervals measured by Morinaga and Tanaka [Appl.
Phys. Lett. 32, 114 (1978)] as the first ten components and those measured by Hanes et al. [J. Mol. Spectrosc.
39, 506 (1971)] as the last eleven components." Neither paper is held, so this table is the only copy of their
P(33) 6-3 values here. Groups: morinaga1984a_mt1978 (b12-b20) and morinaga1984a_hanes1971 (b1-b11). The author
adds that Hanes et al.'s data "show a systematic offset of a few MHz" from Morinaga and Tanaka's, confirmed by
Bergquist and Daniel (Opt. Commun. 48, 327 (1984)), and leaves them out of his fit.

Labels: the table lists the components in the CCDM letter order with their F; ranks are assigned here by
frequency (b1 lowest, b21 highest), which reorders one pair: the rows printed as J+1, -605.5 and J-1, -589.0
are b5 and b6 (the calculated column agrees: -610.44 and -593.80). This matches the MEP 633 nm Table 2 letters
(bipm2003a, u-a = b1-b21).

Not entered: the "Calc." column (the author's fit); Table I (see notes); Eqs. (2) and (3), empirical relations,
Delta eqQ (MHz) = 1962.4 - 1.6 v' and Delta C (kHz) = 1.41e5 / (4400 - E_v' (cm-1)) - 17.0.
"""

uncertainty = """
The paper prints no uncertainty for these values. Morinaga & Tanaka rows: 0.1 MHz, the scale of the fit's
obs - calc (0.00-0.07 MHz) on the rows it was fitted to. Hanes et al. rows: 5 MHz, from the author's "systematic
offset of a few MHz" and the obs - calc of 3.5-6.7 MHz on these rows, which the fit did not use. The Hanes rows
keep the offset of the join to b21; their spacings among themselves are better than that.
"""

notes = """
P(33) 6-3 is measured to 10 kHz in razet1993a and tabulated in bipm2003a (MEP 633 nm Table 2), so these rows
are of historical interest only. Morinaga & Tanaka 1978 and Hanes et al. 1971 are now held as morinaga1978a and
hanes1971a (b12-b20 and b1-b11 digit for digit), declared "same" below by group.

Table I (p. 774), "Hyperfine coupling constants of 127I2", is kept here and not in data/hyperfine_parameters,
which holds B-state values: the paper fits only differences (upper minus lower state) with the X state held at
eqQ'' = -2400 MHz, C'' = 0, D'' = 0.25 kHz, A'' = 0 (D: tensor spin-spin, A: scalar spin-spin), so B-state values
built from them would carry the 52 MHz error of that eqQ''. The author's own fits ("Present"):
  P(33) 6-3:  Delta eqQ 1953.1(3) MHz,   Delta C 23.1(1) kHz,  Delta D -22(20) kHz,  Delta A -9(9) kHz
  P(62) 17-1: Delta eqQ 1936(4) MHz,     Delta C 36(5) kHz,    Delta D and Delta A fixed at 0
  R(15) 43-0: Delta eqQ 1893.77(12) MHz, Delta C 189.1(4) kHz, Delta D -106(5) kHz, Delta A -8(6) kHz
(P(33) 6-3 from Morinaga & Tanaka's ten components, P(62) 17-1 from the CCDM 1982 intervals at 1 MHz.) The
other four rows are other authors' values: R(47) 9-2 and R(127) 11-5 (Glaser, BIPM report 82/12), P(13) 43-0
(Yokozeki & Muenter 1980), R(98) 58-1 (Foth et al. 1979).
"""

[overlaps]
morinaga1978a = { relation = "same", groups = ["morinaga1984a_mt1978"] }   # pending until admitted
hanes1971a = { relation = "same", groups = ["morinaga1984a_hanes1971"] }   # pending until admitted
