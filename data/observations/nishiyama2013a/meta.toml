id = "nishiyama2013a"
citation = "A. Nishiyama, D. Ishikawa and M. Misono, \"High resolution molecular spectroscopic system assisted by an optical frequency comb\", J. Opt. Soc. Am. B 30, 2107-2112 (2013)"
source = "https://doi.org/10.1364/JOSAB.30.002107 (publisher PDF via ODU, Matt's library copy papers/Nishiyama2013_JOSAB_30_2107.pdf)"
doi = "10.1364/JOSAB.30.002107"
retrieved = "2026-10-20"
unit = "MHz"
exclude = "pending: transcribed 2026-10-20 and held out of every fit, benchmark and the explorer until Matt decides whether new sets join the training data or form a blind validation set; delete this line to admit it"

transcription = """
Typed from the text layer and checked against the page (p. 2110): Table 1, the absolute frequencies of R(47) 9-2
a7 (612 nm) and P(62) 17-1 a1 (576 nm), the two CIPM lines, measured as a check (10 measurements each, averaged),
and Table 2, the a1 component of P(62) v'-1 for v' = 12-16, 18, 19 and the a7 component of R(47) v'-2 for
v' = 10-15. The dye laser is scanned, not locked, across each line with comb-derived frequency markers every
~40 MHz; peak positions come from Lorentzian fits on the spline-calibrated axis.
Labels: P(62) has even J'' (15 components), a1 the lowest; R(47) has odd J'' (21 components), a7 the seventh, as
in the MEP (bipm2003d).

Not entered: the hyperfine splittings of every measured line, which the paper uses only through the fitted
constants of Table 3 (differences of eQq, C, d and delta between the levels) and does not print; Table 3 itself.
"""

uncertainty = "As printed in parentheses (1 sigma assumed; the paper calls them \"the uncertainties of measurements\"), 0.03-0.12 MHz, mostly scan-to-scan fluctuation of the free-running dye laser and the spline interpolation; the comb itself contributes 3e-11. One spectrometer, so one group."

notes = """
Overlap: the two Table 1 lines are the CIPM 612 nm and 576 nm standards (bipm2003d, bipm2003c), measured here
independently with a comb, so no overlap is declared.

Residuals against i2spec2026o (Predictor(), obs - model): R(47) 9-2 a7 +0.08 MHz, P(62) 17-1 a1 +0.33 MHz (the
CIPM value is +0.28 MHz from the model), the rest -0.66 to +0.72 MHz, several times the printed uncertainties;
neighbouring components are tens of MHz apart, so the labels are not in doubt and the spread is the shipped
model's at B v' = 10-19 (these levels have no other comb data). Checked with the shipped model only.
"""

[conditions]
method = "saturated absorption with a scanned single-mode dye laser (AOM-chopped pump at 13 kHz, lock-in detection); comb-generated frequency markers, GPS-disciplined"
cell = "30 cm cell at 1.2 C cold point (about 4.6 Pa) for most lines, 20 C for some weak ones (not named); pump 15-20 mW, probe 1-2 mW"

[shift_correction]
pressure_Pa = 4.6
allowance_kHz = 23.0
basis = "No shift is applied: the paper gives no coefficient and does not say which lines were measured at 20 C. Allowance |-5 kHz/Pa x 4.6 Pa| = 23 kHz, as bipm2003b, small against the 30-120 kHz measurement uncertainties."
