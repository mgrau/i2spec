id = "yoshiki2023a"
citation = "M. Yoshiki, S. Matsunaga, K. Ikeda, D. Akamatsu, F.-L. Hong, Rotation dependence of v' = 44 excited-state hyperfine constants obtained via precise measurements of the hyperfine structures of 127I2 lines near 514 nm, Eur. Phys. J. D 77, 140 (2023)"
source = "https://doi.org/10.1140/epjd/s10053-023-00712-7"
doi = "10.1140/epjd/s10053-023-00712-7"
retrieved = "2026-09-15"
catalog = "data/catalog/precision.yaml#yoshiki2023a"
unit = "MHz"
transcription = """
Table 1 (p. 4): absolute frequencies of the a1 (b1) component of seven lines, kHz, 5.6 kHz each.
Tables 2-3 (p. 5): hyperfine splittings f(a_n) - f(a1) of R(38)44-0, P(36)44-0, R(36)44-0 (15
components) and R(37)44-0, P(35)44-0 (21 components), kHz, from the "Obs." columns. Parsed by script
from the PDF text layer, converted kHz -> MHz exactly. The rows were compared with the "Cal." columns
printed beside them; none differs from its calculated value by more than the paper's fit standard
deviations (1.2-1.6 kHz) allow.

Left out: components printed "-" (a3, a4 of R(38)44-0 and R(36)44-0; a5, a6 of R(37)44-0), which were not
resolved; and the four starred values the authors excluded from their fits because the components were
too close to each other (a3, a4 of P(36)44-0; a5, a6 of P(35)44-0). 79 rows: 7 frequencies, 72 splittings.
The splittings of R(58)45-0 and P(34)44-0 (Tables 7-8, pp. 7-8) are in yoshiki2023a_p34r58 (checked against the
publisher PDF 2026-10-22, which also confirmed every row here).
"""
uncertainty = """
Absolute frequencies: 5.6 kHz, the authors' combined 1 sigma (0.3 kHz statistical; systematic dominated by
a 5 kHz cell-impurity allowance, the CIPM figure). Splittings: 0.4 kHz (sqrt(2) x the 0.3 kHz lock
repeatability); the systematic shifts cancel between components of one line.
"""
notes = "Modulation transfer spectroscopy, third harmonic of a 1542 nm ECDL (dual-pitch PPLN waveguide), comb-referenced. Atlas line numbers are in the note column of the frequency rows."

[conditions]
cold_finger_C = -10.0
pressure_Pa = 1.2
pump_mW = 1.8
probe_mW = 0.3
detection = "modulation transfer"

[shift_correction]
pressure_Pa = 1.2
allowance_kHz = 6.0
basis = "Set up before the paper was re-read; meta: 1.2 Pa (Table 1 footnote; the text, p. 3, says about 1.4 Pa at -10 C; the paper's budget uses -1.7 kHz/Pa), pump 1.8 mW, no correction or coefficient recorded (same set-up as ikeda2022a). Allowance = |-5 kHz/Pa (typical, 500-600 nm) x 1.2 Pa|."
