id = "razet1991a"
citation = "A. Razet, Y. Millerioux and P. Juncar, \"Hyperfine structure of the 47R(9-2), 48P(11-3) and 48R(15-5) lines of 127I2 at 612 nm\", Metrologia 28, 309-316 (1991)"
source = "https://doi.org/10.1088/0026-1394/28/4/002 (publisher PDF; Matt's library copy papers/Razet1991_Metrologia28_309.pdf)"
doi = "10.1088/0026-1394/28/4/002"
retrieved = "2026-10-20"
unit = "MHz"
exclude = "pending: transcribed 2026-10-20 and held out of every fit, benchmark and the explorer until Matt decides whether new sets join the training data or form a blind validation set; delete this line to admit it"

transcription = """
Read from 220 dpi page images (the text layer garbles digits) and typed: the measured columns (i) of Tables 1-3
(pp. 313-314) and Table 4 (p. 315), intervals in kHz between hyperfine components measured with a tunable cw dye
laser at 612 nm (beat frequencies with a reference laser, BNM-INM).
- Table 1: 127I2 R(47) 9-2, a1, a2, a5, a6, a8-a11, a13, a14, a16-a21, from a7.
- Table 2: 127I2 P(48) 11-3, b1-b9 and b15, from b10.
- Table 3: 127I2 R(48) 15-5, c2-c6, c8, c9, from c1.
- Table 4: the links between lines, a7 - b10 and c1 - b10.
- Sect. 4: R(47) 9-2 a13 = 489 880 604.541 (0.088) MHz, "which we have determined by interferometric comparison
  in vacuum" against a 633 nm He-Ne/I2 laser on the e component, published as their ref. [7] (P. Bouchareine et al.,
  IEEE Trans. Instrum. Meas. 40, 200 (1991)), which is not held; entered here, so it cites this paper until that
  one is transcribed. Its own group, as a different measurement.
Signs: "Each hyperfine component is labelled by an index which increases with the frequency of the component", so
the column headings, printed "(a7 - an)", "(b10 - bn)" and "(c1 - cn)", hold an - a7, bn - b10 and cn - c1 (a1 is
-357 159 kHz). Table 4 follows the same reversed reading: "a7 - b10 = -452 166" is f(b10) - f(a7) and
"c1 - b10 = 61 664" is f(c1) - f(b10) = -61 664 kHz; both readings are confirmed by the MEP (bipm2003d:
b10 - a7 = -452.163 MHz, c1 - a7 = -513.83 MHz) and by b1 - a7 = -582.585 - 452.166 = -1034.751 MHz against the
MEP's -1034.75.
Labels: all three lines have even J'' (15 components) except R(47), odd (21); a_n, b_n, c_n are ranks.

Not entered: the calculated columns (iii) and the fitted constant differences (ii) of Tables 1-3; Fig. 5.
"""

uncertainty = "As stated in Sect. 3.2: intervals \"of order 3 kHz for the 47R(9-2) and 48P(11-3) lines and of order 15 kHz for the 48R(15-5)\", taken as 1 sigma (the fits' standard deviations are 2, 3 and 16 kHz); Table 4 prints the same, (3) and (15) kHz. The absolute a13: 0.088 MHz as printed."

notes = "The MEP's 612 nm tables (bipm2003d) average these with other data (e.g. dschao1980a): its intervals differ from these by 1-7 kHz. Declared there as a mean."

[conditions]
method = "single-mode cw dye laser at 612 nm locked by third-harmonic detection to an external iodine cell; beat frequencies against a reference laser"
