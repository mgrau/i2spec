id = "yang2011a"
citation = "T. Yang, F. Meng, Y. Zhao, Y. Peng, Y. Li, J. Cao, C. Gao, Z. Fang and E. Zang, \"Hyperfine structure and absolute frequency measurements of 127I2 transitions with monolithic Nd:YAG 561-nm lasers\", Appl. Phys. B 106, 613-618 (2012; published online 11 October 2011)"
source = "https://doi.org/10.1007/s00340-011-4750-6 (publisher PDF)"
doi = "10.1007/s00340-011-4750-6"
retrieved = "2026-09-27"
unit = "MHz"
catalog = "precision.yaml:yang2011a"

transcription = """
Tables 1-3 (pp. 615-616, hyperfine splittings) and the three absolute frequencies of Sect. 3 (p. 617,
also printed inside Figs. 5-7). Numbers were read from the text layer of the publisher PDF and every
table was checked value by value against 200-dpi renderings of pp. 615-617. All values are printed in
MHz (tables) or kHz (absolutes, converted to MHz exactly).

Table 1 is one beat-note scan through the overlapping R(62)22-1 and P(58)22-1 lines, every entry
measured from the lowest component, R(62) a1. The paper labels the R(62) components a1-a15 and the
P(58) components a'1-a'15. Both lines have even J'' and 15 main components, so a_n and a'_n are the
frequency ranks and are entered as a1-a15 of each line. R(62) entries are intervals to R(62) a1; the
P(58) entries are entered exactly as measured, i.e. as intervals to R(62) 22-1 a1 (ref_line set), not
re-referenced to P(58) a'1. Table 2 (R(103)23-1, odd J'', a1-a21) and Table 3 (R(130)24-1, a1-a15)
are relative to a1. The zero reference rows are not entered. Only the "Observed" columns are
transcribed; "Calculated" and "Obs. - Cal." are the paper's own four-constant fit (Table 4 constants
not transcribed). Note that Table 1's "Obs. - Cal." column is actually Cal. - Obs. (sign flipped on
every row); Tables 2 and 3 are consistent. This does not affect the observed values.

The paper says the R(62)/P(58) assignment of the two interleaved patterns rests on its hyperfine
calculation. i2spec agrees: R(62) intervals fit at 0.036 MHz rms (a9 excepted, below), and the 15
P(58) intervals share a common -0.32 MHz offset with 0.03 MHz scatter (the model's P(58)-R(62)
separation), so the assignment is kept as printed.

R(62)22-1 a9 (452.077 MHz, sequence 14) sits 0.51 MHz below the paper's own fit and 0.47 MHz below
i2spec, while its neighbours agree to <0.07 MHz. A misprint (e.g. 452.577) is possible but not evident;
it is kept as printed and flagged in its note.

Absolute frequencies (Sect. 3): P(58)22-1 a'15 = 533 974 000 250 kHz (s.d. 4.0 kHz) and
R(130)24-1 a1 = 533 978 765 860 +/- 12 kHz are entered. They are frequencies of the 561 nm
(frequency-doubled) light, measured via the 1123 nm fundamental against an Er-fiber comb referenced
to an H-maser. No pressure or power shift correction is given in the paper and none is applied
(cells at -18 C, 0.54 Pa; pump 1.0 mW, probe 0.2 mW for the measuring laser).

LEFT OUT: R(103)23-1 a1 = 533 983 045 975 +/- 6 kHz. It is 837 MHz above i2spec, and 857 MHz above
the APO/NIST 2009 atlas centre of R(103) 23-1 (17811.745767 cm-1) plus the model a1 offset, whereas
the other two absolutes agree with both references to 1-20 MHz. The Table 2 hyperfine pattern does
match R(103) 23-1 (0.2 MHz rms, vs 0.35-0.6 MHz for R(101)/R(105) 23-1), so the intervals are kept.
The 0.85 GHz discrepancy is not a single-digit misprint and not a comb-mode ambiguity (500 MHz at
561 nm). The authors' wavemeter reading (561.427 nm, 0.001 nm resolution) cannot decide it. The value
is excluded until the discrepancy is understood; restore it here if it is.

Other oddities, no effect on the data: the captions of Figs. 6 and 7 are swapped relative to the
panel labels (the panel text and Sect. 3 agree with each other); the text says "R(103)24-1" once
where R(130)24-1 is meant; the catalog entry lists author "P. Yu" where the paper prints "Y. Peng".

Rows: 2 frequencies, 63 intervals (29 from Table 1, 20 from Table 2, 14 from Table 3).
"""

uncertainty = """
The paper prints no uncertainty for the splittings, only the standard deviation of the 1000 one-second
beat readings averaged for each value (< 260 Hz for R(62)/P(58), 650 Hz for R(103), 2.3 kHz for
R(130)); that is statistical only and is not used. Each splitting is instead given sqrt(2) x the
day-to-day repeatability of one locked laser on that line from the absolute measurements (4.0, 6 and
12 kHz), i.e. 0.006 MHz for Table 1, 0.008 MHz for Table 2 and 0.017 MHz for Table 3 - the same
construction as nishiyama2024a. This is probably optimistic: the paper's own fit leaves 0.1-0.5 MHz
residuals, and i2spec 0.04-0.2 MHz rms per line. Absolute frequencies: the printed +/- (P(58): "the
standard deviation of the measurements is 4.0 kHz"; R(130): +/- 12 kHz) is the scatter of 10 daily
means (Figs. 5 and 7), taken as 1 sigma; it includes no pressure/power shift or cell allowance.
"""

notes = "Zhang et al. 2009 (Appl. Opt. 48, 5629, zhang2009a) also measured 127I2 hyperfine structure near 560-561 nm; check for overlapping lines when both sets are in."

[conditions]
method = "modulation transfer spectroscopy, two frequency-doubled monolithic Nd:YAG (1123 nm) lasers, heterodyne beat; Er-fiber comb referenced to H-maser"
cell = "45 cm, 4-pass (1.8 m absorption length), cold finger -18 C, 0.54 Pa"
laser1 = "pump 1.0 mW, probe 0.2 mW, beam 2.5 mm, EOM 277 kHz (the laser measured by the comb)"
laser2 = "pump 4.1 mW, probe 1.0 mW, beam 4 mm, EOM 250 kHz"
