citation = "M. Gläser, \"Frequency shifts at low iodine pressure of 127I2-stabilized He-Ne lasers at 633 nm wavelength\", Metrologia 18, 53-58 (1982), Table 1"
source = "https://doi.org/10.1088/0026-1394/18/2/002 (publisher PDF: a scan with an OCR text layer)"
