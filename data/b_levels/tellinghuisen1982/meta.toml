transcription = """
Tables I-III (pp. 4739, 4741) and the numbers of the text and footnotes, read from 400 dpi renders of the scan (the PDF
has a cover page). The OCR text layer is mostly right but drops digits in Table III and the linear fit (p. 4742).

continuum_obs.csv (31 rows): Table II, measured transmittance of atomic hollow-cathode lines (Ar, Ne, Mn) through I2 at
15.1 Torr, 380 K, 9.6 cm (three rows, footnote b, are the 300 K, 0.187 Torr, 75 cm measurements of Ref. 1,
Tellinghuisen 1973, re-reduced), the calculated B-X line transmittance at the atomic line, and the continuum extinction
coefficient eps_c derived from their ratio. The measured transmittance is the measurement; the B-X correction is
calculated (Luc's constants, Gaussian lines of width 0.030/0.035 cm-1 for even/odd J'').
absorption_resolution.csv (35 rows): Table III, the room-temperature spectrum 4200-8000 A resolved into transitions:
eps_tot (reprint of Ref. 1, measured with 26 A bandwidth), eps(1Pi_u-X) and eps(A-X) (calculated, footnote b), eps(B-X)
(the difference), |mu_e|^2 of B-X derived from eps(B-X) with calculated FCFs, and its R-centroid. Wavelengths printed as
"300", "400", ... in the table are written out (4300, 4400, ...).
line_coincidence_calc.csv (8 rows): Table I, the B-X lines near the Ne 6304.789 A line (15 856.574 cm-1) with their
calculated k0 l and percent absorption (calculated).
constants.csv (16 rows): the numbers of the text and footnotes (pressure calibration, 1Pi_u and A-X strengths, the
1Pi_u potential of Eq. 14, the linear B-X fit |mu_e| (D) = 0.884 R - 1.388, Davis's 1Pi_u extinction, reprocessed Brown
and Klemperer strengths).

Not entered: Figs. 1-4 (plots; Fig. 4 compares calculated radiative decay rates of B with Vigue et al.'s, using the
piecewise-linear moment function of koffend1979 bridged by a segment 3.1-3.3 A); the vapor-pressure formula Eq. (12)
(a reprint from the Encyclopedia of the Chemical Elements).

Misprints and reading notes:
- Table I: 13-5 R(175) printed 15 866.663 and 2-0 P(111) printed 15 846.692; the table lists lines near 15 856.574 in
  ascending order, which these break by 10 cm-1; 15 856.663 and 15 856.692 are meant. Entered as printed, flagged.
- Table III, 4300 A: 22.5 - 16.9 = 5.6, printed eps(B-X) 5.3; one of the three numbers is off by 0.3. As printed.
  Every other row satisfies eps_BX = eps_tot - eps_1u - eps_A to the rounding (<= 0.4).

Checks (model-free): Beer's law with the stated P, T, l, eps = -log10(T_meas/T_calc)/(c l), reproduces every eps_c of
Table II to 0.1-1 % (systematically 0.5 % low, within the pressure uncertainty), including the three 300 K rows. The
linear fit gives |mu_e|^2 = 1.00 D^2 at 2.70 A and 0.75 at 2.55 A against Table III's 1.01-1.06 and 0.56 (the paper notes
systematic deviations). Footnote 37: eps_Pi = 157 +- 5 at both 4910 and 5015 A.
"""

uncertainty = """
Table II: estimated standard deviations in parentheses (footnote a), including a liberal 50 % allowance for error in
the calculated B-X transmittance; transmittance readings 0.5 % (strong Ne) to 2 % (weak Ar). Table III: eps_tot
precision the larger of 1 L mol-1 cm-1 or 3 % (footnote a); the error bars of Fig. 3 on |mu_e|^2 (not printed
numerically) are 3 % on eps_tot plus a "somewhat arbitrary" 10 % on the continuum, or 5 L mol-1 cm-1 in eps_BX if
larger (p. 4741). Pressure 15.1 +- 0.2 Torr, temperature 107 +- 3 C.
"""

notes = """
B-X strengths over R-centroid 2.55-2.82 A from absorption, revising Tellinghuisen 1973 (not held) after subtracting
recalculated 1Pi_u-X and A-X continua (10 % weaker than in 1973). The linear fit |mu_e| = 0.884 R - 1.388 (D, R in A) is
the absorption-region function; Tellinghuisen 1997 (tellinghuisen1997) fits these Table III points together with
radiative decay rates in the form mu_e^2 = c1 exp[-c2 (R - c3)^2]/R^2 that Tellinghuisen 2011 refined (the code's
mu_tellinghuisen2011). The paper also comments on chutjian1969 (20 % low near 2.7 A, hyperfine broadening not
allowed for) and on koffend1979 (curve needs about +10 %; possible continuum losses, footnote 52).
"""

