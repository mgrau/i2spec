  not printed.
D_x1e9_calc: 1e9 D_v, RKR-calculated (Tables 1, 2, 4), cm-1.
negH_x1e15_calc: -1e15 H_v, RKR-calculated (Tables 1, 2, 4), cm-1 (so H_v = -value x 1e-15).
D_x1e8_calc: 1e8 D_v, extrapolated (Table 3) or isotope-scaled (Table 5), cm-1.
