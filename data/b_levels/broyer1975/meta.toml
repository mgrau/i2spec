id = "broyer1975"
citation = "M. Broyer, J. Vigué and J. C. Lehmann, \"Direct evidence of the natural predissociation of the I2 B state through systematic measurements of lifetimes\", J. Chem. Phys. 63, 5428-5431 (1975)"
source = "https://doi.org/10.1063/1.431275 (publisher PDF: a 300 dpi scan with a text layer)"
