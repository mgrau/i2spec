isotopologue, v, J: the B level (v', J'). tau0_ns, tau0_unc_ns: zero-pressure lifetime and its error, ns.
inv_tau0_1e6_s, inv_tau0_unc_1e6_s: 1/tau0, 1e6 s-1, as printed. sigma0_A2, sigma0_unc_A2: the I2-I2 cross section for
the destruction of the population, A^2. note: misprints and figure references.
"""
table2_rates = """
isotopologue, v: the B level v'. method: decay (this work, Table I), orientation (orientation by predissociation:
Ref. 3, this work's Sect. IV, and Refs. 4-5 for some Gamma_rad), Tellinghuisen (Ref. 1, predictions).
Gamma_rad_1e6_s, Gamma_rad_unc_1e6_s: radiative decay rate, 1e6 s-1. k_v_s, k_v_unc_s: natural predissociation constant
k_v' in Gamma_pred = k_v' J'(J'+1), s-1. k_v_limit: "<" or "~" as printed. source: footnote reference. note.
"""
