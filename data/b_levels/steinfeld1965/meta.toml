citation = "J. I. Steinfeld, R. N. Zare, L. Jones, M. Lesk and W. Klemperer, \"Spectroscopic constants and vibrational assignment for the B 3Pi0u+ state of iodine\", J. Chem. Phys. 42, 25-33 (1965)"
