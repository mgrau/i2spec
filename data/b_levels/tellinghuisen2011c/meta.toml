|mu_e| = mu0 + mu1 z + mu2 z^2 with z = R - 2.7 A, and for B the predissociation rate P), entered as printed, with the
standard errors in parentheses as printed (footnote b). Only the B column is B-X; the A and C columns are A-X and C-X and
are kept because the B-X fit is the same least-squares fit. Table II: the computed molar absorptivity of I2 (g) at 0 C and
35 C, 390-900 nm in 5 nm steps (103 rows), entered as printed. Table II is a model output (the B-X, A-X and C-X
spectrum computed from Table I; the paper's supplement holds the component bands, not held here), not a measurement.

Not entered: the component bands (supplementary material 25, not in the PDF), Figs. 1-12 (figures: Fig. 10 gives the
error of the B-state results, not printed numerically); the 64 C spectrum appears only through its scale factor (Table I footnote b).
The fitted C-state bound-free and predissociation data are in the text of Sect. C, not tabulated (not entered).

Checks (model-free): all 103 Table II wavelengths present once; the two temperatures agree with the text statement that
the two computed spectra intersect at 487 nm with epsilon = 416 l mol-1 cm-1 (the 0 C and 35 C columns cross between 485
and 490 nm, at about 416; checked against the printed rows, not re-computed). Table I: the B-column mu0 = 1.0055 D and
mu1 = 0.72 D give |mu_e| = 1.0055 + 0.72 (R - 2.7) at R = 2.85 A = 1.1135 D, against 1.1123 D of tellinghuisen2011
(Eq. 9 there, from the 520-635 nm absorption): a 0.1 % difference at 2.85 A
(the B state is a pseudocontinuum model, not a spectral-simulation of the same spectra).
"""

