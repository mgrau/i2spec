transcription = """
Table II (p. 5643), all 23 rows, read from a 200 dpi render and checked against the PDF text layer (which
drops the g/u subscripts). One row per printed row, in the printed order. The 0 state printed second at the
2P3/2 + 2P1/2 limit carries no +/- in print; it is 0g- (the limit has one 0g+, one 0g-, B 0u+ and one 0u-,
and Table I lists them so).

The paper's convention (eq. 15): V_i(R) = E_diss(i) + C5/R^5 + C6/R^6, fitted to the diagonalized
multipole energies over 7 <= R <= 12 A, so a negative C is attractive. Check: B 0u+ at R = 8.20494 A gives
-15.46 cm-1, the paper's Table IV value 15.49 (sign as tabulated, -E_int).
"""

notes = """
State labels (column chen2005). Saute's states are the eigenstates of the long-range interaction, so the
two 1g and the two 1u at the 2P3/2 + 2P1/2 limit are listed by C5, not by Hund's case (a) parentage. Chen,
de Jong & Ye, JOSA B 22, 951 (2005), Fig. 2, attach them: the strongly attractive 1g (C5 = -2.39) is
1'g = 1g(1Pig), the nearly pure-C6 1g is 1''g = 1g(3Sigmag-); the repulsive 1u (C5 = +2.38) is
1'u = 1u(3Sigmau+) and the nearly pure-C6 one is 1''u = C:1u(3Sigmau+).

Check (prototypes/explore/physical_search/second_order_hyperfine.py, long_range_quadrupole()): at
2P3/2 + 2P1/2 the first-order C5 is a pure exchange term (the 2P1/2 atom has no quadrupole moment), so it
is one reduced matrix element squared times angular factors. Scaled to B = -3.59, the separated-atom
angular algebra gives 0g+ +3.59, 0g- 0, 0u- 0, 1g -2.393 and 0, 1u +2.393 and 0, 2g +0.598, 2u -0.598: every
printed value to its last digit, the tiny printed C5 of 0u-, 1g and 1u (-0.0039, -0.0069, +0.0061) being
the admixture of the other limits that Saute's 23-state diagonalization keeps. The eigenvectors fix the
long-range mixing of the separated-atom functions |1'> = |3/2 1/2; 1/2 1/2> and |1''> = |3/2 3/2; 1/2 -1/2>
in each Omega = 1 pair: |coefficient| = sqrt(3)/2 = 0.866 for both the g and the u pair. Pique et al. 1986
use 0.84 for the 1g pair; Chen et al. fit 0.99 (Fig. 6, C_B) and 0.92 (Fig. 9) for the 1u pair.

C6 is nearly isotropic, -2.106 +- 0.5% (text, p. 5643), so C5 sets the long-range splittings. Chen et al.
replaced the 0u- long-range curve by the 2g one and "fine tuned" the 1g(1Pig) one (pp. 958-959); those
adjustments are model choices, not data, and are not entered here.
"""
