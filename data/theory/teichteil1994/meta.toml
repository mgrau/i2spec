notes = """
Relativistic effective-core-potential MCSCF + spin-orbit CI over all 23 states of the three lowest limits.
The paper gives curves only as figures (Figs. 3-5) and constants only for the states in this table, none
of the nine perturbers of B at 2P3/2 + 2P1/2. Kept as the independent calculation behind the de Jong et al.
1997 curves (data/theory/dejong1997), which those authors say closely resemble these. Text results worth
keeping: B''1u(1Piu) is the only 1u state crossing B and (2)0u- the only 0u- state (Sec. 3.4); a'(2)0g+ is
69% 3Pig at re(X) but 59% 3Sigmag- where it crosses B at 3.27 A (Table 5).
"""
