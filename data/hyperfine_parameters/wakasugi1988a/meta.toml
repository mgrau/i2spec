Uncertainties are the printed (+-) values. The J = 0 row (eQq' = -493.6 (34.2) MHz, pure quadrupole, footnote b) has no
C, d or delta, so it is not in data.csv (the loader needs all eight values); it is recorded here only.
The average row (eQq' = -510.3 (0.5), mu G'/I = 32.5 (0.6), Dt' = -30.2 (2.3), Ds' = -9.9 (1.6) kHz) is not a row.

Line naming (one row per level J' is printed, but the paper names lines only in Fig. 6): the B level J' is the upper level
of an R(J'-1) line from J'' = J' - 1 (Fig. 6(a) is labelled "B v' = 13, J' = 6" for R(5), which fixes the rule for J' = 6),
so row J' = J is named "127I2 R(J-1) 13-1". For J' = 1 this is R(0). The table also gives the X state's J'' = J rows
(wakasugi1988 constants.csv); the paper does not say which of its lines each X row comes from. This line naming is the
paper's Fig. 6 convention, not a printed statement for every J, and it is flagged as a doubt in the report below.
"""

