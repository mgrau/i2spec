transcription = """
The "Fitted hyperfine parameters for the excited state B" block under each Appendix B table, for the five lines that
the thesis leaves out of Table 4.1 because of the 1g(1Pi_g) perturbation: P(69) 58-0, R(18) 59-0, P(77) 60-0 (two
fits, two rows), P(84) 60-0 and P(63) 70-0. Their measured components are data/observations/chen2005thesis_b.
Read from the text layer, with the minus signs (dropped by the text layer) taken from the column geometry as in
chen2005thesis_a, and every value and sign checked against 200 dpi renders of pp. 209, 213, 223, 225 and 247.
Uncertainties are the printed parenthesised digits converted to MHz exactly ("-550.7(3.8)" is 3.8 MHz). fit_sd_kHz is
the printed "standard dev." (MHz) times 1000. Unusual signs are as printed: d_B > 0 for P(69) 58-0 and both P(77)
60-0 fits, delta_B < 0 for P(77) 60-0 fit 1.

These fits are the authors' own and they reject them: Sec. 4.4 says the fits of P(69) 58-0, R(18) 59-0, P(77) 60-0
and P(63) 70-0 "produce very large standard deviations (0.3-1 MHz)" and that P(84) 60-0 "cannot be fitted at all by
the effective hyperfine Hamiltonian" (footnote 2: with a2 and a10 excluded, a fit with 1.1 MHz residual error).

Lines also in chen2004a are not entered again. The thesis's Table 4.1 (pp. 87-88) equals chen2004a (JOSA B Table 1)
in every value, uncertainty and standard deviation of all 74 lines (compared by script). The blocks under the
Appendix B tables equal Table 4.1 for 62 of those lines (standard deviations within 1-4 kHz, the appendix printing
them in MHz to two figures, e.g. 0.20 MHz for 196 kHz). For 12 they differ and are not entered (the published Table 4.1 is the authors' final set;
entering the appendix values would give two parameter rows for one spectrum). Appendix vs Table 4.1:
  misprints (one digit): P(19) 42-0 C 0.1766(17) vs 0.17666(17); P(91) 45-0 d -0.1325(10) vs -0.1324(10); R(65) 57-0
    eqQ -571.756(86) vs -571.765(86); P(43) 63-0 eqQ uncertainty (82) vs (83).
  a different fit of the same spectrum (eqQ, C, d, delta; sd in kHz):
    R(27) 43-0  -558.662(26), 0.191579(37), -0.0980(17), 0.0006(13), 12  vs -558.667(23), 0.191593(38), -0.0988(16), 0.0015(12), 11
    R(51) 47-0  -563.295(17), 0.270541(14), -0.1473(12), 0.01565(88), 10 vs -563.294(12), 0.270529(10), -0.14741(84), 0.01588(64), 7
