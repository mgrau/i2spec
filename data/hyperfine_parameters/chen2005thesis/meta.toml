notes = """
X-state values held fixed (App. B, eqs. B.2, B.3 and the table footnotes), the same as chen2004a's (BKT02 eqs. (14) and
(10); d_X = 1.524 kHz, delta_X = 3.705 kHz), so these B-state values compare directly with i2spec's:
- eqQ_X from eq. B.2, printed per table (in `note`). As printed, B.2's J''(J''+1) term reads
  -0.1927e-3 (v''+1/2)^2 J''(J''+1); the per-table values of all 78 single-fit tables follow -0.1927e-3 J''(J''+1)
  without the (v''+1/2)^2 (to 5 kHz), so the factor is a misprint: eqQ_X = -2452.2916 - 0.542(v''+1/2)
  + 0.4535e-1 (v''+1/2)^2 - 0.1927e-3 J''(J''+1) + 0.694e-5 (v''+1/2) J''(J''+1) MHz.
- C_X from eq. B.3, 1.9245 + 0.01356(v''+1/2) - 15098/(E(v'') - 12340), printed as MHz but in kHz, with E(v'') the
  vibrational energy above v'' = 0 in cm-1: the tables print C_X = 0.00315478 MHz for v'' = 0 and 0.00318986 MHz for
  v'' = 1, which this reproduces. The text below B.3 says "d_B and delta_B are fixed"; the table footnotes say d_X and
  delta_X, which is meant.
All five lines are from v'' = 0. The basis spans Delta J = 0, +-2, +-4 (Sec. 4.3.2).
"""
