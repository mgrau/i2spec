transcription = """
What the paper prints: NO line positions. The 1564 assigned B-X lines (12 bands, J up to 168) are not listed anywhere
in the paper or its PDF; Table I gives only the number of assigned lines per band (R and P branches) and the min and max
J of each. The hot-band line positions the catalog asked for are therefore not in this source. Nothing was entered for
them. The 1564 positions are not on any supplement page of the HAL copy (13 pages, all of the paper).

Read from the page images (200-220 dpi renders of the scan, PDF pages 7, 8, 10; the OCR text layer was checked against
them): Table III (p. 1424), Table IV (p. 1425), Table V (p. 1425), Table VII (p. 1427). Every value of Tables III, IV, V
and VII was read from the image; the text-layer copies agree on the digits that could be checked. Not entered: Table I
(band counts, p. 1422), Table II (correlation matrix extract, p. 1423), Table VI (Dunham constants of the B state, p. 1426),
Table VIII (Franck-Condon factors and Boltzmann factors, p. 1428). Tables VI and VIII and Table I are printed and are a
candidate for a later pass; they were not part of this assignment's constant values.

Checks (no model involved): Table V column a agrees with the D and H of Table VII to the printed digits (D 0.4836,
0.4871, 0.4907, 0.4946, 0.4984 against 0.483609, 0.487178, 0.490717, 0.494564, 0.498379; H -0.781 to -0.938 against
-0.7808 to -0.9375). Table III and Table VII band origins agree to 0.0015 cm-1 (v'=0), 0.0009 (v'=1) and 0.0003 (v'=2); the
G(v'') values for v''=10-14 differ by up to 0.0045 cm-1 (v''=13) between the two fits. The B(v'=0) values differ by 6e-7
cm-1 between the fits (10B 0.2892582 against 0.2892525).
"""

uncertainty = """
Printed standard errors: Table III, G 1.5e-3 cm-1, 10 B 1e-6, 1e8 D 4e-11, H'(v'=0,1,2) as printed (98, 45, 83 in the last
digits of 1e-14). Table VII prints no standard errors; the paper says (p. 1426) that the errors of Table VII are those of
the all-free fit (1.5e-3 cm-1 for G, 1e-6 for 10B, 4e-11 for D). The residual sd is 0.003 0 cm-1 (Table III) and
0.003 36 cm-1 (Table VII); the paper states the line uncertainties are 0.002-0.004 cm-1 (p. 1421).
"""

