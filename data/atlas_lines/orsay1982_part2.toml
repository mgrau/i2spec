extraction = """Transcribed by eye from photographs of the printed table, with structural checks (consecutive line numbers, monotonic wavenumbers) and the overlaps between parts; assigned against the model line list at 773 K thinned to the atlas's line density, 120 MHz window, a strongest candidate 3x any other (prototypes/orsay_assign_parts.py, with the production model of the time). 893 of 1152 lines assigned, about 40 (4.4 %) by chance in a null that scrambles positions within each cm-1. Lines printed twice in the overlap with a lower part are kept once, from the lower part (0 here). docs/research/orsay-atlas-11000-14000.md"""
