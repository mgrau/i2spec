tungsten-halogen lamp; a photomultiplier. Vacuum wavenumbers, 14 000-15 600 cm-1, on 95 plates of 20 cm-1 each
(pp. I-IV, Figs. 1-2)."""
calibration = """The atlas's own 1978 scale, as printed. The internal coherence of the wavenumbers is 5e-8 on average, so
+-0.001 cm-1 for strong unperturbed lines; the absolute values are assured only to better than +-0.006 cm-1 over the
whole spectrum (p. VIII). No reference standard or correction is stated in the front matter. No correction is
applied here (Knöckel et al. 2004 give a recalibration rule for this part, catalog knockel2004a). eps_mk is the
authors' noise-only uncertainty of the line pointing (p. IV)."""
extraction = """Every line table (pp. 1-92), read from the photographs (research scripts). Each photo was turned
upright (the rotation in which OCR finds the most table rows), its lighting flattened, the background outside the
paper and ink larger than a character (the spine, the facing page's edge, plate show-through) blanked; each page was
cut into its four columns at the left edge of the next column's line numbers (rows are not segmented: curl and
perspective slant them differently in each column). Two independent model readings of every column crop, matched by
line number: they agree on 4820 of 4831 rows (2842 of these also agree with tesseract's reading). The other 11 rows
have a character one or both readings marked unreadable: 8 were read again on the image and agree with one reading
(settled); 3 depths were read on the printed page. The last columns were cut again with a wider margin after the first
readings and read again, twice. Checks: an independent blind reading of 9 pages (596 rows) differs in one character (N
68 of series 4, a broken digit; read on the printed page as the two readings have it); a blind reading of the 24 rows
where OCR's wavenumber differed from the two readings in one digit and still fitted the order agrees with the two
readings in all 24; the line numbers step by one within each numbering series and the wavenumbers increase within each
series."""
tables = """The numbered ('repérées', ticked) lines: N, sigma (vacuum cm-1, 4 decimals), eps (1e-3 cm-1, noise only)
