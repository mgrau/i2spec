no correction is applied. Against the FTS atlases held here the 30-0 lines read +3.6 mK (salami_ross_2005), +4.9 mK
(apo_nist_2009) and +7.0 mK (debus_2023) high (medians of 160-164 selected lines; scatter 0.5 mK), within that
statement and of the size of the -0.0056 cm-1 correction later found for the authors' 1978 atlas (catalog
gerstenkorn1979a)."""
