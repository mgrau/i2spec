transcription = """
Tables I-IV (pp. 60-67) read from 450-900 dpi renderings of the scan (the typewritten Table II is clean; the OCR text
layer garbles many digits, e.g. '18514.5615' for 18 514.5675, '18392.1891' for 18 392.7897, '-41.7' for -47.7, '-0.9' for
-8.9), every entry entered: 162 R and 161 P entries, 323 in all, of which 10 (the five doublets R(131)-R(135) = P(128)-
P(132)) share 5 observed values, so 318 distinct lines. Widths printed '0' with intensity '0' (P(69), P(70), P(77)) are
entered as printed; blank width or intensity cells stay blank.

Checks (no model involved):
- The calculated wavenumbers (observed + CAL-MES) were fitted with nu0 + F'(J') - F''(J'') (B, D, H for both states): rms
  5.6e-5 cm-1 over all 323 entries (the rounding of CAL-MES to 1e-4 cm-1), and the fit returns Table III (B30' 0.0228367,
  1e9 D30' 14.81, 1e15 H30' -37.3, B0'' 0.0373116, 1e9 D0'' 4.55, 1e15 H0'' -0.71). Only two entries depart by more than
  1.5e-4: P(28) (-0.76e-3 cm-1: printed obs 18 684.6596 with CAL-MES -0.4) and R(55) (+0.30e-3), both checked on the image
  and entered as printed. A fit of the 169 '+' lines to their observed values gives rms 0.0007 cm-1, the printed S.D.
- The large CAL-MES values (up to -47.7e-3) coincide line by line with large departures from the other FTS atlases held
  here (apo_nist_2009: R(162) +48, R(163) -33, P(133) +34 mK after the common offset), i.e. they are real blends, not
  reading errors. Selected lines agree with apo_nist_2009 to 0.5 mK (median absolute deviation) after the +4.9 mK offset.
- Table I: l1 - l2 and l1 + l2 agree with l1, l2 in every row; the mean of the seven ratios not involving lines 112 and
  113 is 1.401 (text 1.40 +- 0.08) and of all ten 1.352 (text 1.35).
- The R(J+3) - P(J) doublets close at J = 128-131 as the text says (identical printed values), and Eq. (1) gives +0.002
  cm-1 at J = 129.

Not entered: Figs. 1-9 (set-up, low-resolution spectrum, band head, branch intensities with perturbed lines a, b, c...,
line profiles, reproducibility, uranium calibration, doublet shapes).
"""

uncertainty = """
Single-line precision: the S.D. of the selected lines about the fit is 0.0007 cm-1; two interferograms agree to better
than 0.001 cm-1; photon noise alone gives at least +-0.0005 cm-1. Absolute: the uranium calibration may shift the whole
spectrum by up to +-0.004 cm-1 (stated), and the comparison with later atlases shows the spectrum 3.6-7.0 mK high. Lines
not marked '+' are asymmetric, too wide or too intense (blends) and can be off by tens of mK (CAL-MES up to 47.7e-3).
The constants' errors in Table III are as printed (one sigma, last digits for B).
"""

notes = """
The first published Fourier-transform analysis of an I2 band from the Orsay group (the precursor of the 1978 atlas and of
data/b_levels/luc1980): one band, (30,0) at 5350 A, J up to 165, the first determination of the H constants. 'Perturbed'
lines a, b, c... of Fig. 4 are not identified in Table II. Table IV reprints constants of Le Roy, Brown et al., Barrow
and Yee (data/b_levels/barrow1973) and Wei and Tellinghuisen (data/b_levels/wei1974), labeled there as reprints or
calculated. Not compared with any model.
"""
