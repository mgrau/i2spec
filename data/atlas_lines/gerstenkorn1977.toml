instrument = """Fourier transform absorption spectrum (the Connes-Michel spectrometer of Laboratoire Aime Cotton): 13-cm cell
at room-temperature vapor pressure, 40-W tungsten-iodine lamp, a filter limiting the range to about 2500 cm-1 (the (29,0)
and (30,0) bands at the top of the response); 4e5-point interferograms (28.5 cm path difference, steps of 9/8 of the
He-Ne reference wavelength), instrumental width about 0.025 cm-1, matched to the line width (resolution about 700 000);
about 4 h per interferogram; vacuum wavenumbers."""
calibration = """Uranium hollow-cathode lines superimposed on the spectrum (Fig. 8; the uranium wavenumbers known to about
