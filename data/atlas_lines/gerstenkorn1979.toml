transcription = """
Tables I-VI (pp. 311-316), read row by row from 300 dpi renderings of the image-only scan (its text layer is
too garbled to use), and read a second time independently. The two readings agree on every row but two, both
in Table III and both on this font's 3/5 ambiguity, settled on the image: 19 192.1693 (or .1695; 2R (38,0)),
and 19 194.8304 with 147R (49,0) calculated .8355 (or .8504 and .8555; calculated minus observed is +5.1 mK
either way). Every row is entered: all observed lines, assigned or not, and all assignment rows, including the
rows that carry only an assignment and a calculated value. Abbreviated wavenumbers (".9350")
are expanded with the integer part of the last full value in the same column. One calculated value is printed
with three decimals and is entered so: 45P (40,2) 18 831.812 (Table IV). Two lines in Table V, 17 596.7481 and
17 596.7850, have no intensity printed. The least certain digits, read alike both times (3 or 5, last place):
observed 19 430.4123, 18 909.2195, 19 195.0893, 19 195.1983 and 19 192.1693; calculated 67R (45,0) 19 430.4095
and 108P (8,1) 16 341.6293; the intensity 83 of 18 908.9427. Where a band has enough lines its smooth course
settles such digits (e.g. 10P (32,0) .8293, 11P (43,0) .8193).

What the columns mean (pp. 310-313): the calculated wavenumbers come from molecular constants fitted band by
band by least squares (nonlinear SIMPLEX) and extended to higher J in a few iterations, not from the global
fit (ref. 5, P. Luc, J. Mol. Spectrosc., then to appear). The tables list the lines in wavenumber order and
print each calculated-only row beneath the observed line that precedes it; Table VII brackets such rows with the line above (e.g. five transitions with
19 430.1491), so the authors treat most of them as blended in that line, but some lie far from it (87R (55,1),
+0.138 cm-1 from 19 431.3197; 29R (24,3), +0.323 cm-1 from 17 593.0697; 29R (7,1) at 16 340.9813 is printed under
16 340.6439, two rows above the line 16 340.9831). The pairing is therefore kept as printed in "line" and
"with_line" and no observed value is attached to those rows. The first assignment printed on a line's row is
likewise not always the nearest: 22R (41,2) 18 909.7270 on the row of 18 909.7674, 23P (24,3) 17 594.8154 on the
row of 17 594.8772.

Not entered: Table VII (p. 317), wavenumbers near 5145 A calculated from the constants of Wei & Tellinghuisen
(1974) and Barrow & Yee (1973) and from the global fit, with Barrow & Yee's J_max; it repeats the observed values
of Table I and adds five (v',2) lines with calculated values only, 60,2 R(49) .4810, 60,2 P(48) .6680,
61,2 R(54) .8050, 62,2 R(58) .138 and 61,2 P(53) .184 (19 429-19 430 cm-1). Table VIII (p. 319), six
fluorescence doublet splittings, Fabry-Perot (Patterson et al. 1975) against the atlas and the global fit.
Figs. 1-7, the spectra with the assigned lines drawn against level diagrams.

Checks (no model involved): observed wavenumbers rise down every table; atlas numbers rise by one per numbered
line in every table (I 4073-4088, II 1609-1622, III 2920-2936, IV 1277-1301, V 3468-3482, VI 2354-2374). The
calculated values of the bands with enough lines follow one polynomial in m (m = J+1 for R, -J for P) to
0.1-0.3e-4 cm-1 rms, i.e. rounding: (7,1), (9,2), (11,3), (13,4), (17,0), (22,2), (24,3), (32,0), (38,0), (41,2),
(43,0), (49,1); the lower-state combination differences R(J-1) - P(J+1) of (32,0) and (43,0) agree to 2e-4 cm-1,
and so do the upper-state differences R(J) - P(J) of (32,0), (41,2) and (43,0) with a smooth curve. Calculated
minus observed, for the lines with a single assignment printed on their row: median -1.0 mK, rms 4.7 mK (2.8 mK
for I >= 60). The observed positions agree, line by line, with other measured atlases held here
(salami_ross_2005, apo_nist_2009) to a few mK after a common offset of +4 to +7 mK (the size of the later
-0.0056 cm-1 correction), except at blends.
"""

uncertainty = """
The paper states no uncertainty for the wavenumbers. Its text gives the line half-widths (up to 0.040 cm-1), the
resolving power (about 1e6) and agreement with Barrow & Yee's constants within 0.020 cm-1 below their J_max.
Later, the authors estimated the absolute accuracy of the atlas at 0.002 cm-1 once 0.0056 cm-1 is subtracted
(gerstenkorn1979a), which applies to these values. Intensities are the atlas's relative values (strongest about
90). The calculated values are rounded to 1e-4 cm-1.
"""

