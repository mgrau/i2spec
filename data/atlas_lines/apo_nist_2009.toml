kind = "atlas line positions"
instrument = """NIST 2-m FTS, RESOLUTN 0.018 cm-1, 32 scans, Xe lamp; air wavelengths converted here"""
calibration = """HeNe-referenced FTS scale; agrees with Salami & Ross to <= 5e-8 in earlier checks"""
extraction = """Line positions fitted from the transmission spectrum by a research script:
per-line wavenumber shifts of the i2spec model template in 2.4 cm-1 windows stepped by 2 cm-1, with
the column density, baseline, zero offset and instrument width fitted per window, hyperfine structure
included in the template, and a ridge prior of 0.01 cm-1 on each shift. Repeats combined by inverse
variance (a research script). Kept: fit sigma < 30 MHz, window rms <
4% of transmission, line depth > 0.03. The positions are
hyperfine-free line centres on the atlas's own wavenumber scale; that scale carries a calibration
offset and slope which belong in the fit as a group nuisance parameter, and are NOT in the per-line
uncertainty below."""
uncertainty = """sqrt((1.55 sigma_fit)^2 + 7.5^2) MHz. sigma_fit is the window fit's covariance,
inflated by sqrt(chi2/dof) where repeated windows disagree; the scaling is fitted to the difference
between this atlas and the other one binned by sigma_fit, which measures what the template gets wrong
on blends and hyperfine patterns as well as the noise. Checked against every precision measurement of
the same lines: normalised residuals 0.7-1.3 after removing each atlas's constant offset. The
calibration offset itself is excluded and belongs in the fit as a group parameter."""
n_lines = 40128
