id = "chapman1972a"
citation = "G. D. Chapman and P. R. Bunker, \"Magnetic quenching of iodine fluorescence excited by a 6328 A He/Ne laser\", J. Chem. Phys. 57, 2951-2959 (1972), Table I (zero-field lifetimes)"
source = "https://doi.org/10.1063/1.1678689 (publisher PDF: a scan with an OCR text layer; Table I read from the page image)"
doi = "10.1063/1.1678689"
retrieved = "2026-10-28"
exclude = "pending: held out of every fit, benchmark and the explorer until it is scored in a blind test"

transcription = """
Table I (p. 2958), "Comparison of observed and calculated b values using the potential energy curve of Eq. (12)":
columns v', |<psi_c(vib)|psi_a(v')>|^2, b calc and obs (10^5 T^-2 s^-1), tau (microseconds). The tau column has
values for 11 levels; the two at v' = 6 and 11 are quoted from Shotton and Chapman (J. Chem. Phys. 56, 1012, 1972;
footnote c: "the values for v' = 6 and 11 are from Ref. 7"), so they are NOT entered here: they are the two rows of
shotton1972a (310 +- 10 and 410 +- 15 nsec, J' = 32 and 128). The nine remaining levels are entered, in ns (x 1000):
v' = 14: 0.44 +- 0.1; 16: 1.1 +- 0.1; 18: 0.62 +- 0.1; 21: 0.55 +- 0.1; 24: 0.65 +- 0.1; 28: 0.55 +- 0.1; 32: 0.64 +- 0.1;
38: 0.83 +- 0.1; 48: 2.3 +- 0.3 (microseconds, as printed). No J' is given, so J is empty.
The b values (magnetic predissociation) and the Franck-Condon columns are not entered: the schema has no magnetic
coefficient. Not entered: Eq. (12) and the curve of Fig. 8.
Method (footnote c): the other values are intercepts of gamma^-1 against [I2] from the Degenkolb et al. (1969) broadband data
(the paper's ref. 1 is cited as J. Chem. Phys. 51, 615 in this catalog, and as 51, 516 in chutjian1969; one is a misprint),
using the observed b values quoted here and a squared collision radius assumed to be 70 +- 10 A^2 (footnote b).
"""

uncertainty = """
As printed (1 sigma is not stated in the table). Footnote d: "Uncertainties for all but v' = 6 and 11 states reflect
only the arbitrary +-10 A^2 uncertainty in the collision radius", so these lifetimes carry only the +-10 A^2 error of
the assumed cross section; treat them as low-weight. Entered as printed.
"""

notes = """
Read in full (pp. 2951-2959). The nine lifetimes are not single-level measurements: they are extrapolations of
Degenkolb's broadband data with an assumed squared collision radius (70 A^2), and they carry one intercept each.
Their weight should be low for a natural-linewidth model.

Cross-checks against held data (model-free, not duplicated):
- broyer1975 (data/b_levels/broyer1975/table1_lifetimes.csv): v' = 16, J' = 57 at 1227 +- 50 ns against 1.1 +- 0.1
  microseconds here (consistent at about 1.3 sigma of the combined error); v' = 18 at 955-1030 ns (J' = 37-104)
  against 0.62 +- 0.1 microseconds here (a factor 1.6, outside the errors). Broyer's levels are single-level
  measurements, so the v' = 18 value here is the less reliable.
- chutjian1967 (catalog, not held): region 20-24 at 689 ns against 0.55-0.65 microseconds here for v' = 21 and 24.
"""

[conditions]
method = "fluorescence intensity against magnetic field (to 1.6 T) and I2 pressure; He-Ne 632.8 nm excitation; interference-filter selection of v' emission; Table I zero-field tau from the Stern-Volmer intercepts"
temperature = "cell temperature corrected to 300 K (footnote in Chapman and Bunker, as stated for the Degenkolb reanalysis)"
pressure_range = "0.020-0.270 torr I2"
cell = "not stated"
perturber = "self (I2)"
