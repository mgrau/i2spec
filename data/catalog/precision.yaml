  verified: true
  notes: "Read in full (2 pages). A spectrometer report, not a frequency measurement: it shows a 32 kHz HWHM a7 resonance of R(26)62-0, called the narrowest iodine resonance observed in a cell, against the 43 kHz narrowest natural width estimated near 523-498 nm by cheng2002a. Different from duburck2004a (CPEM 2004 digest pp. 43-44, comb frequency measurement with SYRTE, which names a11 and gives no value); this digest uses a7, the component whose absolute frequency is then published in duburck2005a (whose about 30 kHz HWHM linewidth is the same result). The full component set is in goncharov2007a; borde2002a has Raman splittings of the lower level X v''=0 J''=26 via this line. Misprints: the probe power is printed '100 pW' (likely 100 uW, inferred); ref. [4] (Flory et al., Rev. Phys. Appl. 12, 901) is dated 1997 for 1977. The 32 kHz width is an upper bound on the natural plus transit width of a7 at 0.05 Pa, at most a loose check on the model's natural width for B v'=62 J'=27 (cf. Keller, Broyer, Lehmann 1973, cited here as ref. [1]). Nothing to transcribe."
