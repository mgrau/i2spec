  n_items: 6
  uncertainty: "'six hyperfine splittings of the ground state of I2 were determined with a 0.2-kHz accuracy'; Table 1 footnote: 'Numbers in parentheses are estimated reproducibilities in units of 0.1 kHz' (all (2)); pressure broadening 7 +/- 1 kHz/mTorr"
  uncertainty_MHz: 0.0002
  absolute: false
  hyperfine_resolved: true
  data_availability: "Table 1 (6 splittings in kHz, with four Yokozeki-Muenter values for comparison); text and Fig. 4 (pressure broadening)"
  machine_readable: false
  likely_in_knockel2004: unknown
  priority: low
  verified: true
  notes: "Read in full (12 pages, mostly line-shape theory). The first Raman measurement of this group; wallerand1999a remeasured the same J''=13 level with an improved set-up (30-40 Hz) and extended it to 16 splittings per level and to J''=15, and it supersedes this paper. All six splittings here are among the 16 J''=13 values of wallerand1999a Table 2(a) (that table writes the transitions in the opposite direction, e.g. (5,14 -> 5,15) = -100 892.328 kHz against (5,15 -> 5,14) = 100 892.4 kHz here). Magnitudes compared (inferred): 75 377.5 vs 75 377.963 (-0.46 kHz), 87 249.1 vs 87 249.494 (-0.39 kHz), 100 892.4 vs 100 892.328 (+0.07), 212 479.0 vs 212 479.080 (-0.08), 218 699.0 vs 218 699.102 (-0.10), 228 679.2 vs 228 679.163 (+0.04); the first two differ by about twice the quoted 0.2 kHz. No hyperfine constants are fitted here. Numbers not in wallerand1999a: only the pressure-broadening slope (7.08 kHz/mTorr, intercept 13.6 kHz HWHM, 0.3-60 mTorr), the narrowest width (about 8 kHz HWHM at 0.2 mTorr), the measured Raman absorption (0.5e-6 in 50 cm, against 0.68e-6 calculated) and the inputs quoted for that calculation (Franck-Condon factor 1.779e-2 for v'=43, v''=0 and transition moment 0.95 D^2, taken from Borde, Camy, Decomps 1979); wallerand1999a cites the 7(1) kHz/mTorr broadening from this work. No pressure shift found within about 1 kHz. Relation to borde2002a: that proceedings takes its J''=13 and 15 constants from the later Raman work, not from these six values. The comparison values in Table 1 are those of yokozeki1980a (four of the six, 0.1-0.4 kHz). Not worth transcribing as a separate set: wallerand1999a has the same splittings at about six times smaller uncertainty; at most keep the six values as a superseded record linked to wallerand1999a."

- id: razet1996a
  citation: "A. Razet, S. Picard, A tabulation of calculations of the hyperfine structure in 127I2, Metrologia 33, 19-27 (1996)"
  doi: "10.1088/0026-1394/33/1/3"
  url: "https://doi.org/10.1088/0026-1394/33/1/3"
  year: 1996
  group: "BNM-INM/CNAM (Paris); BIPM (Sevres)"
  isotopologues: ["127I2"]
  system: "B-X"
  technique: "compilation of fitted four-term hyperfine constants (eqQ, C, d, delta) from published and privately communicated fits to measured hyperfine intervals; no new measurements"
