  uncertainty_MHz: 0.002
  absolute: false
  hyperfine_resolved: true
  data_availability: "Table 5 (12 measured intervals of R(47)9-2 relative to a7, beside the calculated a1-a21 spectrum with forbidden and crossover columns); Table 6 (four Delta constants); Table 3 (pressure-shift coefficients for six cells); Table 2 (cell-purity differences); text (broadening, modulation-frequency and power coefficients)"
  machine_readable: false
  likely_in_knockel2004: unknown
  priority: high
  verified: true
  notes: "Read in full (7 pages). The primary source of the FMS column quoted in galzerano2000a Table 1 (cited there as ref. [8]). The values match: all ten FMS intervals given by galzerano2000a (a1, a2, a4-a11) are identical to the Table 5 'measured' column here (e.g. a1 -357 156, a2 -333 966, a4 -86 162, a11 119 048 kHz), and the four Delta constants are identical (1948.00(2) MHz, 25.162(4), -16.2(3), -18.3(4) kHz). This paper should be the primary record and galzerano2000a cited second for these numbers. Differences: (1) this paper also gives a12 219 607, a13 249 598 and a14 284 303 kHz, which galzerano2000a omits; (2) it prints no per-interval uncertainty, while galzerano2000a attaches (2) kHz to each FMS value; use 2 kHz (the later authors' assignment, consistent with the 300-700 Hz repeatability and 1.1 kHz cell-purity scatter here) and say so; (3) the FMS pressure-shift coefficients galzerano2000a quotes for a7 and b15 (-8.1(1), -7.1(2) kHz/Pa) are this paper's single-cell values for cell K (-8,12(0,08), -7,1(0,2) kHz/Pa, Table 3), not the six-cell means (-6,9 kHz/Pa, s.d. 1,1, and -5,7 kHz/Pa, s.d. 1,3); (4) the FMS modulation-index coefficients galzerano2000a attributes to this paper (-4(4), 2.4(6) kHz/rad) are not printed here (Fig. 9 only). Table 6 symbols are lost in the text layer; the row order is Delta eqQ, Delta C, Delta delta, Delta d, as in razet1996a Table 26 (column [32], 'Bisi M., personal communication, 1995', identical values), whose lower-state constants for this fit are fixed at eqQ'' = -2452.6 MHz, C'' = 3 kHz, delta'' = d'' = 0. Other numbers: pressure broadening 86 kHz/Pa (s.d. 13) for a7 at 2.5 MHz, 92 (16) and 105 (4) kHz/Pa for b15 at 2.5 and 10 MHz; modulation-frequency shifts -1,8 (-2,2) and -1,9 (-2,4) kHz/MHz for a7 and b15 at 3.29 (4.55) Pa; power shifts -5,8(0,5) and -3,3(0,8) Hz/uW; cell-purity rms differences 3.8-6.6 kHz over seven cells (reference cell Q probably polluted). The Table 5 calculated spectrum (algorithm of Picard, BIPM/90-5) agrees with the measured column within 3 kHz; it is derived and need not be transcribed. Overlaps galzerano2000a, bipm2003d (the MeP 612 nm R(47)9-2 table) and razet1996a. Worth transcribing: the 12 measured intervals of Table 5 (MHz relative to a7, 2 kHz) as the primary FMS record, and the four Delta constants as derived values; shift and broadening coefficients into the systematics notes."

- id: borde1996a
  citation: "Ch. J. Borde, G. Camy, N. Courtier, F. du Burck, A. N. Goncharov, M. Gorlicki, Line-shape studies in high-resolution stimulated resonance Raman spectroscopy and application to accurate determinations of hyperfine splittings in I2, J. Opt. Soc. Am. B 13, 1837-1848 (1996)"
  doi: "10.1364/josab.13.001837"
  url: "https://doi.org/10.1364/josab.13.001837"
  year: 1996
  group: "Laboratoire de Physique des Lasers, Universite Paris-Nord (Villetaneuse); Institute of Laser Physics, Novosibirsk"
  isotopologues: ["127I2"]
  system: "X"
  technique: "stimulated resonance Raman spectroscopy in a 50 cm cell: two perpendicularly polarized copropagating beams from one single-mode Ar+ laser at 514.5 nm, one shifted by AOMs (double-pass), laser locked to a strong (Delta F = Delta J) hyperfine component of P(13)43-0 (line inferred from the quoted v'=43, J'=12, a7 labels), signal on the weak (Delta F = 0) beam; 5 kHz FM, Lorentzian-derivative fits; beams expanded to w0 0.5-1 cm; line-shape theory (density-matrix diagrams, transit time, beam divergence)"
  observable: "X-state hyperfine splittings (Raman frequencies); Raman-resonance pressure broadening and line shape"
  range_nm: [514.67, 514.68]
