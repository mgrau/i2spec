- id: knockel2004a
  citation: "H. Knoeckel, B. Bodermann, E. Tiemann, High precision description of the rovibronic structure of the I2 B-X spectrum, Eur. Phys. J. D 28, 199-209 (2004)"
  doi: "10.1140/epjd/e2003-00313-4"
  url: "https://doi.org/10.1140/epjd/e2003-00313-4"
  year: 2004
  group: "Hannover (Institut fuer Quantenoptik)"
  isotopologues: ["127I2", "129I2", "127I129I"]
  system: "B-X"
  technique: "global potential fit (X-representation potentials + BOC) to hyperfine-corrected rovibronic frequencies"
  observable: "term values"
  range_nm: [514.0, 833.0]
  range_cm1: null
  transitions: "about 1500 rovibronic frequencies; v'' 0-17, v' 0-43, J up to ~238; NIR local Dunham fit for bands 0-12 ... 0-17 (778-815 nm)"
  n_items: 1500
  uncertainty: "input floor 3 MHz (1 sigma) on every datum; prediction 2 sigma < 3 MHz for 526-667 nm and 776-815 nm, ~30 MHz for 514-526 nm, up to 60 MHz for 667-776 nm; NIR Dunham model 1 sigma < 200 kHz"
  uncertainty_MHz: 3.0
  absolute: true
  hyperfine_resolved: false
  data_availability: "assigned data set in electronic supplementary table ('Online material'; footnote p.199 points to www.edpsciences.org); Springer page requires login, ESM not retrieved here"
  machine_readable: false
  likely_in_knockel2004: true
  priority: high
  verified: true
  notes: "Baseline to beat. Read from full text: data 'mostly' from refs [2-23,30-33,36]; Gerstenkorn-Luc atlas recalibrated (Tables 2-3) to fill 667-776 nm and 514-526 nm; ~400 lines from the Kato Doppler-free atlas (a1/a10/a15, 526-667 nm, 3 MHz floor); P(42) and R(45) 39-2 near 532 nm from H. Schnatz (PTB, private communication 2001). Stated gaps: no direct precise link between v'' 0-7 and v'' 12-17; systematic negative residuals up to 5 MHz for moderate J in bands 33-0, 34-0, 35-0; BOC poorly determined because only six 129I2 lines and one 127I129I line were available; more isotopologue data requested. Implemented in IodineSpec (TOPTICA)."

