  notes: "Direct ground-state hyperfine splittings at sub-kHz to kHz accuracy, independent of the B state. The J=13 and 15 values come from earlier Raman work (Borde et al. JOSA B 13, 1837 (1996); Wallerand et al. EPJ D 6, 63 (1999)), neither in the catalog; the J=26, 54, 55 splittings appear new here (a full paper was announced as ref. [3], to be published). n_items (inferred count) = 30 splittings + 17 X-state constants (four each for J=13, 15, 26, 54; eqQ only for J=55, with C, d, delta fixed) + 2 eqQ(J) fit parameters + 8 B v'=43 constants + 2 values for the P(13) eg crossover (saturation 114 341(1) kHz versus Raman-derived 114 339.79(0.014) kHz). The B v'=43 constants are derived from the Borde 1981 saturation data (borde1981a) with the new X constants, so they are not independent of that set. Overlaps: same rovibronic line R(26)62-0 as goncharov2007a and duburck2005a (B-state side); the X eqQ J dependence overlaps hong2001b and should agree with it. Worth transcribing: the 30 Raman splittings as X-state intervals (MHz, quoted kHz uncertainties) and the X and B constant tables; check whether the later full paper superseded them before scoring."

