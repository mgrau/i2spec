  notes: "Hot cell wall raises the X v''=5 J''=127 population and the peak contrast tenfold (C = 2.5e-3 at 18.6 Pa, room temperature), allowing operation down to 5.3 Pa. New here: the self-pressure shift of component e is linear above 6.6 Pa and appears to flatten below about 6.65 Pa (attributed tentatively to velocity-changing collisions); |d(dv)/dp| decreases with wall temperature. From Fig. 5a the 293 K slope is roughly -6 kHz/Pa and Fig. 5b gives T^(1/2)|d(dv)/dp| ~ 0.12 MHz Pa^-1 K^(1/2), i.e. about 7 kHz/Pa at 293 K (both inferred, read from the figures). Also reports a line asymmetry at low pressure and low saturation that causes the large modulation shift (Fig. 6). Same group as cerez1980a (612 nm). Overlaps the 633 nm MeP conditions (bipm2003a) and the -1.0 MHz/Torr shift of Cerez et al. 1974 quoted by van Oorschot. Not worth transcribing as line data; the 0.14 MHz/Pa broadening and the shift slope could go into a systematics note."

