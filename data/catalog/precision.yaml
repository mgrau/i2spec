# pyodine Stage 2b catalog: sub-Doppler, hyperfine-resolved and absolute-frequency
# measurements of molecular iodine (B-X system unless noted).
# Compiled 2026-09-14. See docs/research/02b-precision-data.md for the narrative.
# Conventions:
#   - uncertainty_MHz is a representative 1-sigma value in MHz (null if not convertible).
#   - likely_in_knockel2004: true if the source is cited by / used in Knoeckel, Bodermann,
#     Tiemann, EPJD 28, 199 (2004); false if published after mid-2003 or clearly not used;
#     "unknown" otherwise.
#   - verified: true only where the citation was confirmed via DOI resolver, Crossref,
#     OpenAlex, Semantic Scholar, or the primary document itself.
#   - Numbers quoted in notes are copied from the source (abstract, BIPM MeP document, or
#     full text); anything inferred by the compiler is marked "(inferred)".

# ---------------------------------------------------------------------------------------
# A. BIPM Mise en pratique (MeP) recommended iodine radiations (current list, checked
#    https://www.bipm.org/en/publications/mises-en-pratique/standard-frequencies on
#    2026-09-14). Frequencies/uncertainties quoted verbatim from the MeP PDFs.
# ---------------------------------------------------------------------------------------
- id: bipm2012a
