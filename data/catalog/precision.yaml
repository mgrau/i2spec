  notes: "likely_in set to unknown because this 2012 compilation mixes the 2001 CIPM data (used in Knoeckel 2004 via Quinn 2003) with the 2007 additions (not used). Conditions: cold finger (-15 +/- 1) C, 1 MHz p-p modulation (3f), 17 +/- 11 mW/cm2. Pressure coefficient -4.2 kHz/Pa (from Nevsky 2001) used to reduce -5 C data. CCL notes the global mean drifted from ...513.2 to ...511.5 kHz since 2001 (sd 2.6 kHz) but kept the value. Sources: Diddams 2000, Ye 2001, Sugiyama 2002 (NMIJ), Holzwarth 2001, Nevsky 2001; intervals Ye 1999, Zhang 2001, Hong 2000-2004, Arie & Byer 1993/94, Eickhoff thesis 1994, Macfarlane 1999, Jungner 1995, Picard 2003, Hong 2001. The PDF labels the 2007 line both 'R(121) 35-0' (p.3) and 'P(121) 35-0' (Table 19); Hong 2002 title says R(121)35-0. The 2001 version of this list (Quinn 2003) was in the Knoeckel fit; the three 2007 additions (R(85)33-0 from Hong 2004) were not all available then."

