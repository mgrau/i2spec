  n_items: 630
  uncertainty: "fit uncertainties in the last digit(s) in parentheses, e.g. R(127)11-5 Delta eqQ = 1944,649(7) MHz, Delta C = 28,407(2) kHz; fit standard deviations s from 1.9 kHz (R(127)11-5) to 16000 kHz (P(56)73-0)"
  uncertainty_MHz: null
  absolute: false
  hyperfine_resolved: true
  data_availability: "Tables 1-37 (79 constant sets, inferred count of columns): Delta eqQ, Delta C, Delta delta, Delta d, eqQ', eqQ'', C', C'', delta', delta'', d', d'', s; comments a-j"
  machine_readable: false
  likely_in_knockel2004: unknown
  priority: medium
  verified: true
  notes: "Read in full (9 pages). These are fitted constants, not measured intervals and not ab initio calculations: each column names the measurement source and the fit ('calculation') source. Inputs: measured hyperfine intervals from about 40 works (e.g. Pique 1981 and Borde 1981 at 502/515 nm, Arie & Byer 1993/94 and Eickhoff & Hall 1995 at 532 nm, Hackel 1975, Foth & Spieweck 1979, Glaser 1985-87, Razet 1991/1993, Morinaga 1989, Kremser 1994, Belaidi 1995, Koffend 1978) plus the Glaser PTB-Opt-25 (1987) fits of the CIPM interval lists. Lower-state constants are usually fixed (comment a) to the Yokozeki-Muenter X v''=0 J''=13 values eqQ'' = -2452,584(2) MHz, C'' = 3,162(8) kHz, delta'' = 3,66(3) kHz, d'' = 1,58(5) kHz for every J'' and v'', or to rounded values (-2452.6 MHz, 3 kHz, 0, 0); so the upper-state columns absorb the lower-state J and v dependence, and the Delta constants are the robust quantity. Several columns are unpublished elsewhere (personal communications: Razet & Picard 1995 refits, Rayman/Winters/Hall at 543 nm, Bertinetto 1986 via Glaser, Bisi 1995 = the later bisi1997a Table 6, identical values). Comment b: R(15)43-0 fit adds a magnetic octupole term, Delta Omega_m = -2,2(7) kHz. Row order (read from the page image; symbols are lost in the text layer): Delta eqQ, Delta C, Delta delta, Delta d, then -eqQ', -eqQ'', C', C'', delta', delta'', d', d'', s. Use as a cross-check: (1) compare the model's upper-minus-lower constants for each line against the Delta columns (the spread between columns for the same line, e.g. R(127)11-5 Delta eqQ 1943.5-1944.673 MHz across seven fits, shows the real scatter); (2) for lines whose interval lists are not transcribed (612 nm R(34)17-6 and R(48)15-5, 640 nm, 657 nm, 605 nm, 589 nm, 793 nm and the two 1.3 um lines), regenerate the component spectra from these constants with the stated lower-state convention and compare with model predictions, allowing the quoted s. n_items is an estimate (inferred: 79 columns times about 8 fitted values). Overlaps nearly every hyperfine entry in the catalog (bipm2003a, arie1993a, eickhoff1995a, kremser1994a, morinaga1989a, razet1993a, yokozeki1980a, bisi1997a). Worth transcribing only the Delta constants of lines with no interval data in the catalog; the rest duplicate their sources."

