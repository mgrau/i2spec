  machine_readable: false
  likely_in_knockel2004: false
  priority: low
  verified: true
  notes: "Proposes the zero-pressure zero-power HWHM of a10 as a cell-purity metric: the dirty cell is about 3 times broader than the clean one, and the Pyrex cells are narrower than the clean fused-silica cell and unchanged after one year (within 15 kHz). The extrapolated width still contains transit-time (~30 kHz for a 1 mm beam), recoil (~6 kHz) and laser (~1 kHz) contributions; the width vs pressure is nonlinear at low pressure (weak elastic collisions). A fixed-fill cell (T_sat = -15 C) varies by only ~7 kHz (sd) in width from 13 to 33 C. Table labels R1dirty/R2clean are swapped relative to the text (first reference cell K = 1.33 Pa is the clean one) and to the SPIE version, but the widths go with the right cells. Conference version: hrabina2014c (SPIE 9441, same tables). Companion at 514.7 nm: hrabina2014b. Also catalogued in broadband.yaml as hrabina2014 (same paper; that record should be removed). The widths are cell- and setup-specific purity indicators, not natural linewidths; not worth transcribing."

