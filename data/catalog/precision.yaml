  notes: "Read in full (7 pages). Companion of wakasugi1989 (broadband.yaml, 14-1 band head line strengths), which attributes this paper's forbidden-component intensity anomaly (Delta F = 0 strengths about twice the theory, Fig. 8) to partial saturation. Unlike wakasugi1989, this paper does tabulate hyperfine data: Table 1 gives per-J constants of both states (B v'=13 and X v''=1, each row the level with that J in the state named; J=0 has eQq only, footnote b; X spin-rotation and spin-spin fixed to zero), and Fig. 6 prints 36 measured level splittings (18 for B v'=13 J'=6, 18 for X v''=1 J''=5, from R(5), the only fully resolved line; values 6.0-83.5 MHz in B and 15.4-369.7 MHz in X) plus 4 calculated ones in parentheses. n_items = 57 table values + 36 measured splittings (inferred count). Forbidden components at low J give absolute (not differential) constants for both states, which is the point of the paper; no J dependence found. Caveats: precision is MHz-level, and the frequency scale rests on the nominal 300 MHz FSR of a commercial etalon, whereas wakasugi1989 calibrated its etalons against La hyperfine splittings (297.7 and 81.6 MHz); if the same etalon was used, a scale error near 0.8% is possible (inferred). The X v''=1 average eQq'' = -2459.9(1.4) MHz is about 7 MHz more negative than the X v''=0 values of borde2002a and wallerand1999a (-2452.59 MHz), a larger change than expected from v''=0 to 1 (inferred), consistent with a scale error of that order. The J=6 mu G'/I = 51.3(8.1) kHz is an outlier. The line positions themselves are not given (wavenumbers computed here: 13-1 R(0) 16999.985, P(5) 16999.35 cm-1, inferred from the model). Overlaps: no other held set at B v'=13 low J is known; the 12-0 band head work of Churassy et al. (Opt. Commun. 30, 41 (1979), ref. 9) is not in the catalog. Worth transcribing as a coarse low-v', low-J check of the model's B and X hyperfine structure: Table 1 averages and per-J constants, and the 36 Fig. 6 splittings as level intervals with 2 MHz (1-sigma, inferred from the stated per-line precision) uncertainties; flag the possible scale error."

- id: wallerand1999a
  citation: "J.-P. Wallerand, F. du Burck, B. Mercier, A. N. Goncharov, M. Himbert, Ch. J. Borde, Frequency measurements of hyperfine splittings in ground rovibronic states of I2 by stimulated resonant Raman spectroscopy, Eur. Phys. J. D 6, 63-76 (1999)"
