  isotopologues: ["127I2"]
  system: "B-X"
  technique: "two 612 nm He-Ne lasers (2 mW, intracavity I2 cell for single-mode operation), external 50 cm cells at -5 C cold finger (3.19 Pa); frequency modulation spectroscopy (EOM at 2.5 or 10 MHz, index about 1), AOM giving +/-20 MHz offsets so both lasers can lock to the same component; beat counting, matrix method over seven cells"
  observable: "hyperfine splittings; hyperfine constants (upper minus lower); pressure, modulation-frequency and power shifts; pressure broadening; cell-purity reproducibility"
  range_nm: [611.97, 611.97]
