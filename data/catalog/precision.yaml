  technique: "Pyrex cells filled to a set saturation pressure (0.83, 4.15, 15.89 Pa) vs fused-silica reference cells; HWHM of the a10 component from AOM-scanned 3f profiles (inverse-3f fit, 800 kHz modulation), extrapolated to zero pressure and zero power; LIF Stern-Volmer K0"
