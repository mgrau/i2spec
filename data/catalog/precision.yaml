  isotopologues: ["127I2"]
  system: "X"
  technique: "stimulated resonant Raman spectroscopy in a 57 cm pumped cell at about 0.13 Pa: two copropagating beams from one Ar+ laser at 514.5 nm (prestabilized to a cavity locked to a P(13) or R(15) 43-0 saturated absorption component), each shifted by an AOM driven by GPS-referenced synthesizers; beam 1 on the strong (Delta F = Delta J) component, beam 2 on the weak (Delta F = 0) one; 12.5 mm waist, pinhole spatial filter, shearing interferometry for wavefront flatness; 5 kHz FM, Lorentzian-derivative fits, 7 kHz HWHM lines; mean of two series of ten measurements"
  observable: "X-state hyperfine splittings (Raman frequencies) and X-state hyperfine constants; line-shape systematics (wavefront curvature, light shift, pressure, magnetic field)"
  range_nm: [514.67, 514.68]
  range_cm1: null
  transitions: "X v''=0 J''=13 (via P(13)43-0, intermediate B v'=43 J'=12): 16 splittings (epsilon, F -> epsilon, F+1), epsilon = 3 or 5, F = 8-18; X v''=0 J''=15 (via R(15)43-0, intermediate B v'=43 J'=16): 16 splittings (epsilon, F -> epsilon, F-1), F = 10-20"
  n_items: 40
  uncertainty: "combined standard uncertainty (1 sigma) 28 to 39 Hz per splitting (60 Hz and 75 Hz for two weak lines); splittings 27 to 458 MHz; constants J''=13: eqQ = -2452.58514(45) MHz, C = 3.1536(33) kHz, d = 1.528(18) kHz, delta = 3.708(22) kHz; J''=15: eqQ = -2452.59699(45) MHz, C = 3.1543(29) kHz, d = 1.519(18) kHz, delta = 3.701(23) kHz"
  uncertainty_MHz: 0.00003
  absolute: false
  hyperfine_resolved: true
  data_availability: "Table 2(a) and 2(b) (32 splittings in kHz with Hz uncertainties); Table 3(a) and 3(b) (8 constants); Table 1 (uncertainty budget); Fig. 2 level diagram"
  machine_readable: false
  likely_in_knockel2004: unknown
  priority: high
  verified: true
  notes: "Read in full (14 pages). Exactly which levels: X v''=0 J''=13 and X v''=0 J''=15 only, 16 splittings each (32 in total), between hyperfine sublevels of equal pseudo-spin epsilon (3 or 5) and adjacent F; signs in Table 2 follow the level ordering (e.g. J''=13 (5,17 -> 5,18) = -458 150.320 kHz). The two weak lines with larger uncertainty are J''=13 (3,10 -> 3,11), 60 Hz, and J''=15 (3,13 -> 3,12), 75 Hz. Sequel to Borde et al., JOSA B 13, 1837 (1996) (not in the catalog), which it supersedes with an improved and enlarged set; agrees with the Yokozeki-Muenter molecular-beam values (yokozeki1980a) for J''=13, whose uncertainties are 100-1600 Hz. Relation to borde2002a: that proceedings quotes X constants for J''=13 and 15 from this work and adds J''=26, 54, 55 Raman splittings via 501.7 nm lines; its eqQ(J) fit reproduces this paper's eqQ values (-2452.58515 at J=13 and -2452.59707 MHz at J=15 from -2452.54774 - 2.0553e-4 J(J+1), inferred check), so the J=13/15 constants there are not independent of this set. Relation to wallerand2006a (and its data/observations set): same first author and the same P(13)43-0 line at 514.7 nm, but that paper is a comb measurement of absolute optical frequencies (P(49)44-0 a1-a21 and P(13)43-0 a3); no numbers in common, and the Raman splittings here are pure X-state intervals, independent of the B state. Pressure: no shift measurable between 1 and 4 mTorr (15 Hz standard deviation); broadening 7(1) kHz/mTorr from the 1996 work; light shift about -213 Hz estimated for two lines, removed by extrapolation to zero power; the eqQ difference between J''=13 and 15 (-11.85 kHz) is attributed to centrifugal distortion, and the overlap with hong2001b on the eqQ J dependence should be checked. Worth transcribing: the 32 splittings of Table 2 as X v''=0 level intervals (MHz, with the quoted Hz uncertainties) and the 8 constants of Table 3; they are the most precise ground-state hyperfine data in the catalog for these two levels."

- id: bisi1997a
  citation: "M. Bisi, F. Bertinetto, Frequency reproducibility of He-Ne lasers at lambda = 612 nm using the frequency modulation spectroscopy technique, Metrologia 34, 451-457 (1997)"
  doi: "10.1088/0026-1394/34/6/1"
