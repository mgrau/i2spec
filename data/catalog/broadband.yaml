  notes: "Read the Metrologia article 2026-10-28 (the earlier note was based on the 53-page Rapport BIPM-92/4). 22 of 34 cells lie within +/-10 kHz and 16 of 27 have K0 < 2 Pa; a pure cell has K0 = 0.7 Pa (calculated). Five cells (NIM II, III, IMGC2, INM6, INM LAC) showed anomalous fluorescence; KRISS 4 and 5 contained no detectable iodine. Irregular d-e-f-g patterns in PTB16/89, PTB7/90 and NRC7/12 (-286.4 kHz) are attributed to traces of 129I2 via 127I129I P(33)6-3 coincidences. Repeat values: BIPM35 K0 4.70 Pa and -39.2 kHz here vs 4.97 Pa and 52.0 kHz (magnitude) in fredinpicard1989; JAEGER 6.30 Pa, -133.8 kHz vs 6.42 Pa, 186.8 kHz. New numbers relevant to line data: the 129I2 k - 127I2 i interval measured with cell NRC9/2, 95.81 and 95.84 MHz at 12 and 15 C (no uncertainty given), 0.06-0.09 MHz below the CCDM 1983 value 95.90(4) MHz; worth recording as an isotopologue cross-check if that interval is ever fitted. Otherwise cell-quality data that support the 5 kHz cell-impurity allowance; nothing entered in data/."
