  transitions: "Tables I–VI, windows of 3–4 cm⁻¹ around Ar⁺ 5145 Å (19 428.8–19 431.9 cm⁻¹), Ar⁺ 5287 Å (18 907.0–18 911.0), Kr⁺ 5208 Å (19 191.9–19 195.9), Kr⁺ 5308 Å (18 830.1–18 833.9), Kr⁺ 5683 Å (17 593.0–17 596.8) and He–Ne 6119 Å (16 338.0–16 342.0): 219 observed lines (atlas number, wavenumber, intensity; 108 with atlas numbers, 19 unassigned) and 315 assignment rows with calculated wavenumbers, 115 of them calculated-only rows printed beneath an observed line; 67 bands, v′ 7–61, v″ 0–4, J″ 1–174, including the (v′,2) bands v′ = 40–46 found near 5287 and 5308 Å after a search over 28 ≤ v′ ≤ 46. Table VII: calculated wavenumbers near 5145 Å from three sets of constants (Wei–Tellinghuisen, Barrow–Yee, the authors' global fit), with five (v′,2) lines calculated only. Table VIII: six fluorescence doublet splittings, Fabry–Perot against the atlas."
