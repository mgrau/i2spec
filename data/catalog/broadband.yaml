  transcription: "not needed: analysis of the same spectrum with no tabulated numbers; the few quoted splits are low priority"
  notes: "Read in full (4 pages). Shows that absorption from thermally excited X levels extends the B <- X continuum well below D0: near D0 the bound (epsilon_b) and continuum (epsilon_c) parts vary almost linearly with frequency, epsilon_b going to zero at D0 with slope about epsilon/kT, and the continuum is largest exactly at D0 in I2 (unlike Br2 and Cl2). The B-X continuum supplies about 170 of the 400 liter mole-1 cm-1 measured at 5061 A (Ar line) in tellinghuisen1973a, and the 1Pi_u <- X transition supplies about 40% of the absorption at D0. Revises Brewer and Tellinghuisen (brewer1972) and tellinghuisen1972: direct B <- X dissociation at 5010 and 5091 A was underestimated there, so their predissociation rates for high v' were too high and radiative rates too low; the increase in total decay rate near D0 (Capelle thesis 1972) is attributed to a higher radiative rate (possibly infrared emission to a second 0g+ state near 6 A). Proposes a Franck-Condon-density route to FCFs for levels just below D0. Potentials from tellinghuisen1973a; barrier heights from the long-range B constants in that paper's footnote 52. Relevant to modeling the smooth background under the discrete lines near 500 nm in a broadband cross-section fit. Not worth transcribing (figure only); reproduce with a modern potential if needed."
