# i2spec Stage 2a catalog: broadband, Doppler-limited and supporting data for molecular iodine
# Compiled September 2026.
# One list item per dataset; schema fields in fixed order (id ... notes). Sub-Doppler / hyperfine-resolved /
# comb-referenced 127I2 B-X frequencies are catalogued separately (Stage 2b) and appear here only as context.
# Category blocks (comments only): 1 FTS atlases & broadband; 2 fluorescence, term values, other states;
# 3 isotopologues; 4 intensity (cross sections, transition moment, lifetimes, vapor pressure); 5 line shape.
# uncertainty_MHz is filled only where the source states a 1-sigma/standard-error value (1 cm-1 = 29979.2458 MHz).
# verified: true means the citation was confirmed (DOI/Crossref/OpenAlex/HAL/ADS/DataCite/ISBN/publisher/arXiv
# record, or the reference list of a paper read in full); numbers not seen in a primary source are flagged in notes.
#   - status: "held" (the publication or its data is in hand), "unobtainable: <why>" or "not useful: <why>".
#   - transcription: null when data sets in data/ point to this entry (their meta.toml has catalog = "<file>:<id>";
#     i2spec.catalog.datasets() lists them), else "to do: <what>", "not needed: <why>", "not possible: <why>" or
#     "n/a: not held". Added 2026-10-28; counts give the transcription coverage.

