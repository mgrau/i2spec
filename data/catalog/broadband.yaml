  notes: "Existence confirmed by an ADS record, an OpenLibrary ISBN record (1978, 546 pp.) and Knöckel 2004 ref. [1]. Knöckel ref. [1] lists the series as separate Laboratoire Aimé Cotton volumes: 14 000–15 600 cm⁻¹ (1978), 15 600–17 600 cm⁻¹ (1977) and 17 500–20 000 cm⁻¹ (1977). Knöckel Table 3 ('atlas III', 14 800–20 000 cm⁻¹) gives a cell temperature of 250 °C, instrument widths of 660 MHz (rectangular, estimated) and 450 MHz (sinc), and a shift of the line maximum from the pure rovibronic frequency of −8.2(2.0)e-4 cm⁻¹ for odd J″ (zero for even J″). Knöckel used atlas lines only to fill gaps (514–526 nm and 667–776 nm; most data for 8 ≤ v″ ≤ 11). To use it in a new fit, the line list must be digitized (OCR) or its lines re-measured by profile fitting of the Salami & Ross spectrum."
