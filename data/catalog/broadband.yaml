  n_items: 8
  uncertainty: "zero-pressure homogeneous linewidth 2Gamma0 = 784 kHz +/- 15 %; self-broadening 126.5 kHz/Pa +/- 10 % (FWHM); at 7.1 Pa 2Gamma0 = 1640 +/- 20 kHz; power-broadened 2Gamma = 3669 kHz (sigma 4.8 kHz) at I0 = 16"
  uncertainty_MHz: null
  absolute: false
  hyperfine_resolved: true
  data_availability: "text, about 8 values (784 kHz and 126.5 kHz/Pa; 2Gamma/2Gamma0 pairs at 7.1 Pa: 3669/1659 kHz at I0 = 16, 3688/1637 at 17, 3649/1682 at 15 for 66.6 uW; 2795/1658 at I0 = 6 and 2821/1609 at 7 for 23.3 uW; 2232-2213 kHz at 7.6 uW); Figs. 7-10 graphs (2Gamma vs pressure 7.1-23.5 Pa; saturation parameter vs power)"
