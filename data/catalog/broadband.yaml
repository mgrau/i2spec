  notes: "This is the Hannover fit data set and the direct baseline for our global fit. Composition (from the PDF): Hannover near-IR absolute and difference frequencies (778–815 nm); 1 MHz grids of Velchev 1998 and Xu 2000 (571–655 nm); 532 nm and 514 nm measurements; about 400 averaged frequencies from Kato's Doppler-free atlas (a1, a10 and a15 components, 526–560 nm); Rakowsky 1989; Rong et al. and Grieser et al.; recalibrated Gerstenkorn atlas lines (514–526 and 667–776 nm); and CIPM lines (Quinn 2003) including isotopologues. The text says 'about 1500'; the χ² discussion quotes 1513 observations (χ² ≈ 830). Range: the abstract says 514–815 nm, while Fig. 5 is labelled 833–515 nm. The PDF reports systematic −5 MHz residuals at moderate J″ in the 33-0, 34-0 and 35-0 bands near 19 000 cm⁻¹. If the table cannot be recovered, it can be rebuilt approximately from the cited sources, since each subset is catalogued here or by the sub-Doppler agent."
