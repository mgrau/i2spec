  group: "Institute of Thermophysics, Siberian Branch of the USSR Academy of Sciences, Novosibirsk (V. P. Chebotayev); Institute of Electronics, Bulgarian Academy of Sciences, Sofia"
  isotopologues: ["127I2"]
  system: "B-X"
  technique: "saturated absorption (2f detection) in a 70 cm external cell in a longitudinal magnetic field up to 780 Oe, circularly polarized light, offset-locked Ar+ laser heterodyne spectrometer (10 kHz linewidth), about 10 mTorr I2, field reversal to separate linear and quadratic shifts"
  observable: "Zeeman g-factors and quadratic Zeeman shift of hyperfine components"
