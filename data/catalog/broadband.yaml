  notes: "Read in full. Transcribed as data/b_levels/broyer1975 (held out as pending): Tables I–II (data/ had no lifetime set; lifetimes are B-level properties). Demonstrates the J'(J'+1) dependence of the inverse lifetime from gyroscopic predissociation; k_v' is about ten times smaller than Tellinghuisen predicted, with the same v' shape; Gamma_rad varies strongly with v'. The decay-method k11 = 67 ± 6 s-1 agrees with orientation by predissociation (68 ± 10), but Gamma_rad differs (1.09 vs 1.37e6 s-1), suggesting a slight J' dependence of Gamma_rad. Misprint: 1/tau0 errors of v' = 9, J' = 33 and 39 are printed 0.9 for 0.09. Natural widths 1/(2 pi tau0) = 0.12–0.42 MHz (computed). Core input for a natural-linewidth model Gamma(v',J') = Gamma_rad(v') + k_v' J'(J'+1) (+ hyperfine term)."
