  status: "held"
  transcription: null
  notes: "Read in full. No significant variation of the Ar broadening rate among the 15 hyperfine components, so one common rate per line is reported; P(10) broadens about 30 % faster than P(70), attributed to inelastic rotational transfer; low-pressure intercepts (7.7-8.7 MHz) are power/saturation dominated, not natural widths. A broad Gaussian pedestal from velocity-changing collisions depends strongly on J (large for J'' = 67, small for J'' = 118). Table 1 also gives observed hyperfine intervals of P(70) 17-1 relative to component i (magnitudes only, 10 kHz digits, about 1.3 MHz systematically larger than the matrix calculation) and observed relative intensities, which show self-absorption distortion in the wings. Inconsistencies: Fig. 3 is described for odd J'' although both studied lines have even J''; intervals for components g-b are printed without sign. No pressure shifts are reported. Overlaps the Ar/rare-gas broadening set (Astill et al. 1985 on P(46) 17-1, fletcher1995, Kireev 1995) and cites titov1997a for self-broadening at 633 nm. Worth transcribing Table 2 (three rates and three intercepts) (foreign-gas line-shape systematics); the Table 1 intervals (15 values at about 1 MHz) are a weak hyperfine check for X v'' = 1 / B v' = 17 at J = 70 and could be added at low weight. The related AFIT dissertation (Phillips 2006, AFIT/DS/ENP/06-03) is the source of the apparatus."
