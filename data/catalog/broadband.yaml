  uncertainty_MHz: 1.0
  absolute: false
  hyperfine_resolved: true
  data_availability: "Table 1 (P(70) 17-1: 15 components with F-J, (2F+1)/(2J+1), observed relative intensity, high-J and matrix calculated and observed intervals from component i in GHz); Table 2 (3 broadening rates and 3 intercepts); Figs. 5-10"
