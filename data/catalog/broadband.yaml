  n_items: 13
  uncertainty: "Table 2 g_F'I / g_F''I: a1 -1.64 / -0.67, a4 -1.16 / -0.43, b1 -1.19 / -0.52, each 0.01 (printed with -/+ signs); g_I' = 0.34 +/- 0.12, g_J' = -0.44 +/- 0.04, g_I'' = 0.02 +/- 0.13, g_J'' = -0.44 +/- 0.04; Delta g_J = g_J' - g_J'' = -0.36 +/- 0.02, Delta g_I = g_I' - g_I'' = 0.48 +/- 0.08; quadratic shift 150 kHz at 780 Oe, Delta k = k' - k'' = about -0.25 Hz/Oe^2"
  uncertainty_MHz: null
  absolute: false
  hyperfine_resolved: true
  data_availability: "Tables 1-2 and text, 13 values; Figs. 2-4 (line shapes in field, shift versus M'') graphs only"
  machine_readable: false
  likely_in_knockel2004: false
  priority: low
  verified: true
  status: "held"
  transcription: "not needed: Zeeman g-factors and field-quadratic shifts; the model is zero-field"
  notes: "Read in full. Placed here (Category 5, line shape) rather than in the precision catalog: it gives g-factors in nuclear magnetons and a field-quadratic estimate, not zero-field line positions or intervals, and the shifts were measured at 780 Oe, far above any laser-standard field; the magnetic components were not fully resolved, so only peak positions were analyzed. Its metrology conclusion is that the quadratic effect is below 1e-15 at about 1 Oe, while the linear effect with circular polarization can reach 1e-12 in an unshielded cell; compare barbarat2019a (linear Zeeman shift about 1 kHz/G on R(34)44-0 at 514 nm, tripled 1542 nm laser). Inconsistency: the separate g_J' and g_J'' are both printed -0.44 +/- 0.04, yet Delta g_J = -0.36 +/- 0.02, and g_I' - g_I'' = 0.32 differs from Delta g_I = 0.48 +/- 0.08; the paper says the differences come from the extreme magnetic components and are the more precise, so the individual values should not be combined (inferred). Upper-level g-factors are said to agree with Broyer, Lehmann, Vigue, J. Phys. 36, 235 (1975) (Hanle effect, not in the catalog). Same line and group as goncharov1990 (relaxation study). Nothing feeds the zero-field model; transcribe only if field-dependent modeling is ever needed, as the 6 g_F values, the 2 differences and Delta k."

- id: shotton1972
  citation: "K. C. Shotton and G. D. Chapman, \"Lifetimes of 127I2 molecules excited by the 632.8 nm He/Ne laser\", J. Chem. Phys. 56, 1012-1013 (1972)"
  doi: "10.1063/1.1677205"
  url: "https://doi.org/10.1063/1.1677205"
  year: 1972
  group: "Division of Physics, National Research Council of Canada, Ottawa (K. C. Shotton, G. D. Chapman)"
  isotopologues: ["127I2"]
  system: "B"
  technique: "Time-correlated single-photon counting of fluorescence after 50 ns (FWHM) cavity-dumped 632.8 nm He-Ne pulses; grating spectrometer isolating one band (6-5 at 650.0 nm, 11-3 at 617.0 nm); exponential fit from 300 ns after the pulse peak; Stern-Volmer extrapolation over 12 pressures"
  observable: "lifetimes"
  range_nm: [632.8, 632.8]
  range_cm1: [15798, 15798]
  transitions: "B v'=6 J'=32 (excited via P(33)6-3) and B v'=11 J'=128 (via R(127)11-5), the two He-Ne-coincident lines"
  n_items: 4
  uncertainty: "v'=6: tau0 = 310 +/- 10 nsec, sigma^2 = 0.64 +/- 0.03 nm2 (0.025-0.280 torr); v'=11: tau0 = 410 +/- 15 nsec, sigma^2 = 0.65 +/- 0.05 nm2 (0.018-0.180 torr); 'The quoted uncertainties are one standard deviation.'"
  uncertainty_MHz: null
  absolute: true
  hyperfine_resolved: false
  data_availability: "text (2 zero-pressure lifetimes, 2 self-quenching collision radii squared); Fig. 1 one decay curve"
  machine_readable: false
  likely_in_knockel2004: false
  priority: high
  verified: true
  status: "held"
  transcription: null
  notes: "Read in full (letter, 2 pages). Single rotational-level lifetimes: high-resolution fluorescence showed no rotational relaxation, so the values belong to J'=32 (v'=6) and J'=128 (v'=11). These are the source of the two He-Ne-level lifetimes and the 64 A^2 self-quenching radius used in chapman1972 (same group; its Table I quotes 0.310 +/- 0.010 and 0.410 +/- 0.015 us), which in turn derived the other nine lifetimes from Degenkolb's data; the numbers agree exactly. Natural widths 1/(2 pi tau0) = 0.51 MHz (v'=6) and 0.39 MHz (v'=11) (inferred), relevant to the 633 nm standard lines. Cross-check (inferred): broyer1975b gives Gamma_rad = 1.09e6 s-1 and k11 = 67 s-1 for v'=11, so 1/tau = 1.09e6 + 67 x 128 x 129 = 2.20e6 s-1, tau about 0.45 us, against 0.410(15) us here (about 2.7 sigma); vigue1975 also studied v'=11 J'=128. The paper notes its lifetimes are much shorter than the broadband-dye-laser values of sakurai1971 (a mixture of levels), and a private communication from Capelle that later work (capelle1973) also found a shorter v'=6 lifetime. Worth transcribing: the two lifetimes (with J') and two self-quenching radii into the lifetime set beside broyer1975b, as single-level inputs to the natural and collisional linewidths of P(33)6-3 and R(127)11-5."

