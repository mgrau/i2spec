  isotopologues: ["127I2"]
  system: "B (predissociation)"
  technique: "Two-photon (folded three-level) resonant scattering, backward-scattered geometry: stabilized Ar+ 514.5 nm pump on 43-0 P(13)/R(15) hyperfine components, dye-laser probe on 43-11 P(13)/R(15) near 582.8 nm locked through an evacuated transfer cavity; 150 cm cell, 5 passes, 0.4-7 mTorr"
  observable: "lifetimes"
  range_nm: [514.67, 583.00]
  range_cm1: [17152.7, 19429.9]
  transitions: "Hyperfine sublevels of B v' = 43, J' = 12 (via 43-0 P(13) and 43-11 P(13); lines a1-a7) and J' = 16 (via 43-0 R(15) and 43-11 R(15); lines b1-b7); Table 2 gives calculated natural widths of all 42 components a1-a21, b1-b21 of 43-0 P(13) and R(15)"
  n_items: 17
  uncertainty: "|a_v|^2 = 3.36 +/- 0.09 kHz, |c_v|^2 = 4.67 +/- 0.51 Hz (1 sigma), a_v c_v < 0; radiative width Gamma_r = 51 +/- 4 kHz; individual linewidths 1-3 kHz; fit standard deviation 3.1 kHz; calculated Gamma_p uncertainty +/- 5 %"
  uncertainty_MHz: 0.003
  absolute: true
  hyperfine_resolved: true
  data_availability: "Table 1 (14 measured backward-scattered linewidths at 2.1 mTorr with fitted values); text (3 constants; b2 corrected width 56 +/- 4 kHz); Table 2 (42 calculated Gamma_p and Gamma_nat with epsilon', J', F')"
  machine_readable: false
