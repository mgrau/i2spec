  notes: "Read the Metrologia article 2026-10-28 (the earlier note was based on Rapport BIPM-89/5). The shift vs K0 relation is nonlinear; extrapolating to zero shift gives K0 = 0.8 Pa for an uncontaminated cell (the reference point used by lazar2007a/2009a). Shift is proportional to sigma_x p_x v_x for low contamination; with N2 as the only impurity a good cell (K0 = 1 Pa) implies p_x ~ 1 Pa and a bad one (K0 = 6 Pa) 32 Pa. Method valid for shifts below about 60 kHz; data above 12.5 Pa dropped for K0 < 2 Pa cells. Uses the Gillespie-Fraser formula log p(atm) = -3512.830/T - 2.013 log T + 13.374 and tau = 14 us for the excited level. Shifts are printed without sign; chartier1992 gives the same cells as negative. hyperfine_resolved changed to true because the shifts are hyperfine-locked beat measurements. Cell-quality data only; nothing entered in data/."
