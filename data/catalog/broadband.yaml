  status: "held"
  transcription: null
  notes: "Read in full. Hyperfine-resolved natural widths of the upper level of the 514.5 nm standard lines: the differences between hyperfine linewidths at 2.1 mTorr (pressure-independent up to about 2 mTorr) are fitted with Gamma_p = sum |alpha|^2 gamma_IJF (hyperfine Hamiltonian with eqQ and spin-rotation only) to give the hyperfine and gyroscopic predissociation constants of v' = 43; Gamma_r from the zero-pressure extrapolation of b2. Agrees with a molecular-beam time-domain result of Churassy (private communication: |a|^2 = 3.21 +/- 0.25 kHz, |c|^2 = 5.45 +/- 1.23 Hz, Gamma_r = 50 +/- 3 kHz) and with Gamma_r = 56 +/- 8 kHz of Ezekiel & Weiss 1968; smaller than the Borde, Camy & Decomps 1979 estimates (5.9 kHz, 5.6 Hz) and larger than |a|^2 = 2 +/- 1 kHz of vigue1981c. A footnote compares total decay rates 50 kHz, 69.8 +/- 2.4 kHz (paisner1974) and 74.7 +/- 5.3 kHz (Sakurai et al. 1976). Calculated natural widths (Table 2) range 56-112 kHz (component a3, the CIPM reference component of P(13), 107 kHz). Table 1 b1 calculated width is 316 kHz (residual +4 against measured 320); an earlier reading of 216 was a text-layer error, not a misprint. Worth transcribing: the three constants (|a_43|^2, |c_43|^2, Gamma_r) and Table 1 (14 widths) as a direct test of the model's hyperfine-dependent natural widths; Table 2 is derived and need not be transcribed. Companion: hackel1979 (same lab, technique)."
