  transcription: null
  notes: "Read in full (two-page short note, scanned; values read from the page images). The paper measures broadening only, not pressure shifts. Widths are fitted to W = (1/pi)(1/(2 tau0) + kappa P) sqrt(1 + s/(1/(2 tau0) + kappa P)^2); the printed coefficients are labeled 'kappa s' in the text, but the units (kHz/Pa, MHz/Torr) show they are the pressure-broadening coefficients kappa (inferred). The h, i, j widths are ordered h > i > j at every pressure, with adjacent differences about constant at 500 kHz, a finding the authors leave open (hyperfine-dependent or technical). Stated to agree with NPL, NRC and LHA results. The widths include the intracavity saturation and the laser's own noise broadening (about 500 kHz), so they are laser-specific. Compare titov1997b and hu1997a in the precision catalog for later 633 nm line-shape work. Not worth transcribing beyond the three coefficients as context."
