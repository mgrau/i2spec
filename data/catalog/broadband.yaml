  notes: "Rules: I.1 nu_corr = nu_atlas; I.2–4 nu_corr = nu_atlas − 2.5e-3 cm⁻¹; II, III nu_corr = nu_atlas(1 + 1.7e-7) − 8.1e-3 cm⁻¹. Table 3 adds odd-J″ shifts between the line maximum and the pure rovibronic frequency of −6.3 to −8.2e-4 cm⁻¹ (even J″: zero), plus cell temperatures and instrument widths per atlas part. My arithmetic: the II/III rule gives −5.7e-3 cm⁻¹ at 14 000 cm⁻¹, −5.2e-3 at 17 000 and −4.7e-3 at 20 000, bracketing the original −5.6e-3 cm⁻¹. These rules are the current best recipe for putting atlas lines on the absolute scale."
