  transcription: null
  notes: "Read in full (2-page communication). First identification of hyperfine predissociation: the apparent radiative rate of broyer1975b follows the v dependence of k_v, so it contains a hyperfine term; Gamma_v,J,F = Gamma_rad + k_v J(J+1) + Gamma_hf + Gamma_int, with Gamma_int = -2 a_v c_v I.J. Predicts and observes (i) a strong ortho/para alternation of the averaged decay rate and (ii) non-exponential decays increasing with J. Gamma_rad,7 agrees with Tellinghuisen's prediction and k_7 with broyer1975b. Extended by vigue1977 (hyperfine-resolved fluorescence yields) and vigue1981a-c (full theory and v-dependence). Worth transcribing the three v' = 7 constants as part of a predissociation set alongside broyer1975b; Fig. 2 could be digitized (14 points) if per-level rates are needed."
