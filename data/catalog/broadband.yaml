  transcription: "not needed: theory of Lambda-doubling and magnetic mixing, no numbers"
  notes: "Read in full (25 pages; most of the paper is general Lambda-doubling theory for 3Pi0 states, with side discussions of ICl, Br2 and other halogens). Gives the theoretical basis for Turner's proposal that magnetic quenching of the I2 B-X fluorescence is a predissociation: a magnetic field has Delta J = +/-1 matrix elements between the 0u+ (B) and 0u- components of 3Pi0u, which rotation (Kronig predissociation) and a uniform electric field cannot couple; collision-induced quenching is attributed to the strong inhomogeneous fields of the collision partner. Predicts quenching independent of J' and a field dependence b H^2/(a + b H^2). Quotes Turner's observations: no effect for excitation below 17 300 cm-1, maximum (almost 50% at 12 500 gauss) near 18 500 cm-1. Historical foundation of magnetic predissociation (followed experimentally by Degenkolb et al. 1969, chapman1972, vigue1975, broyer1976). No numbers to transcribe; not worth transcribing."

