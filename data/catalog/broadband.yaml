  transcription: null
  notes: "Read in full. First determination of the saturation parameter in a He-Ne/I2 standard; shows that the Lorentzian approximation underestimates the homogeneous width at high intracavity power (spread 530 kHz versus 4.8 kHz with the Gaussian-beam line shape). The zero-pressure intercept 784 kHz FWHM is attributed to radiative decay (transit time negligible), but it is far above the natural width implied by the B v' = 11 lifetime (about 0.15-0.4 MHz from broyer1975b); it likely contains residual broadening (inferred). HWHM below 1 MHz observed at 4.86 Pa. Cited by phillips2008 as the self-broadening reference for the 633 nm line. Overlaps schweitzer1973a (129I2, 13 MHz/Torr = 98 kHz/Pa) and cerez1974 (127I2 R(127) 11-5). Worth transcribing the self-broadening coefficient (126.5 kHz/Pa FWHM, +/- 10 %) and the zero-pressure intercept for the 633 nm line as line-shape systematics; the saturation-parameter results are laser-specific."

- id: goncharov1991
  citation: "A. N. Goncharov, S. V. Gateva-Kosteva, M. N. Skvortsov, V. P. Chebotayev, Direct observation of the anomalous Zeeman effect at the X -> B transition of molecular iodine by the method of nonlinear laser spectroscopy, Appl. Phys. B 52, 311-314 (1991)"
