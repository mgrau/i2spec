  transcription: "not needed: no line list published and the spectra are not public"
  notes: "Setup: max OPD L = 136 cm, no apodization (resolution element 1/(2L) ≈ 0.0037 cm⁻¹ ≈ 110 MHz, my arithmetic); Thorlabs GC19100-I cell with model temperature 44 °C; 19 spectra of ten scans each on 25 May 2023; 1 GHz LaserQuantum comb. Key result: compared with the comb-calibrated FTS, the Knöckel (2004) model shows a long-period wave of about 2 m s⁻¹ amplitude (≈ 3.6 MHz at 540 THz, my conversion) plus an oscillation that follows the band structure. The authors attribute this to the model's energy scale (potentials and hyperfine), not to intensities, and suggest the data be used to improve the model. This is the first direct post-2004 test of the Hannover model across the green to orange at the MHz level. The acknowledgements note that H. Knöckel died in July 2024. Request the spectra from the authors."
