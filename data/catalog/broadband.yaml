  notes: "Read in full. First measurement of the strong v' dependence of the B lifetime: tau0 rises from 6.8e-7 s (v' 10-14) and 11.9e-7 s (v' 14-16) to 24e-7 s (v' 41-44) and 42-53e-7 s (v' 47-54), and falls to 17.5e-7 s near v' = 100 (v' assignment there only an estimate); self-quenching sigma^2 is nearly constant (60-79 A^2). Uses the modern v' numbering. Concludes that either the transition moment varies with R or spontaneous predissociation competes with radiation (the latter confirmed by chutjian1969, tellinghuisen1972 and broyer1975). Halves the brewer1963 quenching cross section (63 vs 128 A^2) and corrects Brown and Klemperer's (1964) cross sections and A values (decimal-point error). Inconsistency: the Cd-blue lifetime was later remeasured by P. T. Cunningham (UCRL-18419, 1968) as a total rate of 6.58e5 s-1 (tau = 15e-7 s), about 3.5 times shorter than 53.2e-7 s here (quoted in chutjian1969, footnote 12). Values are averages over several (v', J') levels, so they are superseded for a natural-linewidth model by single-level laser lifetimes (capelle1973, paisner1974, broyer1975). Worth transcribing only as a low-weight cross-check: Table II (11 tau0 and 11 sigma^2) with the stated level populations; the three atomic-line rows (Hg, Na D, Cd) are the closest to single-level values."

