  citation: "G. T. Phillips and G. P. Perram, \"Pressure broadening by argon in the hyperfine resolved P(10) and P(70) (17,1) transitions of I2 X1Sigma(0g+) -> B3Pi(0u+) using sub-Doppler laser saturation spectroscopy\", J. Quant. Spectrosc. Radiat. Transfer 109, 1875-1885 (2008)"
