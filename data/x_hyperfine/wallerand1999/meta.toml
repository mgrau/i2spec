v, J: the X level (v'' = 0; J'' = 13 or 15). eps, F_from, F_to: the printed transition (eps, F_from -> eps, F_to).
value_kHz: the printed measured frequency, E(eps, F_from) - E(eps, F_to) (see transcription, Sign).
uncertainty_kHz: printed standard uncertainty (Hz) / 1000. table: 2(a) or 2(b). note: printed row.
"""
constants = """
v, J: the X level. quantity: eqQ, C, d or delta (the paper's four-term Hamiltonian, not printed in the paper).
value, uncertainty, unit: as printed (uncertainty printed as m x 10^-n). table: 3(a) or 3(b). note: printed row.
"""
