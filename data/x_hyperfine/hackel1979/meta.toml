tables = "p. 1737 (the eqQ'' and C'' paragraph)"
source = "publisher PDF, image-only scan"
scan = "image-only scan (text layer drops the minus sign of eqQ''); read from a 400 dpi render of p. 1737"
retrieved = "2026-10-28"
unit = "eqQ in MHz; C in kHz"
isotopologue = "127I2"
state = "X"
files = ["constants.csv"]
exclude = "pending: held out of every fit, benchmark and the explorer until it is scored in a blind test"

transcription = """
p. 1737, left column, the paragraph after Fig. 1(c): "a preliminary measurement of the complete hyperfine structure of the
v'' = 11 level ... The data were fitted ... with a standard deviation of 690 kHz, resulting in values for the nuclear
electric quadrupole (eQq'' = -2455.6 +- 1.3 MHz) and spin rotation (C'' = 7.9 +- 1.0 kHz) coupling constants." Both
values read from the page image (the minus sign of eQq'' is printed as a dash and the text layer drops it).

Layout. constants.csv in the wallerand1999 layout (one row per quantity), chosen over the one-row-per-level layout of
koffend1978 and bacis1980 because the paper's two constants have different units (MHz and kHz) and separate
uncertainties, which the quantity layout records without a units rule. v = 11; J = 15, inferred: the probe transition
is 43-11 R(15) (Fig. 1) and the lower level of that line is X v'' = 11, J'' = 15; the letter does not print J''
for the fitted level.

Not entered: the hyperfine line shape and two-step linewidths (80 kHz observed; 16.5 kHz predicted; 141 kHz single-step
natural width), the pressure broadening of the two-step line (22 kHz/mTorr), the single-step estimate 12 kHz/mTorr from
Carny et al., the pump transition matrix element (0.057 +- 0.008 D from the ac Stark splitting, eq. 2), and the ac
Stark data of Fig. 3. These are in notes only, below.
"""

uncertainty = """
As printed (+-, 1 sigma assumed; the letter does not state the convention). The fit standard deviation of 690 kHz is far
larger than the printed uncertainties of the two constants (the fit is to a preliminary set of separations), so the
quoted +-1.3 MHz is probably optimistic; this is an inference from the 690 kHz standard deviation, not a printed statement.
"""

notes = """
The letter's X v'' = 11 constants are described as preliminary and "consistent with measurements utilizing an optically pumped
I2 laser" (Koffend et al., Phys. Rev. Lett. 41, 1040, 1978, ref. 14), i.e. the same v'' = 11 constants that bacis1980 and
koffend1978 use. Not independent of those. The two-step linewidth (80 kHz) and the pressure broadening (22 kHz/mTorr,
two-step; 12 kHz/mTorr single-step estimate from Carny et al. 1977) are line-shape cross-checks at 514.5 nm; the pump
matrix element 0.057 +- 0.008 D (43-0 R(15), from the ac Stark splitting of the probe, the Omega_s/Omega_p dependence of
eq. 2 checked to 8 % at v'' = 10 and 12) is an intensity cross-check. None of those are entered as data.
"""

[overlaps]
bacis1980 = { relation = "same", v = [11] }   # the same v'' = 11 constants (above)
