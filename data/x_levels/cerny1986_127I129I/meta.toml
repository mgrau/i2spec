What else the paper holds (not transcribed): Table I, spectral ranges and resolution of the 5 recordings per
isotopologue; Tables IIa/IIb, number of lines per (v', v''); Tables IVa/IVb, B-state G, B, D, H, L for the
excited v' (first row fitted, second from isotope relations of Gerstenkorn and Luc's 127I2 B constants,
Te = 15 769.078 cm-1, Appendix III); Tables Va/Vb, effective polynomial expansions in (v''+1/2) of G, B, D,
H, L for each isotopologue (127I129I: 0-87 and 83-109; 129I2: up to 88 and above; no SDs, "effective
constants"); Tables VIa/VIb, RKR turning points and G for every v'' of each isotopologue; Table VII,
experiment vs isotope relation at v'' = 5, 10, 15, 19 (agree within 2 SD); Table VIII, dG/dv at v'' = 1-85
compared with the 127I2 value at the mass-scaled v (agree to < 1 mK); Figs. 6-8, differences of G, B, D from
isotope-scaled 127I2 and B_v/rho^2 vs reduced v; Tables IX-X, recalculated lines near 514.5, 612 and 633 nm
compared with hyperfine-resolved absolute measurements; Appendices Ia/Ib, per-group results for the
reference levels; II, Luc-Gerstenkorn 127I2 X polynomials (v'' = 0-19); III, B-state polynomials; IV, the
Dunham origin (Y00, Te) bookkeeping. There is no Born-Oppenheimer-breakdown fit: the authors state that the
correction to the first-order isotope relation is of order m_e/M ~ 4e-6 (~1 mK in Y10, ~1 SD) and that
only precise low-v'' data of several isotopes could determine it (p. 470-473). Long-range analysis of the
three isotopes is in paper III (Bacis, Cerny and Martin 1986).

Comparison with i2spec (RovibronicModel("127I129I"), E(v,J) - E(0,0), minus Cerny's term less
G_i(0) = 106.69457; 2026-09-30). The X grid holds v'' = 0-69; v'' = 70-110 (40 rows) have no model level.
  v''= 5-8     J=0: -0.006 to +0.003 (G +-0.004-0.040)
