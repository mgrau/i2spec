  v''=40         +0.004 (J=0), G +-0.028
  v''=41-58    J=0 and 50: -0.002 to -0.012, slowly growing; J=100 -0.019 to +0.007
  v''=59-65    -0.015 to -0.034 (all J)
  v''=66       -0.022 / -0.039 / -0.086
  v''=67-69    -0.006, +0.030, +0.095 (J=0); +0.04, +0.10, +0.20 (J=100)
At equal energy the same pattern is in the 127I2 comparison with Martin et al. (MLR X shape error above
v'' ~ 55); minor-isotopologue minus 127I2 residual at equal G is -0.002 to -0.004 cm-1 at J=0 over
v'' = 41-69, which is within the stated origin error. The model's X has no Born-Oppenheimer correction
terms (alpha and V_ad are empty for X; only B has them), so its 127I129I levels are pure mass scaling of the
