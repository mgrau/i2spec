transcription = """
Table IIIa, "Parameters of the 127I129I X0⁺g State (in cm-1)", printed pp. 468-470 (PDF pages 11-13).
The companion table for 129I2 (Table IIIb, pp. 471-473) is in data/x_levels/cerny1986_129I2/: the paper
prints the two isotopologues as separate tables with their own origins, fit groups and footnotes, so they
are kept as two datasets with the same columns. The PDF is a scan and its OCR layer is wrong in many
digits; every value was read from 300 dpi renders with zoomed crops (up to 8x on damaged glyphs).

One row per printed level: 99 levels, v'' = 5-31, 38-96, 98-110. Not in the table: v'' = 0-4 and 32-37
(no or almost no fluorescence recorded, Sect. III and Fig. 2a) and v'' = 97.

The values are per-level constants from fits of B -> X LIF Fourier-transform lines (0.5-1.33 um; Ar+
514.5 and 501.7 nm excitation, Fig. 1, Table I), fitted in five overlapping groups (Fig. 3a, Appendix Ia)
that share the reference levels v'' = 7 and 72; for those two levels the row is the average of the five
group results (footnote b). Constants printed without an uncertainty were computed from the RKR curve with
Hutson's program and held fixed (third iteration, Sect. III). Values flagged * were extrapolated
logarithmically from the lower levels (footnote *).

ENERGY ORIGIN. G is G(v'', J''=0) measured from the potential minimum, i.e. G(v'' = -1/2) = 0 with no
Y00 (Appendix II, Appendix IV). It is fixed by G(7, 0) = 1568.1707 cm-1 (footnote a), computed from the
isotope relation G_i(v) = sum_{k=1..7} rho^k Y_k0 (v+1/2)^k with rho = 0.9961126 and Luc and
Gerstenkorn's 127I2 Y_k0 (v'' = 0-19, Appendix II: 214.526755, -0.611938186, -0.235606136e-3,
-0.140816912e-3, 0.943318488e-5, -0.344433981e-6, 0.490779344e-8). This reproduces 1568.17072. To get
energies above X(0,0) subtract G_i(0) = 106.69457 cm-1 from the same relation (the table has no v'' = 0).
The authors estimate the error of this common origin at < 2 SD, < 0.004 cm-1 at low v'' (Sect. IV); a
free constant C'' in their Dunham fit to these G came out -0.0026 cm-1 (Appendix IV).

UNCERTAINTIES are TWO standard deviations, and the footnote defines them in an unusual way: "The number in
parenthesis is the uncertainty in the last digits typed in upright characters ... The digits given in
italic characters correspond to a much higher precision than the standard deviation, but due to
correlation effects they are needed in order to recalculate the measured lines." Most B and D values end in
one or more italic digits, so the parenthesised number applies to the digit BEFORE them: 0.3644779 (174)
with the 9 italic is 0.364477(174), +-0.000174 in B x 10, not +-0.0000174. Table VII (p. 482) prints the
same numbers rounded to the upright digits (v''=5: 0.364478 (174), 0.430 (178)), which confirms this
reading, and so do the residuals against i2spec (v''=31: G off by 0.12 cm-1 with G = 6083.67|38 (29), i.e.
+-0.29). The *_unc columns hold the converted value; the italic column records how many trailing digits of
each value were read as italic, so the printed parenthesis can be recovered. Where a parenthesis is printed
with its own decimal point it is taken as absolute in the column's units.

Columns (values are the printed digits; the printed column scale changes between table blocks, so the
exponent is carried in its own column):
  v                v''
  G                G(v'', 0) in cm-1 above the potential minimum (see ENERGY ORIGIN)
  G_unc            2 SD, cm-1 (empty for v''=7, the origin)
  B_x10            B x 10 in cm-1 (header "B x 10"): B = B_x10 / 10
  B_x10_unc        2 SD in the same scale
  D_s, D_s_unc     D x 10^D_exp in cm-1, as printed: D = D_s * 10^-D_exp  (D_exp = 8 for v'' <= 76, 7 above)
  negH_s, _unc     -H x 10^H_exp: H = -negH_s * 10^-H_exp  (H_exp = 15 for v'' <= 43, 14 for 44-76, 13 above)
  negL_s           -L x 10^L_exp: L = -negL_s * 10^-L_exp  (19 for v'' <= 76, 17 above; empty = not printed)
  negM_s           -M x 10^M_exp: M = -negM_s * 10^-M_exp  (23; printed for v'' = 65-87 only)
  italic           trailing italic digits, e.g. "B1 D2" (G, B, D, H); none listed = all upright
  flags            origin (v''=7); D*, H*, L* (extrapolated value, printed with *); G3dp (G printed with three
                   decimals only); glyph:X (a damaged glyph, see notes); italic?:X (italic count uncertain)
  page             printed journal page

Term values E(v, J) = G + B x - D x^2 + H x^3 + L x^4 + M x^5, x = J(J+1), as in paper I (Martin et al.
1986, data/x_levels/martin1986/). No uncertainty is printed for L or M (always fixed); H was floated only
at v'' = 80 and 83.

Reading notes. v''=11 D: third decimal is a broken glyph, read as 8 (0.4283; OCR gives 0.4233). v''=84 G is
printed 12117.966 (17), three decimals, so by the footnote +-0.017; probably a dropped fourth digit (its
neighbours are +-0.0016-0.0020) but kept as printed. v''=40 G 7550.9218: only the 8 is clearly italic.
v''=63 B: the italic of the last digit is faint. Italic counts of 2-3 digits (v'' >= 85, D) were checked at
4.5x zoom; v''=89, 91, 93, 94, 95 D have three italic digits (0.51|288 (11) = 0.51 +- 0.11). v''=88 B
0.1677432 (120) is all upright, so +-0.0000120, an order below its neighbours; v''=106-108 B are all
upright too. v''=86 L 0.1603 breaks the trend (85: 0.2034, 87: 0.4903) as printed.
"""

