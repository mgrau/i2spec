transcription = """
Table I, "Parameters of the XO⁺g vibrational levels v'' where no perturbation was observed", printed
pp. 76-78 (PDF pages 6-8). The PDF is a scan; its OCR text layer is wrong in many digits (e.g. it gives
3453.2072, 3644.4053 and 4761.0282 where the scan reads 3453.2872, 3644.4853 and 4761.8282), so every
value was read from 300 dpi renders, row by row, with zoomed crops. One row per level: 93 levels,
v'' = 8-89 and 91, 92, 94, 95, 96, 99, 100, 104, 105, 107, 108. The missing v'' (90, 93, 97, 98,
101-103, 106) are perturbed and not in the table (footnote a: see Martin et al., JCP 79, 3725 (1983)).

The values are per-level constants from fits to 14 820 unblended, unperturbed B -> X fluorescence lines
(LIF Fourier-transform, 0.5-1.35 um; Ar+ 514.5 and 501.7 nm, Kr+ 520.8 and 530.8 nm excitation).
v'' = 8-85 were fitted in 10 blocks, each level above 85 separately. Constants not floated (H, L, M in
most rows, the ones printed without an uncertainty) were fixed to values computed from the RKR curve by
Hutson's program and iterated to self-consistency. J'' coverage (Fig. 2, p. 75): roughly 0-150 for
v'' <= 85 (with gaps), about 0-60 for v'' = 86-96, about 0-40 above v'' = 99.

Columns, all exactly as printed (the scale factors are the column headers of Table I):
  v                 v''
  G                 G(v'', J''=0) in cm-1, relative to X(v''=0, J''=0) = 0 (footnote c: the origin is
                    G(9, 0) = 1874.8283 cm-1 fixed to Luc's value, which is why v''=9 has no uncertainty).
                    Add 107.098 cm-1 (Table IX note: -C + Y00 = 107.1082 - 0.0100) for energies above the
                    potential minimum.
  B_x10             B x 10 in cm-1 (header "B x 10^1 (cm-1)"): B = B_x10 / 10.
  D_x1e8            D x 10^8 in cm-1: D = D_x1e8 * 1e-8.
  negH_x1e14        -H x 10^14 in cm-1: H = -negH_x1e14 * 1e-14.
  negL_x1e20        -L x 10^20 in cm-1: L = -negL_x1e20 * 1e-20.
  negM_x1e23        -M x 10^23 in cm-1 (printed for v'' = 79-86 only): M = -negM_x1e23 * 1e-23.
  *_unc             the parenthesised uncertainty, TWO standard deviations (footnote b), converted from
                    last-digit units to the column's own printed scale (e.g. B_x10 0.3637630 (60) ->
                    0.0000060; D_x1e8 18.1 (1.3) -> 1.3; negL 108. (45) -> 45). Empty = none printed
                    (parameter fixed, or G(9) the origin).
  page              printed page of the journal.

Term values are E(v, J) = G + B x - D x^2 + H x^3 + L x^4 + M x^5 with x = J(J+1). The paper does not
print the expression; this is Hutson's convention used throughout, and it reproduces i2spec's X levels
to a few 1e-3 cm-1 at J up to 150 for v'' <= 59, so the signs are right.

Reading notes. v''=107 D is printed "33.1 (1.0)" and v''=108 D "19.0 (2.0)"; in both the first digit sits
against the column rule, and 33.1 breaks the trend (104: 18.33, 105: 18.1), but the glyph is a 3 at
4x zoom. v''=16 D = 0.5091 is as printed although it is out of line with 15 (0.5019) and 17 (0.5114);
v''=24 G = 4761.8282 is as printed although it sits ~0.009 cm-1 above the model while its neighbours
agree to 0.001-0.002 (see notes).
"""

notes = """
What else the paper holds (not transcribed here): Table II, Dunham-type polynomials Y(i,0), Y(i,1) for
G and B over 0 <= v'' <= 89 (15 terms) and 85 <= v'' <= 108 (11/13 terms, in v''-80+1/2), which is what
IodineSpec5 evaluates above v''=17; Table III, log-polynomials for D, H, L, M; Table IV, RKR turning
points v'' = 0-108 (derived); Tables Va/b, Franck-Condon factors; Table VI, calculated B->X coincidences
with the I 2P1/2-2P3/2 hyperfine lines; Tables VII-VIII, C6/C8 fits to the outer RKR points
(De = 12440.086 cm-1 above X(0,0), final C6 = 1.40(10)e6 A^6 cm-1, C8 = 3.8(7)e7, C10 = 2.5e8 fixed);
Table IX, Hutson-program G, B, D for v'' = 100-113 above the minimum (extrapolated, not measured);
Appendix 1, number of lines per (v', v''). Stated precision of lines recomputed from these constants
(Sect. V): 8 <= v'' <= 85, 0.005 cm-1 (J'' <= 80), 0.01 (80-100), 0.02 (100-120), 0.15 (120-150);
85-90, 0.005 (J < 40), 0.010 (40-60). Line positions are the Doppler-profile maximum, not the centre
of gravity; the authors estimate that biases G by < +1e-3 cm-1 and neglect it.

Comparison with i2spec (RovibronicModel(), E(v,J) - E(0,0), 2026-09-29): model - Martin is +0.001 cm-1
at v''=8-17 (mostly the origin: Luc's G(9) is ~0.0012 below the comb-referenced model), -0.001 to
-0.005 cm-1 at v''=18-52 for J <= 120 except v''=24 (-0.009 to -0.013, a Martin G outlier), then the MLR
X departs: -0.003 to -0.03 at 53-65, +0.12 at 69, +2.1 at 75, +9 at 80, +26 at 85, +46 at 89, about
+70 cm-1 at 94-96.
"""
