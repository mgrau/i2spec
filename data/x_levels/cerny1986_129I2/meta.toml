transcription = """
Table IIIb, "Parameters of the 129I2 X0⁺g State (in cm-1)", printed pp. 471-473 (PDF pages 14-16). The
127I129I table (IIIa) is in data/x_levels/cerny1986_127I129I/, with the same columns; its meta.toml carries
the full description of the columns and of the italic-digit convention, which applies here unchanged.
Values read from 300 dpi renders with zoomed crops; the OCR layer is not used.

One row per printed level: 103 levels, v'' = 4-96, 98-104, 106-108. Not in the table: v'' = 0-3 (no
fluorescence recorded), 97 and 105. v''=103 is perturbed and its constants are effective (footnote c).

Per-level constants from B -> X LIF Fourier-transform lines (0.54-1.3 um; Kr+ 520.8 and Ar+ 501.7 nm
excitation), fitted in eight groups (Fig. 3b, Appendix Ib: v'' = 4-17, 15-27, 27-39, 39-51, 51-63, 63-76,
76-88, 89-108) sharing the reference levels v'' = 6 and 73, whose rows are the average of the eight group
results (footnote b). Constants without an uncertainty were fixed to Hutson-program values from the RKR
curve; * marks logarithmic extrapolations.

ENERGY ORIGIN. G(v'', 0) above the potential minimum (G(-1/2) = 0, no Y00), fixed by G(6, 0) =
1357.8841 cm-1 from the isotope relation with rho = 0.992210 and Luc and Gerstenkorn's 127I2 Y_k0 (Appendix
II; the relation gives 1357.88412). Energies above X(0,0): subtract G_i(0) = 106.27715 cm-1 from the same
relation. Stated origin error < 2 SD (< 0.004 cm-1); the free constant C'' of the authors' Dunham fit came
out -0.0029 cm-1 (Appendix IV).

UNCERTAINTIES: two SD, applying to the last UPRIGHT digit; trailing italic digits are beyond the SD (see
the 127I129I meta.toml). Table VII (p. 482) prints v''=5, 10, 15, 19 rounded to the upright digits
(e.g. 0.349800 (90), 0.4851 (26) at v''=15), confirming the reading. Parentheses printed with a decimal
point (D at v''=102, 104, 106, 107; H at v''=92) are absolute, in the column's units.

Columns: as in cerny1986_127I129I. Printed scales: D_exp = 8 for v'' <= 71, 7 above; H_exp = 15 for
v'' <= 37, 14 for 38-71, 13 above; L_exp = 20 for v'' <= 37, 19 for 38-71, 17 above; M_exp = 25 for
v'' = 51-71, 23 for 72-88. H was floated at v'' = 54, 56-88 and 92.

Reading notes. v''=47 G is printed 9564.6417; it must be 8564.6417 (between 8422.10 and 8705.17; with 8 the
level agrees with the model to 0.006 cm-1 like its neighbours). Kept as printed, flagged Gmisprint.
v''=21 G is printed with three decimals, 4285.525 (25), so +-0.025 as printed. v''=13 B 0.3522602 looks all
upright, which would make its SD ten times smaller than every neighbour's; italic count set to 1 (flag
italic?:B). v''=13 D last digit, 31 D third decimal (9), 72 H (the 5 in 0.35054), 74 H (4), 80 H
(2), 106 D (5) and 107 D (last digit 2) are damaged glyphs read at 6-8x. v''=30, 31 D italic counts
uncertain; set to 1 like their neighbours. v''=92 H = -38.1 (20.2) e-13 and D = 0.36052 (130) (all upright)
break the trend, as printed. v''=50 is out of line in G, B and D (the model differs by -0.09 cm-1 and 2e-5
in B) and v''=48 by -0.023; both were re-read and are as printed.
"""

