data = """
table: I-V. series: I, II, III, IVa, IVb. J_upper: J' of the series' upper level. v: v'' as printed (Table V: the
  parenthesized value). v_status: empty, or "tentative" for Table V.
R_J, R, R_mark: J'' (= J' - 1) and vacuum wavenumber (cm-1) of the R line, and its mark. P_J, P, P_mark: the same for the
  P line (J'' = J' + 1). Marks: exciting (the I 1830.4 A line), masked (Table II v'' = 2), blend_II_III, blend_IVa_IVb,
  RP_unresolved (Table V single value).
dnu_obs: printed R - P (cm-1). dnu_calc: printed Delta nu_calc of Tables I-III (cm-1). dE_next: Table V interval to the
  next member (cm-1).
lower_state: X, or the Verma and Le Roy 1974 reassignment (NO) for Table V.
shared_with: other printed lines with the identical wavenumber (series, branch, v'').
note: misprints and reading notes.
"""
delta_g = "v: v''. dG: Delta G(v + 1/2) = G(v + 1) - G(v), cm-1, as printed. basis: how the author obtained it. note: reading notes."
