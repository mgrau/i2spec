transcription = """
Table II, "Rotation-vibration constants for the near-dissociation levels of 127I2 X 0g+", printed p. 3728
(PDF page 5, landscape). Every value was read from a 300 dpi render; the PDF's OCR text layer has wrong
glyphs (e.g. "0.S22", "12413,9693", "O. 006163"). One row per printed row: v'' = 90-109, with two rows for
v'' = 90 (deperturbed from 1g v=5, sampled from B v'=58 only; and the fit of B v'=61, 67, 68 lines, which
is biased by 1g v=4 near J=35).

Columns, as printed:
  v                  v''
  T                  T(v'', J''=0) in cm-1 relative to X(v''=0, J''=0) = 0
  B                  B in cm-1
  D_x1e7             D x 10^7 in cm-1
  H_x1e12            H x 10^12 in cm-1
  *_unc              the parenthesized uncertainty, TWO standard deviations (table footnote), converted from
                     last-digit units to the column's printed scale. Empty = held fixed in the fit (footnote a:
                     T of v''=90 first row and v''=93, D of v''=109, H printed 0 or with an a) or not given.
  n_lines            number of fitted lines
  sampled_from_B_v   B 0u+ v' levels whose fluorescence sampled the level
  rms_x1e3           rms of the fit, 10^-3 cm-1
  observation        the table's Observations column

Term values: E(v, J) = T + B x - D x^2 + H x^3, x = J(J+1) (signs as in Martin 1986, Hutson's convention).

Tables III-VI (added with the same copy, Martin et al. 1983, pp. 3729-3731; PDF pages 6-8), read from 200 dpi page
images. Every number was read from the image; the OCR text layer was used only to locate the tables and it garbles
several (e.g. "O. 007261", "12413,9693"). Table I and Tables VII-IX are not entered (the D0 and C5/C6/C8 fits are
dissociation parameters, not level constants).

table3_a1g_constants.csv: Table III, a 1g v = 23, 13, 8, 5 (rotation-vibration constants from X 0g+ ~ a 1g
deperturbation). Uncertainties are 2 sigma as printed (table note: "2 sigma uncertainties in the last digit"), converted
to absolute units in the *_unc columns. A blank uncertainty means the constant was held fixed (footnote b): T and B
of v = 13 and 5, H of v = 23, 13, 8 (held_fixed column lists which). D and H in 10^-7 and 10^-12 cm-1 as printed.

table4_a0p_constants.csv: Table IV, a' 0g+ v = 9, 8, 7, 6. Two rows for v = 7 (printed as two fits: the first from
61, 62 lines, the second from 67, 68 lines, rms 0.26 vs 0.74 10^-3 cm-1). The printed "Perturbed by X v = 101"
applies to v = 7 (footnote b: low-J and high-J lines give slightly different constants). H of v = 7 (both rows) and
v = 8 and 9 constants held fixed as footnoted (v = 7 H: 0 and -4.5, fixed). The v = 6 row has only T and B as printed
(no D, H, uncertainties or rms). Printed uncertainties 2 sigma as in Table III.

table5_rkr_a0p.csv: Table V, RKR inner and outer turning points (Rmin, Rmax in Angstrom) for a' 0g+ v = 0-9, as printed.
It is the potential extension referred to in the text (v = 5-9 newly extended via Table IV).

table6_xa1g_perturbations.csv: Table VI, fitted rotational perturbations X 0g+ ~ a 1g: eta (cm-1, the perturbation
parameter; printed uncertainty in parentheses, last digit, taken here as absolute), q_half = |<v_X|v_a>| (q^1/2), RC =
r centroid in Angstrom, Bvv_x1e3_cm1 = B_vv' x 10^3 in cm-1 as printed, eta_e1 = eta_e1 (dimensionless, printed).
The fourth row (X v = 106 ~ a 1g v = 23) has only eta printed; its q, RC, B and eta_e1 entries are blank. Table
footnote: the matrix element is <0g+|H|1g e> = -[J(J+1)]^1/2 eta, and eta = 2^1/2 B_vv' eta_e1. The text gives
the X-a' 0g+ matrix element as bounded (< 0.2 cm-1), not fitted; it is not entered.
"""

